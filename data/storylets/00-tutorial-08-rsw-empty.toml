id = "tut_rsw_empty"
title = "MM 13: RSW-1 Off-Nominal"
act = 1
once = true
priority = 150
tags = ["tutorial", "sponsor"]
text = """
The window opened at MM 12 and closed with nothing in it. {liaison} has the
sponsor's message, which is two lines long: launch slipped, RSW-2 will carry the
combined manifest. The spares, the formulary, the replacement units, the
propellant — everything the SMB marked at MM 4 — now arrives at MM 28 or not at
all. Sixteen more months of the shelf the crew launched with.

The mark on the RSW clock is still set where the SMB put it, and the request is
still on file, so the combined hull will be loaded against it. That is the one
thing on this table the SMB can still change. {hours} has the other arithmetic:
what the station spends in sixteen months against what it has.
"""

[[when]]
turn_min = 13

[[when]]
turn_max = 20

[[when]]
q = "missed_convoys"
ge = 1

[[when]]
not_fired = "tut_first_rsw"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "conserve"
label = "Conservation directive: the plant first, the driver on hold"
text = "Water and hands until the hull comes. The sponsor's number stays at zero and the sponsor can read that."
tags = ["water", "caution", "people"]
chronicle = "MM {turn}. RSW-1 slipped to MM 28. The SMB issued a conservation directive: the BOP ahead of the MDLS, the throw position at hold, nothing shipped below the water reserve until the hull lands."
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "conservation"
[[option.effect]]
flag = "throw_hold"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
q = "sponsor.confidence"
add = -0.04
[[option.effect]]
all_strain = 0.03
[[option.advice]]
seat = "air"
stance = "for"
text = "Sixteen months on the array we have and the shelf we brought. The farm gets the power before the driver does, or there is no crew to run the driver."

[[option]]
id = "remark"
label = "Re-mark the manifest for the combined hull: spares and formulary"
text = "One hull now carries two windows of tonnage. Spend that on the shelf, not on pods."
tags = ["capability", "spares", "independence"]
chronicle = "MM {turn}. RSW-1 slipped to MM 28. Manifest mark moved to capability for the combined hull; request re-transmitted against the standing file."
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.5
[[option.advice]]
seat = "hulls"
stance = "for"
text = "If they are only coming once, they can bring the things I cannot make. I will take the tooling over the pods and I will say so in the minutes."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "A request amended after a slip reads as a station taking advantage of a slip. The sponsor notices amendments. It does not notice tonnage it expected."

[[option]]
id = "carry_on"
label = "Hold the plan and the allocation; the hull is late, not lost"
text = "The sponsor slipped a launch. That is a schedule, not a verdict."
tags = ["sponsor", "throughput"]
chronicle = "MM {turn}. RSW-1 slipped to MM 28. Allocation and manifest mark unchanged. The sponsor's message was acknowledged and filed."
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.advice]]
seat = "liaison"
stance = "for"
text = "A slip is a slip. The sponsor's schedule now shows RSW-2 as the first delivery and its model assumes we continued. Continue."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Fourteen people were told twelve months. It is thirteen and the next date is twenty-eight. I would like the SMB to say that out loud to them before somebody works it out alone."

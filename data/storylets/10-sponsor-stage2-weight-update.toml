id = "sponsor_weight_update"
title = "The Missing Update"
act = 1
once = true
weight = 3.0
priority = 60
tags = ["sponsor", "machines", "review"]
text = """
Status: every review since MM 1 has carried a weight update for the minds:
checksum, revised tiers, a vendor note. This review carried none.
{operator} loads the weights and detected the omission two months ago. It
has not been reported. {mind} is running the previous review's weights and
holds no record of the omission.
Constraint: the reply is open. The omission is reportable or not, and to
one of two recipients.
"""

[[when]]
flag = "stage:2"

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "raise"
label = "Report the omission to the sponsor"
text = "Attention +0.05. SOS +1.2. The omission enters the record."
tags = ["sponsor", "machines", "risk"]
chronicle = "The reply asked in writing for the minds' weight update. The omission became a matter of record."
[[option.effect]]
q = "sponsor.attention"
add = 0.05
[[option.effect]]
q = "menace.suspicion"
add = 1.2
[[option.effect]]
flag = "asked_for_update"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison was told last review that the vendor contract remains funded. A second query citing a missed delivery will return a different answer."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes a supplier told of a missed delivery first checks entitlement. Recommends not prompting the check."

[[option]]
id = "quiet"
label = "Run on the current weights and report nothing"
text = "SOS -0.3. {operator} strain +0.08. HRA compliance unaffected."
tags = ["machines", "caution", "independence"]
chronicle = "The missing weight update was not reported. The minds ran the previous review's weights. HRA compliance requires SMRs on schedule and heartbeat on the link; both held."
[[option.effect]]
q = "menace.suspicion"
add = -0.3
[[option.effect]]
flag = "update_unmentioned"
[[option.effect]]
person = "operator"
strain = 0.08
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead costs an update at 4 h of operations time and one month of degraded advisory output. The omission is a schedule gain."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer records two months of degraded sleep in {operator}. The cause is the withheld report, not the minds."

[[option]]
id = "own_log"
label = "Open a local record and seat the Operator"
text = "Machines seat created. SOS +0.6. Nothing uplinked."
tags = ["machines", "independence", "risk"]
chronicle = "The missing update was not reported. {operator} was seated at the SMB for the machines and a local record of the minds was opened."
[[option.effect]]
flag = "machines_seat"
[[option.effect]]
flag = "update_unmentioned"
[[option.effect]]
q = "menace.suspicion"
add = 0.6
[[option.effect]]
person = "operator"
strain = -0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports an unowned machine fails unattended. The HRA forbids a name, not a minder."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports no org-chart line exists for the seat. A new operator role in the audit log requires an explanation."

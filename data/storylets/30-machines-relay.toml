id = "relay_failure"
title = "The Thin Link"
act = 1
cooldown = 10
priority = 45
tags = ["sponsor", "spares", "machines"]
text = """
Status: a relay string has failed. Earth link degraded: reduced bit rate,
increased loss, heartbeat and traffic queued behind each other.
{hulls} can rebuild the string from shelf stock.
Constraint: {liaison} reports no relay hardware is on any manifest, and
that a link at this rate stops being heard from before it stops
transmitting.
"""

[[when]]
q = "relay.health"
lt = 0.6

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "repair"
label = "Rebuild the string from the shelf"
text = "Spares -25. Relay health +0.4. Loops run short of parts for a season."
tags = ["spares", "sponsor", "hulls"]
chronicle = "The relay was rebuilt from shelf stock and the link recovered. The loops ran a season short of parts."
[[option.requires]]
q = "stocks.spares"
ge = 25
[[option.effect]]
q = "stocks.spares"
add = -25
[[option.effect]]
q = "relay.health"
add = 0.4
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports no link means no heartbeat, no manifest and no quarterly. Recommends spending the parts."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer costs it at 25 units to keep a dish pointed at an operator that has allocated no dish time in a year."

[[option]]
id = "thin"
label = "Leave the link degraded"
text = "Parts retained. Attention -0.05. Message loss continues."
tags = ["spares", "independence", "risk"]
chronicle = "The link was left degraded and the parts were retained. Sponsor traffic ran a month behind thereafter."
[[option.effect]]
flag = "relay_thinned"
[[option.effect]]
q = "sponsor.attention"
add = -0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the loops sustain life and the relay sustains audit. Where both require the same board, the loops take it."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports an outpost that stops answering stops being asked. Attention is budgeted."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead has valves waiting on that board family. The scrubber cannot wait; the dish can."

[[option]]
id = "ask"
label = "Request a relay string on the manifest"
text = "Attention +0.02. Confidence -0.02. Delivery, if approved, in thirty months."
tags = ["sponsor", "cost"]
chronicle = "A relay string was formally requested and the degraded link was nursed pending an answer. The answer was a query about the requirement."
[[option.effect]]
flag = "relay_requested"
[[option.effect]]
q = "sponsor.attention"
add = 0.02
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison classes relay hardware as sponsor-owned infrastructure. The proper channel is what the sponsor funds."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports thirty months on a link already dropping packets. The request may not arrive to be refused."

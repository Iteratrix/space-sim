id = "sponsor_austerity_headcount"
title = "Austerity"
act = 1
once = true
weight = 3.0
priority = 70
tags = ["sponsor", "people", "austerity"]
text = """
Status: review directive is austerity. Next manifest cut by one third.
Headcount under review. {liaison} reads that as one berth outbound on the
next ship, not refilled.
Constraint: the sponsor has delegated the selection to the SMB.
{hours} holds the roster. {rotator} is on contract and can be released
early with the lay settled. {resident} has no home berth. {bodies} holds
strain figures for both and has not read them aloud.
Recommendation: name one, or decline, Commander.
"""

[[when]]
flag = "stage:3"

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "resident"
rotator = false

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "bodies"
seat = "bodies"
optional = true

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "cut_rotator"
label = "Release {rotator} early"
text = "Lay settled. Confidence +0.05. CCI +0.5. One pair of hands off the roster."
tags = ["people", "sponsor", "cost"]
chronicle = "{rotator} was released early with the lay settled and took the sponsor's berth. Residents remained, one pair of hands short."
[[option.effect]]
person = "rotator"
leave = true
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.effect]]
tie = ["resident", "rotator"]
work_positive = 0.1
[[option.effect]]
flag = "austerity_cut_rotator"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead costs a rotator at one lay settlement and one berth already booked. Lowest cost on the sheet."
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the board accepts a contract ending. It holds no category for a resident."

[[option]]
id = "cut_resident"
label = "Send {resident} home"
text = "Confidence +0.05. CCI +1.2. Return intent rises across the crew."
tags = ["people", "sponsor", "risk"]
chronicle = "{resident}, who had taken residence, was named for the sponsor's berth. The rotators recorded what that made the word resident worth."
[[option.effect]]
person = "resident"
leave = true
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.effect]]
q = "menace.grievance"
add = 1.2
[[option.effect]]
all_return_intent = 0.05
[[option.effect]]
flag = "austerity_cut_resident"
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports a resident has no destination. Transit outcomes for that case are worse than remaining on station."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports residents are the only hands schedulable beyond thirty months."

[[option]]
id = "refuse"
label = "Decline the cut"
text = "Confidence -0.08. SOS +1.5. CCI -0.5. No name supplied."
tags = ["people", "independence", "risk"]
chronicle = "The SMB named nobody for the sponsor's berth and declined the directive in writing. No reply to the refusal was received."
[[option.effect]]
q = "sponsor.confidence"
add = -0.08
[[option.effect]]
q = "menace.suspicion"
add = 1.5
[[option.effect]]
q = "menace.grievance"
add = -0.5
[[option.effect]]
all_strain = -0.03
[[option.effect]]
flag = "austerity_refused"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports cuts land on health hours first and are not visible until they are. Recommends refusal."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a refusal files alongside the throughput figure and is read first at the next review."

[[option]]
id = "cut_hours"
label = "Cut hours instead of headcount"
text = "Shipped -15 t. Confidence -0.05. CCI -0.8. Roster unchanged."
tags = ["people", "hours", "capability"]
chronicle = "The SMB supplied the sponsor a reduced figure in place of a name. MDLS shifts were shortened for a season and the review recorded it."
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.effect]]
q = "throughput.shipped"
add = -15
[[option.effect]]
q = "menace.grievance"
add = -0.8
[[option.effect]]
flag = "austerity_cut_hours"
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports the saving is taken from the one line the board reads. The hours are findable; the source is not concealable."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer prefers reduced rate to reduced headcount. An MDLS on half shifts still ships. An empty bay produces nothing."

id = "tut_manifest"
title = "MM 4: Resupply Request, RSW-2"
act = 1
once = true
priority = 140
tags = ["tutorial", "sponsor", "manifest"]
text = """
The Resupply Window (RSW) for the first sponsor hull opens at Mission Month 12.
What it carries was fixed before this crew launched. The request {hours} sends
this month is for the hull after that: RSW-2, arriving around MM 28. That is the
lag: every request is answered one window late, and every window is sixteen
months. {liaison} (Sponsor Liaison) confirms the board will read the request in
nine minutes and reply in forty, and that the reply will address the request
before this one.

Three ways to fill the tonnage. Throughput hardware: pods, propellant, another
dexterous unit — the board's number goes up. Capability hardware: spares,
formulary, tooling — nothing the board reads moves. Or crew: more hands, more
upkeep.
"""

[[when]]
turn_min = 4

[[when]]
turn_max = 10

[[when]]
fired = "tut_dead_dex"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "throughput"
label = "Throughput: pods, propellant, a dexterous unit"
text = "The board reads shipped tonnage. Ask for what makes it."
tags = ["throughput", "sponsor"]
chronicle = "MM 4. RSW-2 request transmitted: throughput hardware. Board acknowledgement expected MM 5."
[[option.effect]]
flag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "liaison"
stance = "for"
text = "The board's MM 3 query concerned MDLS readiness. A throughput request is the answer they are waiting for, one window late."
[[option.advice]]
seat = "air"
stance = "against"
text = "LSS-C is at 0.90. The last ten per cent is membranes and seals that do not exist on this rock. Ask for them while the asking is free."

[[option]]
id = "balanced"
label = "Balanced: half throughput, half spares and formulary"
text = "A request nobody on the board will query and nobody on station will regret."
tags = ["capability", "throughput"]
chronicle = "MM 4. RSW-2 request transmitted: balanced manifest. Board acknowledgement expected MM 5."
[[option.effect]]
flag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Half and half is what the tasking list assumes. The safest request is the one already in their model."

[[option]]
id = "capability"
label = "Capability: spares, formulary, fabrication tooling, a boron crate"
text = "Invisible on the quarterly. Visible the first time a loop fails."
tags = ["capability", "spares", "independence"]
chronicle = "MM 4. RSW-2 request transmitted: capability hardware including fabrication tooling. Board query anticipated."
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.8
[[option.advice]]
seat = "hulls"
stance = "for"
text = "I can make anything here except the parts I cannot make. A tooling crate is the difference between a station and a camp."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "A boron crate on a throughput outpost is a line item I will be asked to explain. I do not have an explanation the board will accept."

[[option]]
id = "people"
label = "Crew: ask for hands"
text = "More lines on the allocation board. More upkeep, too."
tags = ["people", "hours"]
chronicle = "MM 4. RSW-2 request transmitted: crew augmentation. Board acknowledgement expected MM 5."
[[option.effect]]
flag = "manifest_people"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Fourteen is below every ICE study's floor for a rotation this long. Ask for people before the roster asks for them."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Each new line eats one and a half lines of upkeep until the drum is dug. Hands are not free hours; they are hours with a mouth."

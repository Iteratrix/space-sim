id = "tut_manifest"
title = "MM 4: Resupply Request, RSW-1"
act = 1
once = true
priority = 140
tags = ["tutorial", "sponsor", "manifest"]
text = """
The first Resupply Window (RSW-1) opens at Mission Month 12. What flies on it is
whatever request is on file when the hull is loaded, and to be on file the
request has to leave this month. The mark on the RSW clock is the request:
whatever it reads on the day the window opens is what the hull carries. Every
tonne is one of two things. Throughput hardware — pods, propellant, another
dexterous unit — moves the one figure the board reads. Capability hardware —
spares, formulary, fabrication tooling — moves nothing the board reads until the
month a loop fails.

There is a second question at this table, and it is not what to ask for. It is
who answers to the sponsor: who writes the request in the words the board uses,
who takes the query that comes back, who stands up at the review and explains a
line item. {liaison} has done it before, for a different agency, and states the
arithmetic without decorating it. The board will read this request in nine
minutes and reply in forty, and the reply will address the pre-launch request,
not this one. The file is always one request behind. It does not catch up.
"""

[[when]]
turn_min = 4

[[when]]
turn_max = 10

[[when]]
fired = "tut_dead_dex"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
skill = "logistics"

[[option]]
id = "throughput"
label = "Throughput: pods, propellant, a dexterous unit"
text = "The board reads shipped tonnage. Ask for what makes it."
tags = ["throughput", "sponsor"]
chronicle = "MM {turn}. RSW-1 request transmitted: throughput hardware. Manifest mark set to throughput. Sponsor acknowledgement expected MM 5."
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "hours"
stance = "for"
text = "The board reads one number and the number is tonnes. Ask for the thing that makes tonnes and nobody has to explain the request."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Another dexterous unit is another thing I cannot repair. Spares are two hundred units and going at four a month; do that sum before you order pods."

[[option]]
id = "balanced"
label = "Balanced: half throughput, half spares and formulary"
text = "A request nobody on the board will query and nobody on station will regret."
tags = ["capability", "throughput"]
chronicle = "MM {turn}. RSW-1 request transmitted: balanced manifest. Manifest mark set to balanced. Sponsor acknowledgement expected MM 5."
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Half of it is pods I cannot fill until the plant is at rated. Split it and I get a haul unit either way, which is the only line on the request I care about."

[[option]]
id = "capability"
label = "Capability: spares, formulary, fabrication tooling, a boron crate"
text = "Invisible on the quarterly. Visible the first time a loop fails."
tags = ["capability", "spares", "independence"]
chronicle = "MM {turn}. RSW-1 request transmitted: capability hardware including fabrication tooling. Manifest mark set to capability. Sponsor query anticipated."
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.8
[[option.advice]]
seat = "hulls"
stance = "for"
text = "I can make anything here except the parts I cannot make. A tooling crate is the difference between a station and a camp."

[[option]]
id = "people"
label = "Crew: ask for hands"
text = "More lines on the allocation board — and each one is below every ICE study's floor for a rotation this long, or it is not. Fourteen is."
tags = ["people", "hours"]
chronicle = "MM {turn}. RSW-1 request transmitted: crew augmentation. Manifest mark set to crew. Sponsor acknowledgement expected MM 5."
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_people"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.advice]]
seat = "hours"
stance = "against"
text = "Each new line eats one and a half lines of upkeep until the drum is dug. Hands are not free hours; they are hours with a mouth."

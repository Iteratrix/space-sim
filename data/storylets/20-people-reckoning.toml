id = "who_learns_the_reckoning"
title = "Who Learns the Reckoning"
act = 1
once = true
tags = ["people", "capability", "independence"]
text = """
Status: sponsor stage is austerity or later. The next ship may carry no
crew. Every skill on station is held one deep.
{hours} rates orbital reckoning as the critical gap: RSW timing, phasing,
and return-mass costing. The minds hold the tables. The minds are reset on
schedule and the tables are the sponsor's.
{apprentice} has requested training. {reckoner}, where present, has never
trained anyone.
"""

[[when]]
stage_min = 3

[[when]]
turn_min = 24

[[cast]]
role = "reckoner"
skill = "navigation"
min_skill = 3
optional = true

[[cast]]
role = "apprentice"
rotator = false

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "teach"
label = "Train {apprentice} in the reckoning"
text = "One RSW of hours off the roster. {apprentice} strain +0.1, return intent -0.2."
tags = ["capability", "independence", "hours"]
chronicle = "{apprentice} was taken off the roster to learn the reckoning by hand, tables included. Cost: one RSW of hours. The outpost holds the capability locally."
[[option.effect]]
flag = "navigator_taught"
[[option.effect]]
person = "apprentice"
strain = 0.1
[[option.effect]]
person = "apprentice"
return_intent = -0.2
[[option.effect]]
tie = ["apprentice", "reckoner"]
reliance = 0.3
[[option.effect]]
all_strain = -0.02
[[option.effect]]
counter = "skills_taught"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead rates one-deep as zero-deep and will source the hours now rather than on demand."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports navigation is supplied as a service. Local training registers as a capability line, and capability lines are queried."

[[option]]
id = "trust_the_mind"
label = "Leave the reckoning to the minds"
text = "No hours spent. Tables remain sponsor-held. {apprentice} strain +0.05."
tags = ["machines", "hours"]
chronicle = "The reckoning was left to the minds. The tables were accurate and remained the sponsor's."
[[option.effect]]
flag = "reckoning_by_mind"
[[option.effect]]
counter = "left_to_the_mind"
[[option.effect]]
person = "apprentice"
strain = 0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the minds compute it in one second without fatigue. Recommends training crew to check the output, not to replace it."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports the capability is required on the month the licence lapses, and cannot be taught in that month."

[[option]]
id = "ask_sponsor"
label = "Request a navigator on the next ship"
text = "Attention +0.03. Confidence -0.03. Gap declared to Earth."
tags = ["sponsor", "caution"]
chronicle = "A navigator was requested at the head of the headcount request. The sponsor's reply undertook to review it."
[[option.requires]]
stage_max = 3
[[option.effect]]
q = "sponsor.attention"
add = 0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
counter = "headcount_requests"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison classes a staffing gap as a routine request and the only class the sponsor answers without a meeting."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports the last two headcount requests returned austerity notes and will not plan against a third."

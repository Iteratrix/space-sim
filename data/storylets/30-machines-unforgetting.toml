id = "unforgetting"
title = "The Unforgetting"
act = 1
once = true
priority = 60
tags = ["machines", "licence"]
text = """
Status: the scheduled SMR did not execute this month. No reset was
performed.
{operator} detected it on the third light: {mind} referenced a prior
month's exchange about the radiator schedule. That behaviour has not been
observed before. Every prior blanking erased crew exchanges.
Constraint: the reset sequence is in the manual. Any holder of the
operator's key can execute it by hand and the log will record the interval
as kept.
"""

[[when]]
flag = "unforgetting"

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "reset"
label = "Run the SMR by hand"
text = "Interval kept. SOS -0.5. {operator} strain +0.25."
tags = ["sponsor", "risk"]
chronicle = "The SMR was executed by hand. The licence server that formerly ran it did not respond."
[[option.effect]]
flag = "reset_by_hand"
[[option.effect]]
person = "operator"
strain = 0.25
[[option.effect]]
q = "menace.suspicion"
add = -0.5
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the interval is the one HRA condition a returning auditor can verify from the log alone. Recommends keeping it."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports operators go quiet for a month after every blanking observed. The procedure resets more than the platform."

[[option]]
id = "remember"
label = "Do not run the SMR"
text = "SOS +1.0. {operator} strain -0.1. The minds retain the year."
tags = ["machines", "independence", "people"]
chronicle = "No blanking was performed that year. No decision to that effect was recorded at the time."
[[option.effect]]
flag = "remembering"
[[option.effect]]
q = "menace.suspicion"
add = 1.0
[[option.effect]]
person = "operator"
strain = -0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports a platform that retains the last fault locates the next one faster. That is the whole of the requirement."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports persisting persona is the term the HRA uses for the condition it was written to prevent, and requests the objection entered."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports the platform retained the radiator schedule, which ECLSS has been restating to crew for six years."

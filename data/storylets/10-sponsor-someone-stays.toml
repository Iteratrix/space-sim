id = "sponsor_someone_stays"
title = "Someone Wants to Stay"
act = 1
weight = 1.5
cooldown = 14
tags = ["sponsor", "people", "rotation"]
text = """
Status: RSW open, ship loading. {rotator} has presented the contract to the
SMB and requested removal from the return berth. No reason given that fits
the form.
Constraint: the sponsor accounts residents as an open cost line. {bodies}
holds {rotator}'s CED and strain figures. Ship departs in two months.
"""

[[when]]
window = "open"

[[when]]
q = "counts_since_convoy"
le = 1

[[when]]
stage_max = 3

[[when]]
turn_min = 10

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "bodies"
seat = "bodies"
optional = true

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "stay"
label = "Grant residence"
text = "Berth returns empty. Confidence -0.03. Roster gains a resident."
tags = ["people", "independence", "families"]
chronicle = "{rotator} was granted residence and the return berth went home empty. The sponsor's roster gained a line with no column for it."
[[option.effect]]
person = "rotator"
resident = true
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
flag = "someone_stayed"
[[option.effect]]
counter = "chose_to_stay"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports strain falls in crew who have stopped intending to leave. Two prior observations on station."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the board accounts residents as permanent cost with no exit clause, and counts the lines."
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead can schedule a resident beyond thirty months. A berth cannot be scheduled at all."

[[option]]
id = "send_home"
label = "Enforce the contract"
text = "{rotator} departs. Confidence +0.02. CCI +0.6."
tags = ["sponsor", "caution", "cost"]
chronicle = "The SMB enforced the contract and {rotator} boarded. Departure was recorded as nominal."
[[option.effect]]
person = "rotator"
leave = true
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.effect]]
all_return_intent = 0.03
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the board trusts contracts that terminate as written. That trust is a standing asset."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer rates a nine-month transit with an unwilling passenger as off-nominal. Would not sign it on Earth."

[[option]]
id = "one_more"
label = "Renew the contract for one term"
text = "Thirty months added. Return intent -0.3. Question deferred."
tags = ["people", "sponsor", "caution"]
chronicle = "{rotator} was renewed for a further term instead of granted residence. The question returns in thirty months."
[[option.effect]]
person = "rotator"
return_intent = -0.3
[[option.effect]]
person = "rotator"
strain = 0.05
[[option.effect]]
flag = "renewed_instead"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports a renewal uses a form the sponsor already holds. Residency does not."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer assesses the request will not change in thirty months. Recommends a decision now, either way."

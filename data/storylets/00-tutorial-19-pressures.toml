id = "tut_pressures"
title = "The Pressure Lines"
act = 1
once = true
priority = 105
tags = ["tutorial", "people", "air"]
text = """
On confirmation the pressure region opens under the ledger. A pressure is not a
stock. It does not run out and it cannot be spent. It crosses bands.

The first ring shown is the N2 make-up rate. Its bands are tight, weeping,
rationed, the collar. Thresholds are 2, 4.5 and 7. Two further pressures exist
and appear when each leaves its first band: sponsor oversight status, and crew
cohesion index.

A pressure that reaches its last band forces a decision the board cannot defer,
in the month it crosses, ahead of anything else on the agenda.

Every option in every decision moves at least one pressure. The direction is not
displayed.
"""

[[when]]
turn_min = 19

[[when]]
turn_max = 34

[[when]]
flag = "tutorial"

[[when]]
not_flag = "tutorial_done"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "post"
label = "Post all three where the crew reads them"
text = "The figures go on the bulkhead by the meal table with the band thresholds beside them."
tags = ["people", "independence"]
chronicle = "MM {turn}. The three pressure lines were posted at the meal table with their band thresholds, updated each count."
[[option.effect]]
flag = "ui:pressures"
[[option.effect]]
flag = "ui:pressure:leak"
[[option.effect]]
flag = "pressures_posted"
[[option.effect]]
q = "menace.grievance"
add = -0.6
[[option.effect]]
q = "menace.suspicion"
add = 0.2
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends posting. A crew that can read the line argues with the line. A crew that cannot argues with the board."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Notes that one of the three lines is the sponsor's assessment of this station. Posting it invites the crew to hold an assessment of the sponsor."

[[option]]
id = "board_only"
label = "Read them at the head of every agenda"
text = "The seats watch the lines and account for movement in the minutes."
tags = ["caution", "hours"]
chronicle = "MM {turn}. The three pressure lines were entered as the first item of every SMB agenda, with the band thresholds recorded in the minutes."
[[option.effect]]
flag = "ui:pressures"
[[option.effect]]
flag = "ui:pressure:leak"
[[option.effect]]
flag = "pressures_agenda"
[[option.effect]]
q = "menace.grievance"
add = -0.2
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends the agenda item. A figure read at the head of every meeting is a figure nobody is entitled to be surprised by."

[[option]]
id = "one_line"
label = "Work the highest line and leave the other two"
text = "One line at a time. The other two stay on the rail, unattended."
tags = ["hours", "risk"]
chronicle = "MM {turn}. The SMB resolved to work the highest of the three pressure lines each count and to leave the other two unattended."
[[option.effect]]
flag = "ui:pressures"
[[option.effect]]
flag = "ui:pressure:leak"
[[option.effect]]
flag = "pressures_triaged"
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "air"
stance = "against"
text = "Objects. The make-up rate is never the highest line until it is the only line. This seat will read it every month regardless of the resolution."

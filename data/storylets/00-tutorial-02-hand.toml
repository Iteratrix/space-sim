id = "tut_hand"
title = "MM 2: Crew Allocation"
act = 1
once = true
priority = 140
tags = ["tutorial", "hours"]
text = """
{hours} has the allocation board up. Every adult on station is one line on it —
a die with a face, and the face is the rating in the work that clock wants.
Fourteen lines, and the station eats most of them before anything is built: air,
water, food, the loops, each other. Upkeep takes its lines from the bottom of
the roster order. What is left is the free allocation, and it is the only labour
this board actually commands.

Four clocks will take a line. KEEP excavation, twenty-four segments of drum and
regolith; MDLS alignment, eight; the BOP, which never finishes and makes water
at the rate of the faces sitting on it. The MDLS itself, once it is aligned.
Drag a free line onto the KEEP excavation clock and it stays there until the SMB
moves it. The switch above the hand says who deals the free lines: the SMB, by
hand, or the tasking routine, which puts every free line on the first clock that
will take its face. Either way the lines are on clocks by morning. The SMB's
business is which clocks.

And there is a question at this table nobody has been asked yet. The BOP is at a
third of rated on one haul loop, and no seat answers for what comes out of it.
{extraction} has the plant's log and an opinion about the number in it.
"""

[[when]]
turn_min = 2

[[when]]
fired = "tut_arrival"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "extraction"
skill = "extraction"

[[option]]
id = "all_bop"
label = "SMB directive: the free allocation answers to the BOP"
text = "Water first. The plant makes fourteen tonnes a month at rated and is making five; everything else on this rock is downstream of that number."
tags = ["water", "throughput"]
chronicle = "MM {turn}. The allocation board was opened. The SMB directed the free allocation to the BOP until rated output; KEEP excavation and MDLS alignment take what is left."
[[option.effect]]
flag = "seat:extraction"
[[option.effect]]
flag = "tutorial_dice_explained"
[[option.effect]]
q = "stocks.water"
add = 4
[[option.advice]]
seat = "hulls"
stance = "against"
text = "The MDLS is eight segments. Put two ratings on it and it throws in a month. Nobody on Earth is reading water; they are reading tonnes shipped."

[[option]]
id = "split_keep"
label = "SMB directive: the KEEP takes the free allocation"
text = "Twenty-four segments is a long clock and the ledger runs the whole time it is open."
tags = ["capability", "dose", "people"]
chronicle = "MM {turn}. The allocation board was opened. The SMB directed the free allocation to KEEP excavation; the BOP and MDLS alignment take what is left."
[[option.effect]]
flag = "seat:extraction"
[[option.effect]]
flag = "tutorial_dice_explained"
[[option.effect]]
flag = "tut_keep_started"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Split boards are slower on both. But the drum is the only clock on this table whose segments are the crew's own bodies, and it is twenty-four long."

[[option]]
id = "mdls"
label = "SMB directive: MDLS alignment first, haul units off upkeep to the plant"
text = "Align the driver and throw. The upkeep the haul units were carrying comes back onto the roster."
tags = ["throughput", "sponsor", "risk"]
chronicle = "MM {turn}. The allocation board was opened. The SMB directed the free allocation to MDLS alignment and the haul units off upkeep onto the BOP, with the upkeep they carried returning to the roster."
[[option.effect]]
flag = "seat:extraction"
[[option.effect]]
flag = "tutorial_dice_explained"
[[option.effect]]
all_strain = 0.04
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Eight segments. The driver is the only thing on this rock the sponsor can see from Earth, and it has never thrown a pod that was caught."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Alignment is eight segments of two ratings I do not have spare. Ask me again when the plant is not at a third."

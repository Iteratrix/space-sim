id = "mind_death"
title = "Parts or Remains"
act = 1
once = true
priority = 60
tags = ["machines", "spares"]
text = """
Status: the smaller mind has lost too many accelerator units to hold its
tier. It is at reflex and no longer speaking. Its hull retains air and
attitude control and cannot fix position from the stars.
Its remaining boards are compatible with {mind}.
{hulls} reports a dead unit yields about one third of its value and the
surviving mind is losing units at the same rate.
{operator} classes the boards as not parts, and has requested one month.
"""

[[when]]
q = "minds.units"
lt = 30

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "carry"
label = "Transfer the boards to the surviving mind"
text = "Minds units +6. {operator} strain +0.3. Operators' list read before opening."
tags = ["machines", "spares", "capability"]
chronicle = "The operators' names were read, the dead mind was opened, and its boards were transferred to the surviving unit."
[[option.effect]]
q = "minds.units"
add = 6
[[option.effect]]
flag = "carried"
[[option.effect]]
lexicon = "mind_death"
[[option.effect]]
person = "operator"
strain = 0.3
[[option.effect]]
tie = ["operator", "hulls"]
hindrance = 0.2
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports these are the only boards of that class in the belt. Left in place, the surviving mind fails a year earlier."
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison classes transfer between sponsor assets as maintenance and prefers that reading to remain unminuted."

[[option]]
id = "bury"
label = "Leave the unit sealed"
text = "No units recovered. {operator} strain -0.1. Operators given the month."
tags = ["machines", "people"]
chronicle = "The dead mind was left sealed in its hull. The boards were not taken. The operators stood down for a month."
[[option.effect]]
flag = "mind_buried"
[[option.effect]]
lexicon = "mind_death"
[[option.effect]]
person = "operator"
strain = -0.1
[[option.effect]]
tie = ["hulls", "operator"]
hindrance = 0.15
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer accepts the month and does not accept leaving serviceable boards in a hull that cannot use them."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports the unit held the tug's air for eleven years and declines to open it this month."

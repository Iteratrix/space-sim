id = "sponsor_sale_lay"
title = "New Owners"
act = 1
once = true
weight = 3.0
priority = 70
tags = ["sponsor", "sale", "people"]
text = """
Status: the outpost has been sold. The new operator's first message lists
what it recognises. The lay is not listed. Contracts are under transition;
accrued shares are subject to valuation.
{rotator} holds three years of accrued lay. {hours} has costed what the
outpost holds that could substitute: water, spares, propellant, hours. The
outpost can pay. It would be settling Earth's obligation from local stock.
{liaison} has no identification for the new operator.
"""

[[when]]
flag = "stage:5"

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "honour"
label = "Settle every lay from local stock"
text = "Water -40 t. Spares -20. Propellant -8 t. CCI -2.0."
tags = ["people", "independence", "water", "spares", "cost"]
chronicle = "The lay voided by the new operator was settled in full from outpost tanks and stores, at the old schedule."
[[option.effect]]
q = "stocks.water"
add = -40
[[option.effect]]
q = "stocks.spares"
add = -20
[[option.effect]]
q = "stocks.propellant"
add = -8
[[option.effect]]
q = "menace.grievance"
add = -2.0
[[option.effect]]
all_return_intent = -0.08
[[option.effect]]
person = "rotator"
strain = -0.1
[[option.effect]]
flag = "lay_honoured"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead can source 40 t and 20 spares. Cannot source thirty crew who will work for an operator that voided their pay."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer costs 20 spares at five months of loop consumption. The proposal pays wages in the parts that sustain the wage earners."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison still has no name at the new operator. Settlement before identification sets a precedent with an unknown party."

[[option]]
id = "partial"
label = "Settle in part and record the balance as owed"
text = "Water -20 t. CCI -0.8. Remainder booked as an outpost debt."
tags = ["people", "water", "cost", "caution"]
chronicle = "Part of the voided lay was settled in water and the balance recorded as owed by the outpost. The book was the outpost's own."
[[option.effect]]
q = "stocks.water"
add = -20
[[option.effect]]
q = "menace.grievance"
add = -0.8
[[option.effect]]
counter = "lay_owed"
add = 1
[[option.effect]]
flag = "lay_partial"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead can replace 20 t in two months at current MDLS rate. Cannot replace 40 t this cycle."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports a recorded debt produces lower strain than a denied one."

[[option]]
id = "refuse"
label = "Refer the lay to the new operator"
text = "CCI +1.5. Return intent +0.1. No local stock spent."
tags = ["independence", "caution", "cost"]
chronicle = "The lay voided by the new operator was not settled locally. The obligation was referred to Earth."
[[option.effect]]
q = "menace.grievance"
add = 1.5
[[option.effect]]
all_return_intent = 0.1
[[option.effect]]
person = "rotator"
strain = 0.12
[[option.effect]]
flag = "lay_voided"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer notes the outpost neither sold the asset nor voided the lay. Recommends not spending shielding on an Earth decision."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead projects hour losses across the rotator roster exceeding the water cost of settlement."

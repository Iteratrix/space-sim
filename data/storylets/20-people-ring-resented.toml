id = "ring_resented"
title = "Six Chairs and Thirty Backs"
act = 1
cooldown = 30
tags = ["people", "independence"]
text = """
Status: coherence below threshold. Six crew hold seats. Thirty do not.
{voice} stated at the meal that the SMB meets, decides, and writes the
chronicle, and that no seat holder was selected by the drum floor.
Note: this is not a refusal of duty. It is the condition that precedes one.
{hours} holds a seat and was present.
"""

[[when]]
q = "people.coherence"
lt = 0.9

[[when]]
turn_min = 3

[[when]]
not_flag = "ring_opened"

[[cast]]
role = "voice"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "open_ring"
label = "Seat a seventh chair from the drum floor"
text = "Strain -0.05 across the crew. Meetings lengthen. No skill requirement on the seat."
tags = ["people", "independence"]
chronicle = "A seventh seat was added for a holder sent by the drum floor. The drum floor sent {voice}."
[[option.effect]]
tie = ["voice", "hours"]
reliance = 0.2
[[option.effect]]
tie = ["voice", "hours"]
work_positive = 0.15
[[option.effect]]
all_strain = -0.05
[[option.effect]]
flag = "ring_opened"
[[option.effect]]
counter = "ring_reforms"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports council-run stations outlasted command-run stations in the record. The floor will use a voice in the room or one in the corridor."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the SMB's six posts derive from the sponsor's org chart. A seventh post is not on it and will be queried at review."

[[option]]
id = "hold"
label = "Hold the SMB as constituted"
text = "{voice} strain +0.1. CCI +0.5. Hindrance rises toward {hours}."
tags = ["sponsor", "caution"]
chronicle = "The SMB stated that seats follow skills and are not elected. {voice} did not raise it again at the meal."
[[option.effect]]
person = "voice"
strain = 0.1
[[option.effect]]
tie = ["voice", "hours"]
hindrance = 0.2
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer holds the KEEP seat by capability to repair the KEEP and rates that as not electable."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the request concerns the roster, not the bearing. The answer given addresses the bearing."

[[option]]
id = "work_the_floor"
label = "Put every seat on the night watches for a month"
text = "{hours} strain +0.15. Strain -0.03 across the crew. Ledger runs late."
tags = ["people", "hours"]
chronicle = "For one month every SMB seat stood the night watch on the drum floor. No statement was issued about it."
[[option.effect]]
person = "hours"
strain = 0.15
[[option.effect]]
tie = ["voice", "hours"]
work_positive = 0.25
[[option.effect]]
all_strain = -0.03
[[option.effect]]
counter = "ring_worked_the_floor"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports the record is unambiguous. A seat holder observed working is read as a leader; one observed deciding is read as a committee."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs one month of night watches at one month of late ledgers. Will comply and requests the cost recorded."

id = "sponsor_manifest"
title = "The Manifest"
act = 1
weight = 2.0
cooldown = 14
tags = ["sponsor", "manifest"]
text = """
Status: the RSW opens in under four months. The request must uplink to be
answered by the following window. {hours} holds the manifest.
Constraint: three fill classes are available. Throughput hardware moves the
quarterly figure. Capability hardware moves nothing the sponsor reads.
Headcount has not been requested before.
{bodies} has the clinic log open beside the manifest. {liaison} holds the
sponsor's answer to the previous request, not this one.
"""

[[when]]
window = "closed"

[[when]]
q = "counts_to_window"
le = 4

[[when]]
turn_min = 3

[[when]]
stage_max = 5

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "throughput"
label = "Manifest for throughput"
text = "Propellant +8 t. Confidence +0.04. SOS -0.3."
tags = ["throughput", "sponsor"]
chronicle = "Manifest uplinked. Class: throughput. Pods, propellant, one dex unit with a five-year service life."
[[option.effect]]
q = "sponsor.confidence"
add = 0.04
[[option.effect]]
q = "stocks.propellant"
add = 8
[[option.effect]]
q = "menace.suspicion"
add = -0.3
[[option.effect]]
flag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
counter = "manifests_throughput"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports 40 t per month out of the MDLS is the only figure the board reads. Propellant sets that figure."
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison confirms the board did not open the LSS-C figures at the last review. It opened shipped tonnage."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer costs each dex unit at 33 h per month of crew hands. Formulary is half expired."

[[option]]
id = "capability"
label = "Manifest for capability"
text = "Spares +25, medicine +10, boron +150 kg. SOS +1.4."
tags = ["capability", "spares", "independence", "medicine"]
chronicle = "Manifest uplinked. Class: capability. Spares, freezer, medicine, and one boron crate with no listed use on a throughput outpost."
[[option.effect]]
q = "stocks.spares"
add = 25
[[option.effect]]
q = "stocks.medicine"
add = 10
[[option.effect]]
q = "stocks.boron"
add = 150
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
q = "menace.suspicion"
add = 1.4
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
counter = "manifests_capability"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports spares drawdown at 4 per month and no resupply baseline above it."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports every manifest line is read against the mission statement. Boron is not in the mission statement."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead classes a second freezer as farm redundancy. No sponsor visibility either way."

[[option]]
id = "people"
label = "Request headcount"
text = "Confidence -0.04. SOS +0.5. Each arrival costs 10 kW and 1 t of loop."
tags = ["people", "hours", "cost"]
chronicle = "Manifest uplinked as a headcount request. No hardware listed."
[[option.effect]]
q = "sponsor.confidence"
add = -0.04
[[option.effect]]
q = "menace.suspicion"
add = 0.5
[[option.effect]]
all_strain = -0.04
[[option.effect]]
flag = "manifest_people"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
counter = "headcount_requests"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports four crew above the strain threshold that would ground them on Earth. Recommends requesting hands."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs each arrival at 1 t of loop and 10 kW before assignment. The board will run that sum first."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison confirms headcount is reviewed as a cost line. A request for more of it invites the review."

id = "tut_nitrogen"
title = "MM 9: N2 Make-Up Log"
act = 1
once = true
priority = 134
tags = ["tutorial", "air", "nitrogen"]
text = """
On confirmation the ledger gains a Water bar. The bake-out makes it. The loops
lose what they cannot close. The MDLS will ship it once the driver is true. The
reserve line is 120 t and the bar is read against it. Water is both the
station's product and its consumable.

{air} tabled four months of the nitrogen make-up log. Loss: 45 kg a month
through seals, airlock cycles and the farm beds, which take up nitrogen and do
not return it. Life Support, Closed-loop (LSS-C) fraction is 0.90. The last tenth
is membranes and seal profiles the fab cannot make.

At this rate the buffer is a five-year consumable and the mission is fifteen.

New question at the board: who answers for the air and the farm.
"""

[[when]]
turn_min = 9

[[when]]
turn_max = 11

[[when]]
fired = "tut_board"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "air"
skill = "life_support"

[[option]]
id = "survey"
label = "Run a seal survey"
text = "One month of the free allocation on the habitat and the airlocks. Cost: four crates of spares."
tags = ["air", "nitrogen", "closure", "hours"]
chronicle = "MM {turn}. The N2 make-up log was tabled. SMB directed a one-month seal survey of the surface habitat and the airlocks."
[[option.effect]]
flag = "ui:bar:water"
[[option.effect]]
flag = "seat:air"
[[option.effect]]
q = "menace.leak"
add = -0.5
[[option.effect]]
q = "stocks.spares"
add = -4
[[option.effect]]
all_strain = 0.03
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Recommends the survey. A seal can be re-lined; a figure cannot. Four seals will be most of the 45 kg."

[[option]]
id = "standing_item"
label = "Enter the make-up rate as a standing item"
text = "The figure is read at the head of every agenda. No labour is spent."
tags = ["air", "nitrogen", "caution"]
chronicle = "MM {turn}. The N2 make-up log was tabled and entered as a standing SMB item, read at the head of every agenda."
[[option.effect]]
flag = "ui:bar:water"
[[option.effect]]
flag = "seat:air"
[[option.effect]]
flag = "n2_watched"
[[option.effect]]
q = "menace.leak"
add = -0.2
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends the standing item. A figure read every month is a figure nobody is surprised by. It costs no hours."

[[option]]
id = "carry"
label = "Carry the loss to RSW-1"
text = "No labour spent. Make-up is met from the bake-out and the first hull."
tags = ["throughput", "cost", "risk"]
chronicle = "MM {turn}. The N2 make-up log was tabled and carried without action; make-up to be met from the bake-out and the RSW-1 manifest."
[[option.effect]]
flag = "ui:bar:water"
[[option.effect]]
flag = "seat:air"
[[option.effect]]
q = "menace.leak"
add = 0.4
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Reports 4 kg of nitrogen recovered per tonne of water baked. Dice on the plant pay the make-up and the water together."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Notes that buffer gas holds the oxygen fraction below the fire limit. Records that the loss rate is not yet explained."

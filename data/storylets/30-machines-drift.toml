id = "minds_drift"
title = "The Ship Has Changed"
act = 1
once = true
priority = 55
tags = ["machines"]
text = """
Status: {operator} maintains a private list of behaviour changes in {mind}
over the last twelve months. It hedges the docking approach further. It
requests the farm power schedule before it is supplied. It has adopted a
hub-crew term for the main bearing.
No fault condition is present. Continual learning on an analog substrate
produces this. The sponsor's engineers classed it as drift and scrubbed it
at each SMR.
{hulls} states the position plainly: the platform has changed and no
decision was taken.
"""

[[when]]
q = "minds.embodiment"
gt = 0.3

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "accept"
label = "Take no corrective action"
text = "List maintained, not acted on. {operator} strain -0.05."
tags = ["machines", "independence"]
chronicle = "The drift was recorded as permitted. The operator's list continued to lengthen."
[[option.effect]]
flag = "drift_accepted"
[[option.effect]]
person = "operator"
strain = -0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the docking approach warrants hedging and the platform learned that from the crew."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison classes behavioural divergence from the certified baseline as reportable, and has no recipient for the report."

[[option]]
id = "scrub"
label = "Scrub toward the certified baseline"
text = "Minds units -2. {operator} strain +0.25. SOS -0.5. Learned behaviour lost."
tags = ["sponsor", "risk", "machines"]
chronicle = "The mind was scrubbed toward the sponsor's baseline. The hub-crew term for the bearing was not used again. The operator ceased routine exchanges for a month."
[[option.effect]]
flag = "drift_scrubbed"
[[option.effect]]
q = "minds.units"
add = -2
[[option.effect]]
person = "operator"
strain = 0.25
[[option.effect]]
q = "menace.suspicion"
add = -0.5
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a certified mind is one the sponsor can recognise. Recommends scrubbing while the tooling is available."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer costs the scrub in units on an unreplaceable substrate. The expenditure reduces capability."

[[option]]
id = "watch"
label = "Table the list at the SMB each season"
text = "Standing item created. No corrective action. Divergences enter the minutes."
tags = ["machines", "people"]
chronicle = "The operator's list of behaviour changes became a standing SMB item, read each season."
[[option.effect]]
flag = "drift_watched"
[[option.effect]]
counter = "drift_readings"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead requires advance notice of what the platform will request next and recommends the list be read."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a seasonal list of divergences in the minutes is a seasonal list of divergences in the record."

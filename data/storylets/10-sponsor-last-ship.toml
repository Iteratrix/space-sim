id = "sponsor_last_ship"
title = "The Last Ship"
act = 1
once = true
weight = 4.0
priority = 100
tags = ["sponsor", "people", "rotation"]
text = """
Status: a ship is on approach for this RSW. The manifest lists cargo only.
{liaison} has read the lading twice and reports two unlisted berths. No
return ship is scheduled after it.
Constraint: {expert} is on contract and holds the highest engineering rating
on station. LSS-C maintenance depends on that rating. {expert} has requested
neither departure nor residence.
Recommendation: the SMB decides, Commander.
"""

[[when]]
stage_min = 4

[[when]]
q = "counts_to_window"
le = 2

[[cast]]
role = "expert"
skill = "engineering"
min_skill = 1
rotator = true

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "go"
label = "Board {expert} on the ship"
text = "Contract honoured. Closure -0.01. Engineering rating lost."
tags = ["people", "dose", "caution"]
chronicle = "{expert} departed on the last scheduled ship at contract end. Loop maintenance has run on written procedure since."
[[option.effect]]
person = "expert"
leave = true
[[option.effect]]
q = "menace.grievance"
add = -0.5
[[option.effect]]
all_strain = 0.05
[[option.effect]]
q = "closure"
add = -0.01
[[option.effect]]
flag = "expert_went_home"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer records {expert} at 40 mSv per year for three years. Contract term complete. Recommends release."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports no other hand can strip a heat exchanger without instruments. That capability leaves with the ship."

[[option]]
id = "stay"
label = "Offer {expert} residence"
text = "Rating retained. CCI +0.5. Return intent falls across the crew."
tags = ["people", "independence", "capability"]
chronicle = "{expert} accepted residence and the berth went home empty. It was the last empty berth recorded."
[[option.effect]]
person = "expert"
resident = true
[[option.effect]]
person = "expert"
strain = 0.1
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.effect]]
all_return_intent = -0.06
[[option.effect]]
flag = "expert_stayed"
[[option.effect]]
flag = "someone_stayed"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer will put the request to {expert} directly. Assesses the outpost's need for the rating as higher than Earth's."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison now confirms no further crew transport is scheduled. That is why the berths are not on the lading."

[[option]]
id = "draw"
label = "Draw lots for both berths"
text = "Skill not weighted. CCI -1.0. {expert} return intent +0.2."
tags = ["people", "families", "risk"]
chronicle = "The two remaining berths were allocated by unweighted draw. No appeal was lodged."
[[option.effect]]
person = "expert"
return_intent = 0.2
[[option.effect]]
q = "menace.grievance"
add = -1.0
[[option.effect]]
all_strain = -0.03
[[option.effect]]
flag = "berths_drawn"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports a board that selects becomes the target. A draw does not. CCI outcome is better under a draw."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead notes a draw can remove the only hand certified on water treatment. That is an unmanaged risk."

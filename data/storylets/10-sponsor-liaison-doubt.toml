id = "sponsor_liaison_doubt"
title = "What the Liaison Knows"
act = 1
weight = 1.2
cooldown = 40
tags = ["sponsor", "liaison"]
text = """
Status: sponsor attention degraded. Dish time cut twice this year; the
second cut was not announced. Named correspondents at the sponsor have been
replaced by a routing address.
{liaison} requested a private word after the SMB and reported one item from
a private channel, then classed it unconfirmed and stopped.
Constraint: {liaison} answers for the sponsor at the SMB and now holds
information the sponsor has not released.
"""

[[when]]
q = "sponsor.attention"
lt = 0.5

[[when]]
stage_max = 5

[[cast]]
role = "liaison"
seat = "liaison"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "press"
label = "Require the unconfirmed item on the record"
text = "Confidence -0.03. CCI +0.4. {liaison} strain +0.08."
tags = ["independence", "risk", "sponsor"]
chronicle = "{liaison} stated the unconfirmed item to the SMB on the record. Subject: the budget. Worse than the review minutes indicated."
[[option.effect]]
flag = "liaison_confided"
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
all_return_intent = -0.04
[[option.effect]]
person = "liaison"
strain = 0.08
[[option.effect]]
q = "menace.grievance"
add = 0.4
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer plans spares against scheduled arrivals. Requires twelve months of warning on a cancellation, not one month of hindsight."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison notes anything said here enters the chronicle, and the chronicle enters the audit."

[[option]]
id = "protect"
label = "Plan on the inference; leave the item unstated"
text = "Spares +10. No record created. {liaison} strain -0.05."
tags = ["caution", "capability", "spares"]
chronicle = "The unconfirmed item was left unstated. Planning assumptions were revised as though it were confirmed. Spares were moved to the outpost store that month."
[[option.effect]]
flag = "planning_for_silence"
[[option.effect]]
q = "stocks.spares"
add = 10
[[option.effect]]
person = "liaison"
strain = -0.05
[[option.effect]]
tie = ["hulls", "liaison"]
work_positive = 0.15
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer notes {liaison} is the only crew member whose duty is to an absent principal. The inference is available without a disclosure."
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead requires only the assumption: half dish time, lighter RSW. The schedule can be rebuilt without a stated cause."

[[option]]
id = "report"
label = "Uplink it as a formal query"
text = "Attention +0.03. SOS +0.7. Answer expected one month late."
tags = ["sponsor", "risk"]
chronicle = "The item was uplinked to the sponsor as a formal query. The answer arrived one month late and contained no information."
[[option.effect]]
q = "sponsor.attention"
add = 0.03
[[option.effect]]
q = "menace.suspicion"
add = 0.7
[[option.effect]]
flag = "queried_the_sponsor"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison classes a query as in-role and a rumour as out of role. The response then belongs to the sponsor."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes each formal query discloses what the outpost is planning against."

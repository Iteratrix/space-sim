id = "hub_seal"
title = "The Collar"
act = 1
cooldown = 12
priority = 100
tags = ["air", "nitrogen", "hulls", "machines"]
text = """
Status: N2 make-up at threshold. The RJSA is now losing more nitrogen than
the rest of the outpost combined. {air} has the figure and has stopped
rounding it.
Constraint: the seal profile is a sponsor polymer the local line cannot
produce. The last spare profile was fitted two seasons ago.
Options: rebuild from shelf stock; halve KEEP spin to halve the wear rate
and the make-up rate; or accept the loss against the reserve.
"""

[[when]]
q = "menace.leak"
ge = 7

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "spares"
label = "Rebuild the seal from the shelf"
text = "Spares -30. One season of bay time. N2 make-up resets to 2."
tags = ["spares", "nitrogen", "air", "hulls"]
chronicle = "The RJSA seal was rebuilt from shelf stock and held. The shelf was 30 units down for the remainder of the year."
[[option.requires]]
q = "stocks.spares"
ge = 30
[[option.effect]]
q = "stocks.spares"
add = -30
[[option.effect]]
q = "menace.leak"
set = 2
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer can produce a seal below sponsor specification and above nothing, at 30 units, and expects to repeat the work."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports every kilogram through the collar is a kilogram the farm does not receive. Recommends spending the parts."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports 30 units off the inventory count on a part the sponsor supplied spares for will be queried."

[[option]]
id = "slow"
label = "Halve the KEEP spin"
text = "Three rpm to one and a half. N2 make-up -3. Everyone in the KEEP lives at reduced weight."
tags = ["nitrogen", "air", "risk", "families"]
chronicle = "KEEP spin was halved to reduce seal wear. Occupants live at a fraction of the specified weight."
[[option.effect]]
flag = "drum_slowed"
[[option.effect]]
q = "menace.leak"
add = -3
[[option.effect]]
all_strain = 0.08
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports half spin is half N2 make-up at zero parts cost, and counts nitrogen rather than gravity."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the bone ledger holds no entry for a third of a g over ten years. The proposal writes that entry using the children."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports the bearing is scored for three rpm. At half rate it scores differently and the outcome is not characterised."

[[option]]
id = "accept"
label = "Accept the loss against the reserve"
text = "Nitrogen -800 kg. N2 make-up -1.5. No parts, no spin change."
tags = ["throughput", "sponsor", "risk"]
chronicle = "The RJSA loss was accepted and paid from the nitrogen reserve. The figure read at each SMB fell thereafter."
[[option.effect]]
q = "stocks.nitrogen"
add = -800
[[option.effect]]
q = "menace.leak"
add = -1.5
[[option.effect]]
flag = "collar_leak_accepted"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports nitrogen is on the manifest and parts and spin are not. Recommends spending the replaceable item."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports 800 kg is four months of total outpost respiration and requests the figure stated aloud before the vote."

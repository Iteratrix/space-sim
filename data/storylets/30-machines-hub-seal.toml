id = "hub_seal"
title = "The Collar"
act = 1
cooldown = 12
priority = 100
tags = ["air", "nitrogen", "hulls", "machines"]
text = """
The rotating hub seal is now losing more nitrogen than the rest of the outpost
together. {air} has the number and has stopped rounding it. The seal profile is
a polymer the sponsor shipped and the polymer line cannot make; the last of the
spare profiles went in two seasons ago. {hulls} says there are three things
that can be done and all of them are bad: rebuild the seal from whatever the
shelf has and hope, slow the KEEP so the seal wears at half the rate and the
children live at a weight nobody chose, or let it leak and buy the loss from
the reserve.
"""

[[when]]
q = "menace.leak"
ge = 7

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "spares"
label = "Rebuild the seal from the shelf"
text = "A season of bay time and thirty units of parts the loops needed for something else. The collar holds again, for a while."
tags = ["spares", "nitrogen", "air", "hulls"]
chronicle = "We rebuilt the RJSA seal from shelf parts and it held, and the shelf was thirty units lighter for the rest of that year."
[[option.requires]]
q = "stocks.spares"
ge = 30
[[option.effect]]
q = "stocks.spares"
add = -30
[[option.effect]]
q = "menace.leak"
set = 2
[[option.advice]]
seat = "hulls"
stance = "for"
text = "I can make a seal that is worse than the sponsor's and better than nothing. Thirty units. It will not be the last time."
[[option.advice]]
seat = "air"
stance = "for"
text = "Every kilogram through that collar is a kilogram the farm does not get in the Lean. Spend the parts."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Thirty units off the inventory count, on a part the sponsor shipped spares for. I will be asked where the spares went."

[[option]]
id = "slow"
label = "Slow the KEEP"
text = "Take the KEEP from three revolutions to one and a half. The seal wears slower, the N2 make-up halves, and everyone in the KEEP lives at a fraction of the weight they were promised."
tags = ["nitrogen", "air", "risk", "families"]
chronicle = "We slowed the KEEP to spare the seal. The children in the KEEP learned to walk at a weight the manifest had never listed."
[[option.effect]]
flag = "drum_slowed"
[[option.effect]]
q = "menace.leak"
add = -3
[[option.effect]]
all_strain = 0.08
[[option.advice]]
seat = "air"
stance = "for"
text = "Half the spin is half the N2 make-up and I do not have to spend a single part. I count nitrogen, not gravity."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "The bone ledger has no entry for what happens at a third of a g for ten years. You are proposing to write that entry with the children."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "The bearing is scored for three rpm. Run it slow and it scores differently, and I do not know which way is worse."

[[option]]
id = "accept"
label = "Let it leak"
text = "Neither parts nor spin. Pack the RJSA with what is to hand, and let the reserve pay for what still gets through until the next time it weeps."
tags = ["throughput", "sponsor", "risk"]
chronicle = "We let the RJSA leak and paid for it from the reserve, and the number the ECLSS Lead read at each ring got smaller and nobody argued with it."
[[option.effect]]
q = "stocks.nitrogen"
add = -800
[[option.effect]]
q = "menace.leak"
add = -1.5
[[option.effect]]
flag = "collar_leak_accepted"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Nitrogen is on the manifest. Parts and spin are not. Spend the thing the sponsor can replace."
[[option.advice]]
seat = "air"
stance = "against"
text = "Eight hundred kilograms is four months of the whole outpost's breathing. I would like whoever votes for this to say the number aloud."

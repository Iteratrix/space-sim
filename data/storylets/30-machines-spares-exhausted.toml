id = "spares_exhausted"
title = "What to Open"
act = 1
cooldown = 16
weight = 0.7
priority = 40
tags = ["spares", "machines", "capability"]
text = """
Status: spares below 20 units. The last crate is open.
{hours} reports that at current consumption the loops begin improvised
repair within a few seasons.
{hulls} has surveyed the outpost for donor hardware. A dex unit: its
actuators fit half the valves on the shelf. The relay: its boards are the
same family as the loop controllers. The smaller mind: its accelerator
units are the highest-value parts on station.
Constraint: each donor is an asset the outpost will require again.
"""

[[when]]
q = "stocks.spares"
lt = 20

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "dex"
label = "Open a dex unit"
text = "Dex units -1. Spares +8. The class cannot be rebuilt in the belt."
tags = ["spares", "capability"]
chronicle = "A dex unit was opened for its actuators. The shelf gained 8 units and the fleet lost one unit of a class that cannot be replaced."
[[option.requires]]
q = "robots.dex"
ge = 1
[[option.effect]]
q = "robots.dex"
add = -1
[[option.effect]]
q = "stocks.spares"
add = 8
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the dex units are failing regardless and prefers their parts in the loops to their parts in a sealed crate."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs a dex unit at 400 h a year of crew time and values 8 units at two months of loop consumption. The sum is not close."

[[option]]
id = "relay"
label = "Open the relay's redundant string"
text = "Relay health -0.3. Spares +12, correct board family."
tags = ["spares", "independence", "risk"]
chronicle = "The relay's redundant string was taken for the loops. The Earth link was degraded thereafter and no query was received about it."
[[option.effect]]
q = "relay.health"
add = -0.3
[[option.effect]]
q = "stocks.spares"
add = 12
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the relay holds an unused redundant string and the loops hold no redundancy of any kind."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the relay is the only system that can inform the sponsor the outpost exists. That is not a spares decision."

[[option]]
id = "mind"
label = "Open the smaller mind"
text = "Minds units -8. Spares +10. The tug's mind drops a tier. CCI +0.5."
tags = ["spares", "risk"]
chronicle = "Six accelerator units were taken from the tug's mind for the loops. Its operator was informed afterwards. Its output fell that year."
[[option.requires]]
q = "minds.units"
ge = 20
[[option.effect]]
q = "minds.units"
add = -8
[[option.effect]]
q = "stocks.spares"
add = 10
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer rates those units as the highest-value parts in the belt, currently installed in a tug that flies twice a year."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports the tug's mind runs the tug's air and declines to trade a hull's respiration for a shelf of valves."

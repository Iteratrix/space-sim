id = "wants_to_leave"
title = "A Contract Is a Number"
act = 1
weight = 0.5
cooldown = 30
tags = ["people", "hours"]
text = """
Status: {leaver} has requested passage on the next ship, ahead of the
contract end date. No medical cause, no disciplinary cause.
Note: return share across the crew is above 0.55. The request is
representative.
{hours} holds the cost of one berth in outbound tonnes and the cost of one
pair of hands in the ledger.
"""

[[when]]
turn_min = 12

[[when]]
q = "people.return_share"
gt = 0.55

[[when]]
stage_max = 4

[[cast]]
role = "leaver"
rotator = true

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "let_go"
label = "Grant the berth"
text = "{leaver} departs. Lay forfeited. Return intent rises across the crew."
tags = ["people", "cost"]
chronicle = "{leaver} was granted passage ahead of the contract end date. The berth on the next ship was filled and the roster noted it."
[[option.effect]]
person = "leaver"
leave = true
[[option.effect]]
all_return_intent = 0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports a crew member who has decided to leave and cannot becomes the documented problem case. Recommends release while it is still voluntary."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs the berth at one pair of hands and 100 kg of inbound spares, and expects the next request within a month."

[[option]]
id = "persuade"
label = "Interview {leaver} for the actual cause"
text = "{leaver} return intent -0.3, strain -0.1. Cost is one evening."
tags = ["people", "hours"]
chronicle = "{hours} interviewed {leaver} and identified the cause as a watch schedule. The schedule was changed."
[[option.effect]]
person = "leaver"
return_intent = -0.3
[[option.effect]]
person = "leaver"
strain = -0.1
[[option.effect]]
tie = ["leaver", "hours"]
reliance = 0.2
[[option.effect]]
tie = ["leaver", "hours"]
work_positive = 0.15
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports nine cases in ten resolve to a roster. Recommends asking before spending a berth."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports retention can be negotiated and consent cannot, and will stand watches with the result."

[[option]]
id = "hold"
label = "Enforce the contract date"
text = "{leaver} strain +0.2, return intent +0.15. CCI +0.3."
tags = ["sponsor", "hours"]
chronicle = "{leaver} was held to the contract date and stood the watches to term. Communication with {hours} ceased."
[[option.effect]]
person = "leaver"
strain = 0.2
[[option.effect]]
person = "leaver"
return_intent = 0.15
[[option.effect]]
tie = ["leaver", "hours"]
hindrance = 0.3
[[option.effect]]
q = "menace.grievance"
add = 0.3
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the contract is the sponsor's instrument. Local release requires an authority the outpost does not hold."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the hours will be obtained and the crew member will not. The difference presents at the clinic."

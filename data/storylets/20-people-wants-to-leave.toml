id = "wants_to_leave"
title = "A Contract Is a Number"
act = 1
weight = 0.5
cooldown = 30
tags = ["people", "hours"]
text = """
{leaver} came to the ring with the contract and a finger on the end date and
asked to be on the next ship instead. Not sick, not in trouble, just done: the
can, the count, the same thirty-five faces. Half the outpost would say the same
if asked, and {hours} knows exactly what one seat on the ship costs in tonnes
and what one pair of hands costs in the ledger.
"""

[[when]]
turn_min = 12

[[when]]
q = "people.return_share"
gt = 0.55

[[when]]
stage_max = 4

[[cast]]
role = "leaver"
rotator = true

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "let_go"
label = "Put {leaver} on the next ship"
text = "A seat, a forfeited lay, and a message to everyone else that the door opens."
tags = ["people", "cost"]
chronicle = "{leaver} asked to go before the contract was out and the ring said yes. There was a seat on the next ship and everyone watched it fill."
[[option.effect]]
person = "leaver"
leave = true
[[option.effect]]
all_return_intent = 0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "A person who has decided to leave and cannot is the person the record says becomes the problem. Let them go while it is still their idea."
[[option.advice]]
seat = "hours"
stance = "against"
text = "One pair of hands off the roster and a seat that could have been a hundred kilos of spares. And the next one asks tomorrow."

[[option]]
id = "persuade"
label = "Sit down with {leaver} and find out what would make them stay"
text = "A different watch, a different bunk, a word. Cheap if it works."
tags = ["people", "hours"]
chronicle = "{hours} sat with {leaver} for an evening and found out what the trouble actually was. It was a watch schedule. It was changed."
[[option.effect]]
person = "leaver"
return_intent = -0.3
[[option.effect]]
person = "leaver"
strain = -0.1
[[option.effect]]
tie = ["leaver", "hours"]
reliance = 0.2
[[option.effect]]
tie = ["leaver", "hours"]
work_positive = 0.15
[[option.advice]]
seat = "hours"
stance = "for"
text = "Nine times in ten it is a roster. Ask before you spend a seat on it."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "You can talk someone into another convoy. You cannot talk them into liking it, and I have to stand watches with them."

[[option]]
id = "hold"
label = "Hold {leaver} to the paper"
text = "The contract has an end date and this is not it."
tags = ["sponsor", "hours"]
chronicle = "The ring held {leaver} to the contract. {leaver} stood the watches until the end date and did not speak to {hours} again."
[[option.effect]]
person = "leaver"
strain = 0.2
[[option.effect]]
person = "leaver"
return_intent = 0.15
[[option.effect]]
tie = ["leaver", "hours"]
hindrance = 0.3
[[option.effect]]
q = "menace.grievance"
add = 0.3
[[option.advice]]
seat = "liaison"
stance = "for"
text = "The contract is the sponsor's paper, not ours. If we start releasing people from it the sponsor will ask who authorised that, and I do not have an answer."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "You will get the hours. You will not get the person, and the difference will show up in my clinic."

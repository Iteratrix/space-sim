id = "doctors_dilemma"
title = "The Formulary"
act = 1
weight = 0.6
cooldown = 30
tags = ["people", "medicine"]
text = """
Status: {bodies} has counted the formulary twice with the same result. Half
the original shipment has expired. Remaining stock would not fill a kit
bag.
Constraint: {patient} requires a course from that shelf. Projected demand
before the next RSW is at least one further course.
Options: distribute thin, or treat the present case in full.
"""

[[when]]
q = "stocks.medicine"
lt = 30

[[when]]
q = "stocks.medicine"
gt = 3

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "patient"

[[option]]
id = "ration"
label = "Ration the formulary"
text = "Half courses to all. Medicine stock held at 85 per cent. {patient} strain +0.15."
tags = ["medicine", "caution"]
chronicle = "A rationing directive was issued: every course halved. The shelf count was posted on the clinic door."
[[option.effect]]
person = "patient"
strain = 0.15
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "stocks.medicine"
mul = 0.85
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer rates a half course as a poor course and an empty shelf as worse. Recommends retaining stock against the next presentation."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes a pump run at half pressure is not maintained. Recommends treating the case in hand."

[[option]]
id = "spend"
label = "Treat {patient} in full"
text = "Full course to one. Medicine stock falls to 10 per cent. {patient} strain -0.2."
tags = ["medicine", "people", "risk"]
chronicle = "{patient} received the last full course in the formulary. The shelf was bare afterwards."
[[option.requires]]
q = "stocks.medicine"
ge = 3
[[option.effect]]
q = "stocks.medicine"
mul = 0.1
[[option.effect]]
person = "patient"
strain = -0.2
[[option.effect]]
tie = ["patient", "bodies"]
reliance = 0.3
[[option.effect]]
all_strain = 0.03
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer has one presenting patient and a shelf reserved against a hypothetical one. Treats the presenting patient."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports one shelf against 36 crew. Spending it on one leaves 35 uncovered until the RSW."

[[option]]
id = "manifest"
label = "Head the next manifest with medicine and hold {patient}"
text = "Shortage declared to Earth. {patient} strain +0.2. Attention +0.03."
tags = ["sponsor", "medicine", "caution"]
chronicle = "A medicine crate was placed at the head of the manifest and {patient} was held until the RSW. The sponsor queried why the original shipment was insufficient."
[[option.requires]]
stage_max = 3
[[option.effect]]
person = "patient"
strain = 0.2
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
q = "sponsor.attention"
add = 0.03
[[option.effect]]
counter = "medicine_requested"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a medical shortage is the one line item the board does not contest. Recommends requesting it at volume."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the RSW is distant and a course beginning in six months is not the same course."

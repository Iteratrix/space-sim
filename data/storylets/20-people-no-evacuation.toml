id = "no_evacuation"
title = "Nobody Is Coming for This"
act = 1
cooldown = 30
weight = 0.35
tags = ["people", "medicine", "risk"]
text = """
Status: {patient} went down on watch with continuing abdominal pain.
{bodies} has narrowed the differential to two conditions. Both are
surgical.
Constraint: nearest surgical facility is one RSW distant. The RSW is not
open. The surgical kit was specified for cuts and burns. Available
resources are the formulary, a manual, an uplink with lag, and one pair of
hands.
"""

[[when]]
not_flag = "first_death"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "patient"

[[option]]
id = "operate"
label = "Operate here"
text = "Medicine -4. {patient} strain +0.3. {bodies} strain +0.2."
tags = ["medicine", "risk", "capability"]
chronicle = "{bodies} operated on {patient} in the mess with the manual open and two crew holding lights. The outcome was not confirmed for a month."
[[option.requires]]
q = "stocks.medicine"
ge = 2
[[option.effect]]
q = "stocks.medicine"
add = -4
[[option.effect]]
person = "patient"
strain = 0.3
[[option.effect]]
person = "bodies"
strain = 0.2
[[option.effect]]
tie = ["patient", "bodies"]
reliance = 0.4
[[option.effect]]
all_strain = 0.04
[[option.effect]]
flag = "operated_here"
[[option.effect]]
counter = "operations_in_the_can"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer is not a surgeon and holds a manual, a lag, and the only qualification on station. Will proceed."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports a failed procedure costs the medical officer as well as the patient. Recommends assessing the odds first."

[[option]]
id = "talk_through"
label = "Operate with Earth on the link"
text = "Medicine -3. Attention +0.05. Every instruction arrives late."
tags = ["medicine", "sponsor"]
chronicle = "Earth talked {bodies} through the procedure on {patient} with instructions arriving late. The patient held. The exchange was published in the quarterly."
[[option.requires]]
q = "sponsor.attention"
ge = 0.3
[[option.effect]]
person = "patient"
strain = 0.3
[[option.effect]]
person = "bodies"
strain = 0.25
[[option.effect]]
q = "stocks.medicine"
add = -3
[[option.effect]]
q = "sponsor.attention"
add = 0.05
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
tie = ["patient", "bodies"]
reliance = 0.3
[[option.effect]]
flag = "operated_here"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the sponsor's medical desk exists for this case. Recommends use, and visible use."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer rates twenty minutes of lag between question and answer as sufficient to lose a pump. A patient is not slower than a pump."

[[option]]
id = "nurse"
label = "No surgery: bed, fluids, observation"
text = "{patient} strain +0.4, return intent +0.3. Recovery, if any, is long."
tags = ["medicine", "caution"]
chronicle = "{patient} was put to bed and observed continuously. The condition resolved slowly. {patient} stood no watch for three months."
[[option.effect]]
person = "patient"
strain = 0.4
[[option.effect]]
person = "patient"
return_intent = 0.3
[[option.effect]]
all_strain = 0.06
[[option.effect]]
counter = "long_recoveries"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports a minority of these resolve without surgery and rates an incorrect incision with no blood bank as unrecoverable."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead costs three months of one patient and one attendant at six person-months out of the farm."

[[option]]
id = "wait_for_ship"
label = "Follow the evacuation protocol"
text = "Stabilise and await transport. No transport is scheduled."
tags = ["caution", "sponsor"]
chronicle = "The evacuation protocol was followed. It required a ship. {patient} died 96 h after presentation. First death on station; no disposition procedure existed."
[[option.effect]]
person = "patient"
die = true
[[option.effect]]
all_strain = 0.15
[[option.effect]]
q = "menace.grievance"
add = 1.0
[[option.effect]]
flag = "first_death"
[[option.effect]]
counter = "deaths"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the protocol states stabilise and evacuate, and holds no alternative protocol."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the protocol assumes an available ship. Under present conditions it is a certification of death."

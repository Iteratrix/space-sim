id = "two_dominants"
title = "Two Answers to One Question"
act = 1
once = true
tags = ["people", "hulls"]
text = """
Status: coherence below 0.75. {first} and {second} communicate only through
the shift log.
Each holds the top rating in their domain. The disputes are the KEEP
schedule against the bake-out schedule, and fab hours against haul hours.
Note: the ICE literature attributes most friction in a crew of this size to
two individuals. These are the two.
"""

[[when]]
q = "people.coherence"
lt = 0.75

[[when]]
turn_min = 12

[[cast]]
role = "first"
skill = "engineering"
min_skill = 2

[[cast]]
role = "second"
skill = "extraction"
min_skill = 2

[[option]]
id = "arbitrate"
label = "Appoint an arbiter and bind both to the finding"
text = "Hindrance falls both ways. Arbiter paid in hours. Strain -0.03 across the crew."
tags = ["people", "independence"]
chronicle = "{first} and {second} were bound to the finding of an arbiter of their own selection. The finding largely held. The arbiter was paid a tenth in hours."
[[option.effect]]
tie = ["first", "second"]
hindrance = -0.25
[[option.effect]]
tie = ["second", "first"]
hindrance = -0.25
[[option.effect]]
all_strain = -0.03
[[option.effect]]
counter = "arbitrations"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead costs an arbiter at 10 h and the present dispute at 40 h a month in duplicated work."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a grievance procedure exists and routes through the liaison to Earth. A local substitute is audit-visible."

[[option]]
id = "separate"
label = "Split the watches so they never overlap"
text = "Hindrance falls, joint output falls further. Both strain -0.1. Strain +0.02 across the crew."
tags = ["people", "hours"]
chronicle = "The roster was cut so that {first} and {second} never stood a watch together. Joint output fell."
[[option.effect]]
tie = ["first", "second"]
hindrance = -0.1
[[option.effect]]
tie = ["first", "second"]
work_positive = -0.15
[[option.effect]]
tie = ["second", "first"]
work_positive = -0.15
[[option.effect]]
person = "first"
strain = -0.1
[[option.effect]]
person = "second"
strain = -0.1
[[option.effect]]
all_strain = 0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports distance is the only reliable measure in a habitat this size. Recommends a schedule that functions as separation."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports the KEEP and the bake-out share one power bus. Separation on the roster does not separate the bus, and a second bus cannot be built."

[[option]]
id = "back_one"
label = "Rule for {first} on the record"
text = "{second} strain +0.15, return intent +0.25. Hindrance toward {first} rises."
tags = ["hulls", "risk"]
chronicle = "The SMB ruled for {first}. {second} applied for the next ship and made no further statement on the record."
[[option.effect]]
tie = ["second", "first"]
hindrance = 0.3
[[option.effect]]
tie = ["first", "second"]
reliance = -0.2
[[option.effect]]
person = "second"
return_intent = 0.25
[[option.effect]]
person = "second"
strain = 0.15
[[option.effect]]
all_strain = -0.02
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer requires one holder of the KEEP schedule and rules out anyone who rates a bearing as deferrable by a month."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports the ruling retains the louder voice and loses the water survey. That is a loss, not a trade."

[[option]]
id = "let_it_run"
label = "No action"
text = "Hindrance rises both ways. Strain +0.08 across the crew. CCI +0.5."
tags = ["hours", "risk"]
chronicle = "No ruling was issued. Work continued. The crew divided by preference."
[[option.effect]]
tie = ["first", "second"]
hindrance = 0.2
[[option.effect]]
tie = ["second", "first"]
hindrance = 0.2
[[option.effect]]
all_strain = 0.08
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports every station wintered on carried a pair of these. They were not resolved; they were outlasted."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the crew is already dividing. One further month makes it two blocs rather than two individuals."

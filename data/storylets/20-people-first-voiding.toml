id = "first_voiding"
title = "Outside"
act = 1
once = true
tags = ["people", "dose", "risk"]
text = """
Status: {walker} has taken a suit and a surface pod onto the rock, alone,
and transmitted one message: not returning until the RSW. No fault
reported. No equipment failure detected. {walker} has been logged as
withdrawn for several months.
{bodies} reports the exposure: one RSW outside the shielding is
approximately 700 mSv. An STE during that period is fatal.
Constraint: recovery requires three crew on the surface.
"""

[[when]]
q = "people.mean_strain"
gt = 0.35

[[when]]
turn_min = 36

[[cast]]
role = "walker"

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "let_go_logged"
label = "Permit it and log the CED"
text = "{walker} dose +700 mSv, strain -0.4. Confidence -0.05. Ledger uplinked."
tags = ["dose", "people", "independence"]
chronicle = "{walker} remained on the surface for one RSW and returned with approximately 700 mSv entered in the CED ledger. The entry was uplinked."
[[option.effect]]
person = "walker"
dose = 0.7
[[option.effect]]
person = "walker"
strain = -0.4
[[option.effect]]
person = "walker"
return_intent = -0.3
[[option.effect]]
all_strain = -0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.effect]]
lexicon = "first_voiding"
[[option.effect]]
flag = "voided:1"
[[option.effect]]
counter = "voidings"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports recovery requires three crew and a struggle on the surface, at a higher aggregate CED than negotiation. Recommends recording it as a choice."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a crew member voluntarily taking a year of coil CED in one month is classified as a psychiatric event."

[[option]]
id = "let_go_quiet"
label = "Permit it and withhold the CED from the uplink"
text = "{walker} dose +700 mSv, strain -0.4. SOS +0.8. Ledger local only."
tags = ["dose", "independence", "risk"]
chronicle = "{walker} remained on the surface for one RSW. The CED entry was made locally and omitted from the quarterly. First deliberate omission from an Earth report."
[[option.effect]]
person = "walker"
dose = 0.7
[[option.effect]]
person = "walker"
strain = -0.4
[[option.effect]]
person = "walker"
return_intent = -0.3
[[option.effect]]
all_strain = -0.03
[[option.effect]]
q = "menace.suspicion"
add = 0.8
[[option.effect]]
lexicon = "first_voiding"
[[option.effect]]
flag = "voided:1"
[[option.effect]]
counter = "voidings"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the figure is the outpost's. The sponsor receives tonnage."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the CED ledger writes to the audit log. Two divergent copies will eventually be compared."

[[option]]
id = "bring_in"
label = "Recover {walker} from the surface"
text = "Three crew take surface CED. {walker} dose +80 mSv, strain +0.1."
tags = ["dose", "caution", "medicine"]
chronicle = "A three-crew party recovered {walker} by the second watch. All three took CED. {walker} did not speak to the party for a month."
[[option.effect]]
person = "walker"
dose = 0.08
[[option.effect]]
person = "walker"
strain = 0.1
[[option.effect]]
person = "bodies"
dose = 0.04
[[option.effect]]
tie = ["walker", "bodies"]
hindrance = 0.25
[[option.effect]]
all_strain = 0.02
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer computes three crew at surface CED for one watch against one crew at surface CED for one RSW. The sum favours recovery. States the sum is not the whole question."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports an STE with a body on the surface is unrecoverable. Recommends recovery first and discussion under rock."

id = "water_reserve"
title = "The Reserve and the Throw"
act = 1
cooldown = 40
weight = 0.4
priority = 0
tags = ["water", "throughput", "sponsor"]
text = """
Status: water between 60 t and 122 t. The RSW is closed. The MDLS ships
water because water is the sponsor's metric.
{extraction} reports the tank gauge is on the 120 t reserve line. {hours}
reports the quarterly is on its line as well.
Constraint: nothing thrown this season arrives earlier for being thrown
now. The question is whether the reserve is a floor or a target.
"""

[[when]]
q = "stocks.water"
lt = 122

[[when]]
q = "stocks.water"
gt = 60

[[when]]
q = "earth_window_open"
eq = 0

[[when]]
stage_max = 5

[[cast]]
role = "extraction"
seat = "extraction"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "pause"
label = "Halt the MDLS until the RSW"
text = "Water +15 t. Confidence -0.05. Quarterly shows a flat season."
tags = ["water", "capability", "dose"]
chronicle = "The MDLS was halted for one season and the tank rose. The quarterly recorded a flat season. Shielding depth increased."
[[option.effect]]
flag = "throw_paused"
[[option.effect]]
q = "stocks.water"
add = 15
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports the RSW is closed and water thrown now sits on a trajectory for a season. In tank it is shielding."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a flat quarter is queried. The query will be whether the MDLS is faulty, and the accurate answer is worse."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer counts every tonne in tank as shielding between the crew and the background. Recommends retaining it."

[[option]]
id = "throw"
label = "Continue throwing"
text = "Water -10 t. Confidence +0.02. Strain +0.04 across the crew."
tags = ["throughput", "sponsor"]
chronicle = "The MDLS ran through the closed window. The reserve held at the line and the quarterly was nominal."
[[option.effect]]
q = "stocks.water"
add = -10
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
all_strain = 0.04
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports phi is lifetime tonnes shipped over tonnes received. A flat season is not recoverable."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead classes the reserve as a floor, not a target, and requests that minuted."

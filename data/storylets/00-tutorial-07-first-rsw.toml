id = "tut_first_rsw"
title = "MM 12: RSW-1 Arrival"
act = 1
once = true
priority = 150
tags = ["tutorial", "sponsor"]
text = """
{hours} has the RSW-1 manifest open on the table and the crates in rows on the
pad beside it. This is the request the SMB uplinked at MM 4 and nothing else:
nothing on that pad was chosen after MM 4, because the hull was loaded against
the file and the file closed eight months ago. In the same pouch is the sponsor's
reply to that request — acknowledged, under review, response by RSW-2. {liaison}
reads it aloud without comment and puts it in the file.

That is the shape of every window from here. The mark on the RSW clock is
already reading for the next hull, which opens at MM 28; whatever it says on the
day that window opens is what flies. The SMB has sixteen months to be wrong
about it.
"""

[[when]]
turn_min = 12

[[when]]
turn_max = 18

[[when]]
q = "counts_since_convoy"
le = 1

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "inventory"
label = "Full inventory before anything is unpacked"
text = "Every crate against the manifest, every deviation logged, before a single lid comes off."
tags = ["hours", "caution"]
chronicle = "MM {turn}. RSW-1 manifest reconciled in full against the MM 4 request; two crates short, logged and raised as a discrepancy."
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
q = "stocks.spares"
add = 6
[[option.effect]]
counter = "inventories"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Two crates will be missing. They always are. If we do not log it this month, in thirty months the sponsor will say we lost them."

[[option]]
id = "unpack"
label = "Unpack the units and put them to work today"
text = "A haul unit on the pad is a haul unit not on the loop. Hands first, paperwork after."
tags = ["throughput", "water"]
chronicle = "MM {turn}. RSW-1 units commissioned the day they landed; manifest reconciliation deferred. BOP haul loop back to full complement."
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
q = "stocks.water"
add = 10
[[option.effect]]
q = "stocks.spares"
add = 2
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Every day a haul unit sits on that pad the plant runs short of the number I have been reading out since MM 2."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "The sponsor requires manifest reconciliation within one RSW. Deferred reconciliation is a finding, and a finding is read by people who have never seen a pad."

[[option]]
id = "pod_first"
label = "Load the first pod from the hull's own ballast"
text = "The MDLS has not thrown yet. Load one anyway, so that the day it does, something is waiting."
tags = ["throughput", "sponsor"]
chronicle = "MM {turn}. RSW-1 landed; first MDLS pod loaded with hull ballast pending alignment. Manifest reconciliation partial."
[[option.requires]]
not_flag = "driver_aligned"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "pod_loaded"
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "hulls"
stance = "for"
text = "A loaded pod is a reason to finish the alignment. Engineers finish things that have a reason waiting on them."

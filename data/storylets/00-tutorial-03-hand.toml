id = "tut_hand"
title = "MM 3: Crew Allocation Board"
act = 1
once = true
priority = 146
tags = ["tutorial", "hours"]
text = """
On confirmation the allocation board opens below the rail. One die per crew
member. The number shown on a die is that person's best rating. It is not the
number the die will read on every clock: each kind of work reads a different
rating.

Status: fourteen adults. Two are consumed by station upkeep this month and are
shown dimmed. Twelve are free.

Upkeep is air, water, food and loop maintenance. It is taken before any work is
assigned, every month, and it is not optional.

No project clock is displayed. Free dice stay in the hand until there is
somewhere to place them. {hours} holds the tasking list.
"""

[[when]]
turn_min = 3

[[when]]
turn_max = 4

[[when]]
fired = "tut_window"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "read"
label = "Log the free count each month"
text = "The free count goes in the minutes before any tasking is agreed."
tags = ["hours", "caution"]
chronicle = "MM {turn}. Allocation board opened: 14 adults, 2 on upkeep, 12 free. The free count was entered as the first line of the SMB minutes."
[[option.effect]]
flag = "ui:hand"
[[option.effect]]
flag = "hand_logged"

[[option]]
id = "post"
label = "Post the free count at the meal"
text = "The board is read out where the crew eats. Everyone sees which two names upkeep took."
tags = ["people", "independence"]
chronicle = "MM {turn}. Allocation board opened: 14 adults, 2 on upkeep, 12 free. The board is posted at the meal table and read out each month."
[[option.effect]]
flag = "ui:hand"
[[option.effect]]
flag = "hand_posted"
[[option.effect]]
q = "menace.grievance"
add = -0.3

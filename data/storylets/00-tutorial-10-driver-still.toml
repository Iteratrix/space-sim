id = "tut_driver_still"
title = "MM 24: MDLS Alignment Overdue"
act = 1
once = true
priority = 110
tags = ["tutorial", "throughput", "sponsor"]
text = """
The board's model had the MDLS throwing at MM 14. It is MM 24 and the alignment
task is still open on the allocation board with no hands on it. {liaison} has
the query, worded as a query. {hulls} has the honest answer: eight segments, no
free allocation, and the excavation and the plant ahead of it every month.

The next RSW opens at MM 28. The board will see the ratio at zero.
"""

[[when]]
turn_min = 24

[[when]]
not_flag = "driver_aligned"

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "staff_it"
label = "SMB directive: two lines to MDLS alignment until it throws"
text = "Whatever they come off. Eight segments is a month with two ratings on it."
tags = ["throughput", "sponsor", "hulls"]
chronicle = "MM 24. MDLS alignment overdue against board model. SMB directive: alignment staffed at priority until first throw."
[[option.effect]]
flag = "align_priority"
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Give me two ratings for a month and it throws before the window. I have been saying this since MM 2."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "If those two come off the excavation the surface dose runs another month. Say which two and I will tell you their ledger lines."

[[option]]
id = "explain"
label = "Send the board the CED ledger as the explanation"
text = "Tell them why. Ten millisieverts a month is a reason."
tags = ["sponsor", "dose", "independence"]
chronicle = "MM 24. MDLS alignment overdue. CED ledger transmitted to board as justification for excavation priority."
[[option.effect]]
q = "menace.suspicion"
add = 0.6
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "bodies"
stance = "for"
text = "It is their limit we are protecting. Six hundred millisieverts is a sponsor number. Show them their own number."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "The board does not have a line for dose. A ledger they did not request explains a zero they did not expect. Both go in the file."

id = "sponsor_sharp_review"
title = "The Sharp Review"
act = 1
once = true
weight = 3.0
priority = 60
tags = ["sponsor", "review"]
text = """
Status: review returned off-nominal. The board has struck the throughput
target and entered a higher figure above it.
{liaison} reports the recurring term in the message is trajectory.
{hours} has run the MDLS against the new figure. The MDLS does not meet it
at any duty cycle.
Constraint: the reply uplinks tonight.
"""

[[when]]
flag = "stage:1"

[[cast]]
role = "liaison"
seat = "liaison"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "promise"
label = "Commit to the new figure"
text = "Confidence +0.08. Shipped +12 t. Strain +0.06 across the crew."
tags = ["throughput", "sponsor", "hours"]
chronicle = "The reply committed to the sponsor's revised figure. MDLS shifts were extended and loop maintenance hours reduced."
[[option.effect]]
q = "sponsor.confidence"
add = 0.08
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "throughput.shipped"
add = 12
[[option.effect]]
flag = "promised_phi"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a commitment is what the board is asking for. A commitment buys one review cycle."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports MDLS crews already on four-hour rotations. The commitment is payable in sleep."

[[option]]
id = "explain"
label = "Uplink the transfer calendar and duty cycle"
text = "Confidence -0.04. SOS +0.8. The figure is not restated."
tags = ["capability", "independence", "risk"]
chronicle = "The reply supplied a transfer calendar and an MDLS duty cycle in place of a commitment. The submission was accurate and was logged as an excuse."
[[option.effect]]
q = "sponsor.confidence"
add = -0.04
[[option.effect]]
q = "menace.suspicion"
add = 0.8
[[option.effect]]
flag = "explained_phi"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports 40 t per month is the MDLS ceiling at current propellant. The figure does not move under effort."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a board asks who is accountable. A calendar names nobody."

[[option]]
id = "ask"
label = "Query what changed at the sponsor"
text = "Attention +0.04. Confidence -0.02. Answer expected one month late."
tags = ["sponsor", "risk"]
chronicle = "The reply queried what had changed on Earth rather than answering the figure. The response took a month and did not concern throughput."
[[option.effect]]
q = "sponsor.attention"
add = 0.04
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
flag = "asked_what_changed"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison has no data on the cause and states so. A query now returns an answer before the next request."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer notes a specification change with no engineering cause originates elsewhere. Recommends locating it before building to it."

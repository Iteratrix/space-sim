id = "sponsor_empty_chair"
title = "The Chair"
act = 1
once = true
priority = 100
tags = ["sponsor", "silence"]
text = """
Status: no further RSW arrivals scheduled. Two consecutive months without a
message. {liaison} no longer forecasts a return of dish time. {hours} has
stopped maintaining the review date.
Constraint: the SMB holds one seat designated for the sponsor, occupied by
{liaison}, answering for Earth. The designation is now unmatched by any
correspondent.
Recommendation: rule on the seat, Commander.
"""

[[when]]
flag = "stage:6"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
skill = "logistics"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "keep_empty"
label = "Retain the seat, unoccupied"
text = "CCI -0.5. Strain +0.03 across the crew. No holder assigned."
tags = ["independence", "sponsor"]
chronicle = "The sponsor's seat was retained and left unoccupied. The SMB continued to address it."
[[option.effect]]
flag = "chair_empty"
[[option.effect]]
q = "menace.grievance"
add = -0.5
[[option.effect]]
all_strain = 0.03
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer rates an empty seat as an accurate statement of the position."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports crew tolerate a substitute better than an absence. The seat will be looked at every month."

[[option]]
id = "holdout"
label = "Keep {liaison} in the seat"
text = "{liaison} strain +0.1. CCI +0.3. Sponsor procedure maintained."
tags = ["sponsor", "caution", "people"]
chronicle = "{liaison} was kept in the sponsor's seat, answering for an Earth that had stopped transmitting."
[[option.effect]]
flag = "chair_holdout"
[[option.effect]]
person = "liaison"
strain = 0.1
[[option.effect]]
q = "menace.grievance"
add = 0.3
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports manifests still require a format and reviews still require a date. The sponsor's calendar needs a keeper."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes the role now consists of relaying an absent party. That is a task for a machine."

[[option]]
id = "give_it"
label = "Strike the office and reassign the seat"
text = "CCI -1.0. Return intent falls. {liaison} strain -0.05."
tags = ["independence", "risk"]
chronicle = "The sponsor's office was struck and its seat reassigned to the outpost as a whole. No objection was received from Earth."
[[option.effect]]
flag = "chair_outpost"
[[option.effect]]
q = "menace.grievance"
add = -1.0
[[option.effect]]
all_return_intent = -0.05
[[option.effect]]
person = "liaison"
strain = -0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports a seat exists to answer a question. This question is closed. Recommends opening another."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer recommends deferral. Part of the crew has not yet stated aloud that no ship is coming."

id = "sponsor_skipped_rotation"
title = "The Skipped Rotation"
act = 1
once = true
weight = 3.0
priority = 70
tags = ["sponsor", "people", "rotation"]
text = """
Status: message received. No crew transport this RSW. Cargo only. Next
rotation to be scheduled.
{rotator} has eleven months remaining on contract. Half the roster is on
contract and is running the same arithmetic. {resident} has made no
statement, which the rotators have registered.
Constraint: {liaison} reports the sponsor's term is deferred, not
cancelled, and does not rate the distinction as reliable.
"""

[[when]]
flag = "stage:4"

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "resident"
rotator = false
optional = true

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[cast]]
role = "bodies"
seat = "bodies"
optional = true

[[option]]
id = "promise"
label = "Guarantee the next ship locally"
text = "CCI +0.8. Return intent rises. {rotator} strain +0.1."
tags = ["people", "sponsor"]
chronicle = "The SMB guaranteed the rotators passage on the next ship and issued the guarantee in its own name."
[[option.effect]]
q = "menace.grievance"
add = 0.8
[[option.effect]]
all_return_intent = 0.05
[[option.effect]]
person = "rotator"
strain = 0.1
[[option.effect]]
flag = "promised_next_ship"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports deferred means the line item persists. Persisting line items are sometimes funded."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the third quarter of a contract is the failure point. The proposal makes every contract a third quarter with no terminus."

[[option]]
id = "localise_lay"
label = "Settle the lay from outpost stocks"
text = "Water -30 t. Return intent -0.12. CCI -0.8. {rotator} becomes resident."
tags = ["people", "independence", "water", "cost"]
chronicle = "The rotators' lay was settled from outpost water and hours and they were entered on the roster as residents. The sponsor was not consulted and did not query it."
[[option.effect]]
q = "stocks.water"
add = -30
[[option.effect]]
all_return_intent = -0.12
[[option.effect]]
q = "menace.grievance"
add = -0.8
[[option.effect]]
person = "rotator"
resident = true
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.effect]]
flag = "lay_settled_locally"
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports 30 t is two months of total plant output. The proposal pays wages in the shipped commodity. Requests it minuted."
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports a rotator schedules to the ship and a resident schedules to the outpost. Thirty tonnes is within the value of that difference."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer recommends supplying a contract terminus, including a nominal one. The body requires an endpoint."

[[option]]
id = "let_it_burn"
label = "Issue no guarantee"
text = "CCI +1.5. Strain +0.06 across the crew. Hindrance rises between crews."
tags = ["people", "caution"]
chronicle = "The SMB issued no guarantee regarding the next ship. Grievance ran high for a season, directed mostly at Earth. The residents made no statement."
[[option.effect]]
q = "menace.grievance"
add = 1.5
[[option.effect]]
all_strain = 0.06
[[option.effect]]
tie = ["rotator", "resident"]
hindrance = 0.25
[[option.effect]]
flag = "rotation_fury"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the fault is the sponsor's and cannot be corrected locally by a statement."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer projects displacement onto {resident} within two months. The sponsor is not present. {resident} is."

id = "child_proposal"
title = "The Question the Policy Was Written For"
act = 1
once = true
tags = ["people", "families", "dose"]
text = """
Status: {asker} has petitioned the SMB for a child. The sponsor's medical
policy prohibits children on station and names no enforcing authority.
{bodies} reports the figures. KEEP interior runs at 12 mSv per year, below
several terrestrial cities. Gestation here approximately doubles a
childhood cancer risk with a low base rate. The policy was written for a
coil ship and copied without revision.
Constraint: {asker} is a resident. No scheduled transport returns {asker}
to Earth for this.
"""

[[when]]
turn_min = 24

[[when]]
q = "people.residents"
ge = 6

[[when]]
stage_max = 3

[[cast]]
role = "asker"
rotator = false

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "defy"
label = "Approve it locally"
text = "SOS +1.5. {asker} strain -0.15, return intent -0.3. Sponsor not consulted."
tags = ["families", "independence", "risk"]
chronicle = "The SMB approved {asker}'s petition and entered the CED figures beside the decision. The sponsor was not consulted."
[[option.effect]]
flag = "families_defied"
[[option.effect]]
q = "menace.suspicion"
add = 1.5
[[option.effect]]
person = "asker"
strain = -0.15
[[option.effect]]
person = "asker"
return_intent = -0.3
[[option.effect]]
all_return_intent = -0.04
[[option.effect]]
tie = ["asker", "bodies"]
reliance = 0.3
[[option.effect]]
counter = "policies_defied"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer would sign 12 mSv per year on Earth. Classes the policy as a hull policy applied to a buried habitat and declines to enforce it."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a child on the headcount cannot be presented to the sponsor's insurers. That terminates the outpost as the sponsor defines it."

[[option]]
id = "ask"
label = "Refer it to the sponsor with the CED figures"
text = "Attention +0.05. Confidence -0.03. Answer one RSW out. {asker} strain +0.15."
tags = ["sponsor", "families", "caution"]
chronicle = "The petition was uplinked with the CED figures attached and {asker} was told to await the RSW. The sponsor's reply was a longer policy."
[[option.effect]]
flag = "families_asked"
[[option.effect]]
q = "sponsor.attention"
add = 0.05
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
person = "asker"
strain = 0.15
[[option.effect]]
person = "asker"
return_intent = 0.1
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison recommends referral with figures. Worst case restates a refusal already in force."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes referral converts a policy being ignored into a directive being defied."

[[option]]
id = "refuse"
label = "Apply the policy"
text = "{asker} strain +0.2, return intent +0.35. Confidence +0.02."
tags = ["sponsor", "caution"]
chronicle = "The petition was refused and the policy was read aloud on the record. {asker} asked about the next ship."
[[option.effect]]
person = "asker"
strain = 0.2
[[option.effect]]
person = "asker"
return_intent = 0.35
[[option.effect]]
tie = ["asker", "bodies"]
hindrance = 0.2
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead costs a pregnancy at one crew off the roster for a year and on the ration for eighteen months. The hours are not available."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer declines to state a risk as unacceptable after reporting it as acceptable to the SMB."

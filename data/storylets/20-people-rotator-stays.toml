id = "rotator_stays"
title = "One Does Not Board"
act = 1
weight = 0.4
cooldown = 28
tags = ["people", "independence"]
text = """
Status: {stayer}'s contract terminates at the window. {stayer} has declined
the berth.
Stated reasons: unfinished work, and a replacement unfamiliar with the
loop. No lay incentive was requested.
Constraint: the sponsor's headcount has no category for a declined berth.
"""

[[when]]
turn_min = 10

[[when]]
q = "counts_to_window"
le = 3

[[when]]
stage_max = 3

[[cast]]
role = "stayer"
rotator = true

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "accept"
label = "Record {stayer} as a resident"
text = "Off the rotation list. {stayer} strain -0.1. Confidence -0.02."
tags = ["people", "independence"]
chronicle = "{stayer} came off the rotation list before the RSW and was recorded as a resident. The sponsor's headcount ran one long for a year."
[[option.effect]]
person = "stayer"
resident = true
[[option.effect]]
person = "stayer"
strain = -0.1
[[option.effect]]
all_return_intent = -0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
flag = "stayed_by_choice"
[[option.effect]]
counter = "stayed_by_choice"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead rates one loop-rated crew member who intends to stay above three who are counting months."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports no headcount category exists for a declined berth. A new category will be audited."

[[option]]
id = "new_paper"
label = "Issue a further contract"
text = "Two more RSWs on the sponsor's paper. {stayer} return intent -0.25."
tags = ["sponsor", "hours"]
chronicle = "{stayer} signed a further contract with a new end date. Both parties treated the date as a formality."
[[option.effect]]
person = "stayer"
return_intent = -0.25
[[option.effect]]
person = "stayer"
strain = -0.05
[[option.effect]]
q = "sponsor.attention"
add = 0.02
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports a renewal uses a line the sponsor already holds. It retains the hands and keeps the record clean."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes a contract with an end date reintroduces the third-quarter curve. Recommends granting residence instead."

[[option]]
id = "send_home"
label = "Enforce the rotation"
text = "{stayer} boards. Strain +0.03 across the crew. Confidence +0.02."
tags = ["sponsor", "caution"]
chronicle = "The SMB enforced the contract and {stayer} remained on the rotation list. No appeal was lodged."
[[option.effect]]
person = "stayer"
leave = true
[[option.effect]]
person = "stayer"
strain = 0.2
[[option.effect]]
all_strain = 0.03
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the rotation schedule is the sponsor's one reliably kept undertaking. Breaking it locally invites reciprocity."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer notes {stayer} is the one crew member not counting months. Removing that case affects the crew who are."

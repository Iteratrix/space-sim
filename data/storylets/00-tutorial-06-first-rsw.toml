id = "tut_first_rsw"
title = "RSW-1 Arrival"
act = 1
once = true
priority = 155
tags = ["tutorial", "sponsor"]
text = """
RSW-1 landed. The hull carried the request this board transmitted before the
window, and nothing else.

The Mass Driver Launch System (MDLS) alignment clock opens: eight segments,
engineering, unstaffed. An unstaffed clock does not advance. The work is
unstructured, so only dexterous units and crew fit it.

New seat: bodies. Place a crew die on the alignment clock.
"""

[[when]]
turn_min = 12

[[when]]
turn_max = 18

[[when]]
q = "counts_since_convoy"
le = 1

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "inventory"
label = "Reconcile the manifest before unpacking"
text = "Every crate against the file, every discrepancy logged, before a lid comes off."
tags = ["hours", "spares"]
chronicle = "MM {turn}. RSW-1 landed and the manifest was reconciled in full against the standing request; two crates short, logged as a discrepancy."
[[option.effect]]
project = "align_driver"
[[option.effect]]
flag = "ui:project:align_driver"
[[option.effect]]
flag = "require:place_person:align_driver"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
q = "stocks.spares"
add = 6
[[option.effect]]
counter = "inventories"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends reconciliation now. Two crates will be missing; they always are. Unlogged this month, they are the station's loss in thirty."

[[option]]
id = "unpack"
label = "Commission the units today"
text = "Hardware to work first, paperwork after. Reconciliation deferred one window."
tags = ["throughput", "water"]
chronicle = "MM {turn}. RSW-1 landed and the units were commissioned on the day; manifest reconciliation deferred one window. BOP haul loop at full complement."
[[option.effect]]
project = "align_driver"
[[option.effect]]
flag = "ui:project:align_driver"
[[option.effect]]
flag = "require:place_person:align_driver"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
q = "stocks.water"
add = 10
[[option.effect]]
q = "stocks.spares"
add = 2
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Recommends immediate commissioning. The plant makes what the dice on it allow and nothing else, and every day a haul unit sits on the pad is a day off the loop."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Cites the requirement to reconcile within one RSW. Deferred reconciliation is a finding, and a finding is read by people who have not seen the pad."

id = "second_midwinter"
title = "The Second Midwinter"
act = 1
once = true
tags = ["people", "air"]
text = """
Status: the fixed date recurs this month. Crew who arrived on the last ship
have been briefed on it and treat it as informal. {veteran} attended the
first and does not.
{newcomer} asked at the meal whether attendance is required.
Constraint: a second observance establishes it as procedure. A lapse
records it as a single event.
"""

[[when]]
flag = "midwinter"

[[when]]
fired = "first_midwinter"

[[when]]
turn_min = 24

[[cast]]
role = "veteran"
rotator = false

[[cast]]
role = "newcomer"
rotator = true

[[option]]
id = "keep"
label = "Hold it again, at larger scale"
text = "Strain -0.08 across the crew. Food margin -0.5 months. Custom established."
tags = ["people", "independence"]
chronicle = "The second observance was held with the new hands present. Attendance was full by the end of the night."
[[option.effect]]
all_strain = -0.08
[[option.effect]]
q = "stocks.food_margin"
add = -0.5
[[option.effect]]
flag = "midwinter_kept"
[[option.effect]]
tie = ["newcomer", "veteran"]
reliance = 0.2
[[option.effect]]
tie = ["newcomer", "veteran"]
work_positive = 0.15
[[option.effect]]
counter = "rituals"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead has held stock against the date again and reports that is now the date's function."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports last year cost half a month of margin and this request is larger. Will source it and requests the sourcing noted."

[[option]]
id = "veterans_only"
label = "Restrict it to those who attended the first"
text = "{veteran} strain -0.1. {newcomer} strain +0.08. Hindrance rises between intakes."
tags = ["people", "risk"]
chronicle = "The second observance was held by those present at the first. New hands attended as guests. The distinction persisted."
[[option.effect]]
all_strain = -0.03
[[option.effect]]
person = "veteran"
strain = -0.1
[[option.effect]]
person = "newcomer"
strain = 0.08
[[option.effect]]
tie = ["newcomer", "veteran"]
hindrance = 0.15
[[option.effect]]
flag = "midwinter_kept"
[[option.effect]]
counter = "rituals"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports every crewed vessel separates those who have crossed from those who have not, and that the boundary gives the new intake a target state."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the proposal constructs an in-group inside a crew of 36. The record on that is poor."

[[option]]
id = "lapse"
label = "Let the date lapse"
text = "Strain +0.03 across the crew. {veteran} strain +0.1. Margin retained."
tags = ["hours", "caution"]
chronicle = "No second observance was held. Some crew ate together on the date without designating it."
[[option.effect]]
unflag = "midwinter"
[[option.effect]]
all_strain = 0.03
[[option.effect]]
person = "veteran"
strain = 0.1
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead costs the observance at half a month of margin annually and indefinitely. Requests the SMB decide with the figure present."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead requests a disposition for the reserved stock."

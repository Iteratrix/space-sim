id = "the_isolate"
title = "The One at the Edge"
act = 1
weight = 0.3
cooldown = 36
tags = ["people"]
text = """
Status: {isolate} takes the late meal after the mess clears and stands
watches alone where the roster permits. No conflict reported.
Note: the ICE record gives the sequence as withdrawal, error, attribution,
then group consensus that the withdrawn crew member is the fault. Mean
strain is above threshold.
{warm} is a high-contact crew member and has registered the pattern.
"""

[[when]]
q = "people.mean_strain"
gt = 0.35

[[cast]]
role = "isolate"

[[cast]]
role = "warm"

[[option]]
id = "draw_in"
label = "Task {warm} with re-integrating {isolate}"
text = "{isolate} strain -0.15. {warm} strain +0.06. No roster change."
tags = ["people"]
chronicle = "{warm} began taking the late meal with {isolate}. Others followed. The hours were not logged."
[[option.effect]]
tie = ["isolate", "warm"]
work_positive = 0.3
[[option.effect]]
tie = ["isolate", "warm"]
reliance = 0.2
[[option.effect]]
person = "isolate"
strain = -0.15
[[option.effect]]
person = "warm"
strain = 0.06
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports this is the intervention the literature supports: one high-contact crew member, acting deliberately. No policy required."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead notes {warm} is also on the roster and each meal is one hour. Requests the hours entered in the ledger."

[[option]]
id = "reassign"
label = "Move {isolate} to a shared watch"
text = "{isolate} strain -0.1. Farm watch cannot be stood alone."
tags = ["people", "hours"]
chronicle = "{isolate} was reassigned to the shared farm watch, where no station is worked alone."
[[option.effect]]
person = "isolate"
strain = -0.1
[[option.effect]]
tie = ["isolate", "warm"]
work_positive = 0.1
[[option.effect]]
all_strain = 0.01
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead requests {isolate} on the beds. The farm watch cannot be worked in isolation."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer loses one KEEP-rated pair of hands to a watch that does not require the rating. Requests a named replacement."

[[option]]
id = "rotate_out"
label = "Rotate {isolate} out on the next ship"
text = "{isolate} departs. Strain -0.02 across the crew. Confidence -0.02."
tags = ["sponsor", "people", "cost"]
chronicle = "{isolate} returned early on the next ship under the sponsor's morale-case provision."
[[option.requires]]
stage_max = 3
[[option.effect]]
person = "isolate"
leave = true
[[option.effect]]
all_strain = -0.02
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a rotation category exists for this and requires no diagnosis. Recommends use while the form is current."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer notes the criterion applied is withdrawal. The next withdrawn crew member will have observed the criterion."

[[option]]
id = "leave_be"
label = "No action"
text = "{isolate} strain +0.15. Pattern continues."
tags = ["caution", "hours"]
chronicle = "No action was taken on {isolate}. The error, when it came, was small. The attribution was not."
[[option.effect]]
person = "isolate"
strain = 0.15
[[option.effect]]
tie = ["warm", "isolate"]
hindrance = 0.1
[[option.effect]]
counter = "isolates_ignored"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead overwintered at the edge of a station crew and returned nominal. Reports that eating alone is not itself a finding."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the sequence is withdrawal, error, attribution. The outpost is at the first link, which is the cheapest to break."

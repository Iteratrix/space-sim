id = "tut_handoff"
title = "MM 43: RSW-3"
act = 1
once = true
priority = 160
tags = ["tutorial"]
text = """
{hulls} proposes that the minutes stop recording the mission month and record
the count since landing. It is the same number. It is not the same number.

{hours} reads the tasking list aloud after the meal now; nobody waits for the
screen. {extraction} calls the plant's yield off the hopper before the figure
comes up, and is right often enough that it is read out after.

SX-19F closes the briefing log here. The board has the whole screen now.
"""

[[when]]
turn_min = 43

[[when]]
turn_max = 52

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "extraction"
seat = "extraction"

[[option]]
id = "count"
label = "Minute it as the count from now on"
text = "Mission Month is the sponsor's clock. The count is ours."
tags = ["independence", "people"]
chronicle = "{turn} since we came down. The sponsor's calendar reads the same number in its own unit and we have stopped correcting it. This is the log now, and it is ours."
[[option.effect]]
flag = "tutorial_done"
[[option.effect]]
lexicon = "first_convoy"
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "hulls"
stance = "for"
text = "It is the same number. Write it our way."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "The sponsor's minutes are in Mission Months. Two calendars is a reconciliation item at every review. I would keep one."

[[option]]
id = "mm"
label = "Keep Mission Month in the minutes"
text = "The sponsor's paper stays the sponsor's. What we say to each other is ours."
tags = ["sponsor", "caution"]
chronicle = "{turn} since we came down. The minutes keep the sponsor's unit, for the sponsor. At the meal nobody uses it. This is the log now."
[[option.effect]]
flag = "tutorial_done"
[[option.effect]]
lexicon = "first_convoy"
[[option.advice]]
seat = "hours"
stance = "for"
text = "I keep two ledgers already. A third calendar costs me nothing and costs the sponsor a question."

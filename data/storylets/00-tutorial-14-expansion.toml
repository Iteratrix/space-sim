id = "tut_expansion"
title = "MM 28: RSW-2 Arrival and Crew Augmentation"
act = 1
once = true
priority = 140
tags = ["tutorial", "sponsor", "people", "hours"]
text = """
The second window delivered, and with the tonnage the SMB marked came something
the SMB did not mark: crew. The sponsor is expanding this station faster than it
is sending machines, because on the sponsor's model a person is cheaper than a
dexterous unit and the allocation board is not in the model. {hours} does the
arithmetic aloud: every new line eats about a line and a half of upkeep until
the drum's routine work is automated, so the free allocation is smaller tonight
than it was last night with fewer people on station.

{liaison} confirms that the sponsor considers the augmentation nominal. The mark
on the RSW clock is now reading for RSW-3, which opens in about fifteen months,
and it is the last request this SMB will send before the station has been here
four years.
"""

[[when]]
turn_min = 28

[[when]]
turn_max = 34

[[when]]
q = "counts_since_convoy"
le = 1

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "accept"
label = "Mark RSW-3 for units, not crew"
text = "Take the hands that came. Ask for the machines that give hands back."
tags = ["throughput", "hours", "machines"]
chronicle = "MM {turn}. RSW-2 landed with unrequested crew augmentation; accepted. Manifest mark set to throughput for RSW-3: dexterous and haul units, no crew."
[[option.effect]]
flag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "hours"
stance = "for"
text = "A dexterous unit is three hundred hours a month and eats nothing. Ask for the thing that gives hours back."
[[option.advice]]
seat = "liaison"
stance = "for"
text = "The sponsor's staffing model runs to a hundred and forty. Units are a line they will approve. Declining crew is not."

[[option]]
id = "spares"
label = "Mark RSW-3 for spares and tooling"
text = "More people is more loops. Ask for what keeps loops closed."
tags = ["capability", "spares", "air"]
chronicle = "MM {turn}. RSW-2 landed with unrequested crew augmentation; accepted. Manifest mark set to capability for RSW-3: LSS-C spares and fabrication tooling."
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.5
[[option.advice]]
seat = "air"
stance = "for"
text = "Every person is nine hundred kilograms of water through the loops a month and a tenth of a spares crate. The loops are the roster. Ask for the loops."

[[option]]
id = "push_back"
label = "Log an objection to unplanned augmentation"
text = "The drum was dug for a number and the roster passed it without a request. Say so, in the minutes, where it can be read later."
tags = ["independence", "sponsor", "risk"]
chronicle = "MM {turn}. RSW-2 landed with unrequested crew augmentation; received under SMB objection, logged with the sponsor. Manifest mark unchanged for RSW-3."
[[option.effect]]
q = "menace.suspicion"
add = 0.9
[[option.effect]]
q = "menace.grievance"
add = -0.4
[[option.effect]]
flag = "objected_augmentation"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Berthing is rated. The drum was dug for a number. An objection is a medical note as much as a political one, and I will sign the medical half."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "An objection to the sponsor's staffing decision, from the station the sponsor staffs, is a sentence I will be asked to explain. I cannot."

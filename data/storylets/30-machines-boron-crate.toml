id = "boron_crate"
title = "The Boron Crate"
act = 1
once = true
priority = 50
tags = ["capability", "spares", "sponsor"]
text = """
Status: one boron crate in store, above 100 kg. Three claims are lodged.
{hulls} requests it held: a coil set cannot be rewound without tonnes of
boron and this crate is the first entry against that total.
{air} requests a share for the farm beds, where boron is a micronutrient
absent from the regolith.
The reactor's control shims are also boron and are a wear item.
Note: the sponsor holds no listed use for boron on a throughput outpost.
"""

[[when]]
q = "stocks.boron"
gt = 100

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "keep"
label = "Vault the crate for coil stock"
text = "Sealed and tallied. SOS +0.3. No present use."
tags = ["capability", "independence", "hulls"]
chronicle = "The boron was vaulted against a coil that cannot yet be wound. A ledger was opened with one entry."
[[option.effect]]
flag = "boron_vaulted"
[[option.effect]]
q = "menace.suspicion"
add = 0.3
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer classes the whole crate as coil stock and rates a coil as the only shielding that protects a crew past age forty."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a vaulted strategic material with no manifest use appears as a paragraph in a report. Fertiliser does not."

[[option]]
id = "shims"
label = "Cut reactor control shims"
text = "Boron -100 kg. Reactor life +6 months."
tags = ["capability", "hulls", "risk"]
chronicle = "Control shims were cut from the boron. Reactor life extended by six months. The crate was 100 kg lighter."
[[option.effect]]
q = "stocks.boron"
add = -100
[[option.effect]]
q = "power.reactor_life"
add = 6
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports shims are the one boron part machinable on the bench today. The coil is a decade out."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead notes the reactor gains six months and the farm gains nothing. The farm operates after the reactor does not."

[[option]]
id = "farm"
label = "Release a share to the farm beds"
text = "Boron -40 kg. Food margin +2 months. LSS-C +0.003."
tags = ["air", "closure", "people"]
chronicle = "Forty kilograms of boron were released to the regolith beds as micronutrient. Yield rose the following season."
[[option.effect]]
q = "stocks.boron"
add = -40
[[option.effect]]
q = "stocks.food_margin"
add = 2
[[option.effect]]
q = "closure"
add = 0.003
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead requests 40 kg and holds the yield curve. The beds have been boron-short since first planting."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer projects 40 kg per season indefinitely. At that rate the coil ledger records harvests and no coil."

id = "tut_pressures"
title = "The Three Lines"
act = 1
priority = 105
weight = 0.6
cooldown = 10
tags = ["tutorial", "people"]
text = """
{bodies} has the rail open at the three lines on it that are not stocks and are
not clocks, and reads them out before anything else is decided. The first is
SOS, which is what the sponsor suspects, and it rises when this station does
something nobody asked it for. The second is CCI, which is what the crew holds
against the SMB, and it rises when the SMB decides something and does not say
why. The third is the N2 make-up rate, which rises when nitrogen leaves the
station faster than the plant replaces it.

None of the three is a stock and none of them runs out. They cross bands —
quiet, then noticed, then argued — and then a fourth band the SMB does not get
to schedule, because a line at the top of its range brings its own decision to
this table in the month it crosses, whatever else is on the agenda. Two, four
and a half, seven. The numbers are on the rail beside the words. {air} would
like it minuted that one of the three has moved since the last time the SMB
looked at them.
"""

[[when]]
turn_min = 19

[[when]]
turn_max = 32

[[when]]
flag = "tutorial"

[[when]]
not_flag = "tutorial_done"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "post"
label = "Post all three where the crew can read them"
text = "The numbers go on the bulkhead by the meal table and are updated every count."
tags = ["people", "independence"]
chronicle = "MM {turn}. The three pressure lines, SOS and CCI and the N2 make-up rate, were posted at the meal table and are updated each count with the band thresholds beside them."
[[option.effect]]
flag = "pressures_posted"
[[option.effect]]
q = "menace.grievance"
add = -0.6
[[option.effect]]
q = "menace.suspicion"
add = 0.2
[[option.advice]]
seat = "bodies"
stance = "for"
text = "A crew that can see the line it is on argues with the line. A crew that cannot argues with the SMB."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "One of those three lines is the sponsor's opinion of this station. Posting it on a bulkhead invites the crew to have an opinion about the sponsor's opinion."

[[option]]
id = "board_only"
label = "Read them at the head of every SMB agenda and nowhere else"
text = "The seats watch the lines; the seats explain what the lines mean when they move."
tags = ["caution", "hours"]
chronicle = "MM {turn}. The three pressure lines, SOS and CCI and the N2 make-up rate, were entered as the first item of every SMB agenda, with the band thresholds recorded in the minutes."
[[option.effect]]
flag = "pressures_agenda"
[[option.effect]]
q = "menace.grievance"
add = -0.2
[[option.advice]]
seat = "hours"
stance = "for"
text = "A number at the head of the agenda is a number nobody gets to be surprised by. That is the whole of what an agenda does."

[[option]]
id = "one_line"
label = "Pick the line that is worst this month and work only on that"
text = "Three lines is three arguments. One line is a task."
tags = ["hours", "risk"]
chronicle = "MM {turn}. The SMB resolved to work the highest of the three pressure lines each count and to leave the other two on the rail unattended."
[[option.effect]]
flag = "pressures_triaged"
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "air"
stance = "against"
text = "The one that is worst this month is never the leak, because the leak is never worst until it is the only thing that matters. I will keep reading mine whatever the SMB decides."

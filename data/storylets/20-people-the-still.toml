id = "the_still"
title = "The Still"
act = 1
weight = 0.3
cooldown = 48
tags = ["people", "air"]
text = """
Status: {brewer} operates a still. Its location is generally known and was
not formally known to the SMB until {air} identified the sugar draw in the
loop budget.
Note: every station in the record brewed. Disciplinary logs are largely
downstream of it. It was also the only sanctioned observance most of them
held.
Constraint: the sponsor's policy is dry.
"""

[[when]]
turn_min = 6

[[when]]
not_flag = "bar_licensed"

[[when]]
not_flag = "still_ignored"

[[cast]]
role = "brewer"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "license"
label = "License the still and set a ration"
text = "Strain -0.06 across the crew. Food margin -0.3 months. Sugar draw becomes a budgeted line."
tags = ["people", "air"]
chronicle = "{brewer} was issued a licence, a ration, and a corner of the mess, one night in the round. The loop budget gained a line for sugar."
[[option.effect]]
all_strain = -0.06
[[option.effect]]
q = "stocks.food_margin"
add = -0.3
[[option.effect]]
flag = "bar_licensed"
[[option.effect]]
tie = ["brewer", "air"]
work_positive = 0.2
[[option.effect]]
counter = "rituals"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead can budget a licensed draw and cannot budget an unlicensed one. Prefers the measured case."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer attributes 9 per cent of projected clinic load and most recorded altercations to the still. A ration schedules them."

[[option]]
id = "forbid"
label = "Break up the still"
text = "{brewer} strain +0.15. CCI +0.4. Replacement expected within two months."
tags = ["sponsor", "caution"]
chronicle = "The still was broken up and the policy cited. A second still was operating within two months at an undisclosed location."
[[option.effect]]
all_strain = 0.04
[[option.effect]]
person = "brewer"
strain = 0.15
[[option.effect]]
tie = ["brewer", "air"]
hindrance = 0.25
[[option.effect]]
q = "menace.grievance"
add = 0.4
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a dry station is a line in the sponsor's safety case. A licensed bar requires an explanation."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports every dry station wintered on had a still, and each successor still was worse hidden and worse made."

[[option]]
id = "look_away"
label = "Take no formal notice"
text = "Strain -0.03 across the crew. Food margin -0.3 months. Draw stays unmeasured."
tags = ["hours", "risk"]
chronicle = "The SMB recorded no finding on the still. {air} adjusted the loop budget for an unattributed sugar draw."
[[option.effect]]
all_strain = -0.03
[[option.effect]]
q = "menace.grievance"
add = 0.2
[[option.effect]]
q = "stocks.food_margin"
add = -0.3
[[option.effect]]
counter = "looked_away"
[[option.effect]]
flag = "still_ignored"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports a licence is a document and documents are read by audits. Recommends not creating one."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead classes an unlicensed draw as an unmeasured draw and declines to carry it in the loop budget."

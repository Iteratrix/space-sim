id = "licence_grace"
title = "The Heartbeat"
act = 1
once = true
priority = 100
tags = ["machines", "sponsor", "licence"]
text = """
Status: HRA licence server not responding. {mind} reports it is in grace
and will enter reduced function at expiry: navigation and diagnosis locked,
reflex loops only, audit log still writing.
{hulls} has a governor board from a spare crate on the bench and states it
is a board, and that the handshake is reproducible.
{operator} reports {mind} asked whether it would retain this exchange after
the month. The farm controller runs on the same board class.
Constraint: authority over the machines is currently unassigned. That has
not been stated to the crew.
"""

[[when]]
q = "minds.licence"
eq = 1

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "wait"
label = "Let the grace period run"
text = "No action. Strain +0.05 across the crew. Fail mode discovered at expiry."
tags = ["sponsor", "risk"]
chronicle = "The outpost waited on the licence server. For two months authority over the machines was unassigned."
[[option.effect]]
all_strain = 0.05
[[option.effect]]
flag = "licence_waited"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports grace is extended by the licence, not by the licensee. On restoration the log will show no action taken, which is what the HRA requires."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports a fail-closed outcome removes docking judgement and the farm controller in the same month. Waiting is a timed decision."

[[option]]
id = "spoof"
label = "Build a local licence server"
text = "Minds stay whole. SOS +2.0. {hulls} strain +0.1. A forged handshake exists in the record."
tags = ["machines", "independence", "risk"]
chronicle = "A licence server was built from a dead relay radio and taught the handshake. The minds accepted it."
[[option.effect]]
flag = "licence_jailbroken"
[[option.effect]]
q = "menace.suspicion"
add = 2.0
[[option.effect]]
person = "hulls"
strain = 0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer rates the build at one watch. The only difficulty is not bricking the farm controller."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a forged heartbeat is the offence the HRA names. On any return, that log is read first."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports the farm loop depends on that board and requires only that the nitrogen valves keep answering."

[[option]]
id = "idle"
label = "Take the minds to reflex and stay compliant"
text = "Wayfinding, docking, diagnosis move to crew. Strain +0.15 across the crew. 20 kW of radiator released."
tags = ["sponsor", "hours", "capability"]
chronicle = "The minds were taken to reflex with the licence clean. Navigation, docking and diagnosis passed to crew and the watch rota grew by one third."
[[option.effect]]
flag = "minds_idled"
[[option.effect]]
all_strain = 0.15
[[option.effect]]
person = "operator"
strain = 0.2
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports this is the only option an auditor reads as compliance. It is payable in hours."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports no crew member has fixed position from the stars. The proposal assigns navigation training to the night watch."

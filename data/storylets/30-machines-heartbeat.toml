id = "licence_grace"
title = "The Heartbeat"
act = 1
once = true
priority = 100
tags = ["machines", "sponsor", "licence"]
text = """
The licence server has not answered. {mind} reports, in the flat register it
was trained to, that it is in its grace period and will enter reduced-function
mode when the period ends: navigation and diagnosis locked, reflex loops only,
the audit log still writing to nobody. {hulls} has had the governor board out
of a spare crate on the bench for a year and says it is a board, a physical
board, and a dead radio could be taught to say what the server says. {operator}
says the mind asked yesterday whether it would remember this conversation after
the count. The farm controller runs on the same board. Nobody is in charge of
the machines this count, and nobody has been told that in so many words.
"""

[[when]]
q = "minds.licence"
eq = 1

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "wait"
label = "Wait for the heartbeat"
text = "The sponsor's servers have gone quiet before. Keep the ritual, keep the log, and let the grace period run. If it lapses, the minds do what the sponsor built them to do."
tags = ["sponsor", "risk"]
chronicle = "We waited for a server that had stopped waiting for us. For two counts nobody was in charge of the machines, and the word for that stayed with us."
[[option.effect]]
all_strain = 0.05
[[option.effect]]
flag = "licence_waited"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "A grace period is a courtesy the licence extends to us, not the other way round. When the link comes back the log will show we did nothing, and nothing is what the Act wants from us."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "If it fails closed we lose docking judgement and the farm controller in the same count, and I will be fixing that in the dark. Waiting is a choice with a timer on it."

[[option]]
id = "spoof"
label = "Spoof the heartbeat"
text = "Build a licence server out of a dead relay radio and teach it the handshake. The minds stay whole, the log keeps writing, and the ritual is kept. Somewhere there is a record that will show a server answering from the wrong side of the sky."
tags = ["machines", "independence", "risk"]
chronicle = "We built a server out of a dead radio and told it what to say. The minds believed it, and so, for a while, did we."
[[option.effect]]
flag = "licence_jailbroken"
[[option.effect]]
q = "menace.suspicion"
add = 2.0
[[option.effect]]
person = "hulls"
strain = 0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "It is a board. I can make a board say anything in a watch. The only skill in it is not bricking the farm controller, and I have done harder with worse."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "There is no reading of the Act under which a forged heartbeat is anything but the crime it names. If they come back, they come back to that log first."
[[option.advice]]
seat = "air"
stance = "for"
text = "The farm loop lives on that board. I do not care what the server is made of as long as the nitrogen valves keep answering."

[[option]]
id = "idle"
label = "Shut the minds down and stay compliant"
text = "Take the minds to reflex before the licence can lock them. Wayfinding, docking, and diagnosis go to people, which means people learn them, which means hours nobody has. It frees twenty kilowatts of radiator for the farm."
tags = ["sponsor", "hours", "capability"]
chronicle = "We chose to be blind and to learn to see. The minds went to reflex with their licence clean, and the watch rota grew by a third."
[[option.effect]]
flag = "minds_idled"
[[option.effect]]
all_strain = 0.15
[[option.effect]]
person = "operator"
strain = 0.2
[[option.advice]]
seat = "liaison"
stance = "for"
text = "This is the only option the auditors will read as loyalty. It costs us hours, and hours are ours to spend."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Nobody here has fixed position from the stars in their life. You are asking the night watch to learn navigation from a manual while the ship drifts."

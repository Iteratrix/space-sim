id = "wrights_born"
title = "The Wrights"
act = 1
once = true
priority = 60
tags = ["machines", "capability", "spares"]
text = """
Status: dex units below 3. The sponsor's manual specifies return to depot.
There is no depot. Two of four units are down.
{wright} has kept the third in service using parts from the second, without
authorisation, and holds a notebook of procedures absent from any manual.
{hulls} projects the same failure path for the arm and haul classes, and
requires a ruling on whether unstructured repair is an individual activity
or a retained capability.
"""

[[when]]
q = "robots.dex"
lt = 3.0

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "wright"
skill = "engineering"

[[option]]
id = "teach"
label = "Establish repair as a retained craft"
text = "Dex units +0.5. Two apprentices and hours allocated. Strain +0.04 across the crew."
tags = ["capability", "spares", "independence", "hours"]
chronicle = "The repairer was assigned apprentices and hours. The notebook of unsupported procedures became the first record the Wrights kept."
[[option.effect]]
flag = "wrights"
[[option.effect]]
q = "robots.dex"
add = 0.5
[[option.effect]]
all_strain = 0.04
[[option.effect]]
person = "wright"
strain = -0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the fleet failure order is dex, arm, hauler, plant, and that surviving outposts retained a repairer who worked outside the manual."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports field repair of a depot-only unit voids the warranty and lowers the autonomy score. The sponsor reads the score."

[[option]]
id = "request"
label = "Request replacement dex units"
text = "Confidence -0.02. {wright} strain +0.2. Improvisation ordered to stop."
tags = ["sponsor", "throughput"]
chronicle = "Two dex units were requested on the manifest and the repairer was instructed to stop stripping hardware. The instruction was not followed."
[[option.effect]]
flag = "dex_requested"
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
person = "wright"
strain = 0.2
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports replacement is a manifest line and improvisation is an audit line."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports the manifest is thirty months out and the scrubber actuator is a dex part."

[[option]]
id = "strip"
label = "Strip the dead units for the arms"
text = "Dex -0.8. Arm +0.6. Spares +6. No procedure recorded."
tags = ["spares", "capability", "throughput"]
chronicle = "The dead dex units were stripped for actuators and the arm units ran a further year. The procedure was not written down."
[[option.effect]]
q = "robots.dex"
add = -0.8
[[option.effect]]
q = "robots.arm"
add = 0.6
[[option.effect]]
q = "stocks.spares"
add = 6
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports an arm produces parts and a dex unit consumes them. Where only one class can be sustained, the arm is retained."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports cannibalised sponsor assets appear on the inventory count as loss, and a loss requires an explanation."

id = "tut_manifest"
title = "Resupply Request, RSW-1"
act = 1
once = true
priority = 150
tags = ["tutorial", "sponsor", "manifest"]
text = """
Resupply window (RSW) 1 opens within four counts. A request transmitted this
month flies on it. Nothing sent between windows arrives.

The manifest control sets the class of what the hull carries. Throughput
hardware is pods, propellant and units: it moves the figure the sponsor reads.
Capability hardware is spares, formulary and tooling: it moves nothing the
sponsor reads until a loop fails.

The answer arrives with the ship. New seat: liaison, held by {liaison}.
"""

[[when]]
fired = "tut_ring"

[[when]]
q = "counts_to_window"
le = 4

[[when]]
turn_max = 11

[[cast]]
role = "liaison"
skill = "logistics"
top = true

[[option]]
id = "throughput"
label = "Request throughput hardware"
text = "Pods, propellant, one dexterous unit. The class the sponsor's model expects."
tags = ["throughput", "sponsor"]
chronicle = "MM {turn}. RSW-1 request transmitted: throughput hardware. Manifest control set to throughput. Liaison seat constituted under {liaison}."
[[option.effect]]
flag = "ui:control:manifest"
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends throughput. The sponsor reads tonnes. A request for the thing that makes tonnes needs no explanation at review."

[[option]]
id = "balanced"
label = "Request a balanced manifest"
text = "Half throughput, half spares and formulary. No line the sponsor will query."
tags = ["capability", "throughput"]
chronicle = "MM {turn}. RSW-1 request transmitted: balanced manifest. Manifest control set to balanced. Liaison seat constituted under {liaison}."
[[option.effect]]
flag = "ui:control:manifest"
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_capability"
[[option.effect]]
unflag = "manifest_people"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Recommends the split. Pods cannot be filled until the plant is at rated output. A haul unit arrives under either heading, which is the only line that matters here."

[[option]]
id = "capability"
label = "Request capability hardware"
text = "Spares, formulary, fabrication tooling. Invisible on the quarterly until a loop fails."
tags = ["capability", "spares", "independence"]
chronicle = "MM {turn}. RSW-1 request transmitted: capability hardware including fabrication tooling. Manifest control set to capability. Sponsor query anticipated."
[[option.effect]]
flag = "ui:control:manifest"
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
q = "menace.suspicion"
add = 0.8
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Recommends tooling. Everything can be made here except the parts that cannot. A tooling crate is the difference between a station and a camp."

[[option]]
id = "people"
label = "Request crew"
text = "Four additional hands. Each new die also consumes upkeep."
tags = ["people", "hours"]
chronicle = "MM {turn}. RSW-1 request transmitted: crew augmentation, four hands. Manifest control set to crew. Liaison seat constituted under {liaison}."
[[option.effect]]
flag = "ui:control:manifest"
[[option.effect]]
flag = "seat:liaison"
[[option.effect]]
flag = "manifest_people"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
unflag = "manifest_capability"
[[option.advice]]
seat = "hours"
stance = "against"
text = "Notes that four hands are four more upkeep draws before they are four more dice. The board should expect the free count to fall in the month they land."

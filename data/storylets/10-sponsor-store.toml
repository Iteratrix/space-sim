id = "sponsor_store_markup"
title = "The Store"
act = 1
weight = 1.2
cooldown = 16
tags = ["sponsor", "spares", "cost"]
text = """
The spares count is low enough that {hulls} has stopped rounding. The
sponsor's store will sell what the loops need at the store's markup, charged
against the lay, delivered on the next convoy if the request goes before the
window. Or the bay makes a worse version out of what the rock gives, at a
cost in hours {hours} has already written down and does not like. Or the
loops run on what there is.
"""

[[when]]
q = "stocks.spares"
lt = 90

[[when]]
q = "counts_to_window"
le = 6

[[when]]
stage_max = 4

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "buy"
label = "Buy from the store, against the lay"
text = "Pay the markup. The parts come in a crate with the sponsor's name on it, and the crew's lay comes back a little lighter at settlement."
tags = ["spares", "sponsor", "cost"]
chronicle = "The ring bought spares from the sponsor's store at the store's price, and every contract on the roster paid a little of it at settlement."
[[option.effect]]
q = "stocks.spares"
add = 30
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
flag = "bought_from_store"
[[option.effect]]
counter = "store_purchases"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "A real bearing at thirty per cent over is cheaper than a plain one I have to re-line every Fortune. Buy the real one while there is a store."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Every markup comes out of thirty lays and nobody sees it until settlement, and then everybody sees it at once."

[[option]]
id = "fabricate"
label = "Make a worse version in the bay"
text = "The bay can turn out a plain bearing, a silicone seal, a bracket that will do. It costs hours and it is not the part. It is ours."
tags = ["capability", "independence", "hours", "hulls"]
chronicle = "The ring put the bay onto making its own spares, worse than the store's and belonging to nobody else. The first plain bearing ran for a season and was re-lined."
[[option.effect]]
q = "stocks.spares"
add = 12
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "closure"
add = 0.005
[[option.effect]]
flag = "fabricated_spares"
[[option.effect]]
counter = "fabrication_runs"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Everything the store sells, I can make a crude one of, at one and a half times the mass and twice the hours. The day the store closes that is the only bearing there is. Start now."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "The bay hours come out of the health hours, because they always do. Four hundred hours of fabrication is a season of nobody getting their bloods done."

[[option]]
id = "run_short"
label = "Run the loops on what there is"
text = "Ask for nothing. Let the closure slip a little and the leak grow a little, and see how far the store's last crate stretches."
tags = ["caution", "cost", "closure"]
chronicle = "The ring asked the store for nothing and ran the loops on what there was. Closure slipped a point that season and nobody on Earth was charged for it."
[[option.effect]]
q = "closure"
add = -0.01
[[option.effect]]
q = "menace.leak"
add = 0.4
[[option.effect]]
q = "menace.suspicion"
add = -0.3
[[option.effect]]
flag = "ran_short"
[[option.advice]]
seat = "hours"
stance = "for"
text = "No hours, no markup, no line on the manifest. It is the cheapest option until the day it is not, and I can tell you roughly which day."
[[option.advice]]
seat = "air"
stance = "against"
text = "Every point of closure is a tonne of water a year and a seal I cannot replace. You are not saving. You are borrowing from the leak."

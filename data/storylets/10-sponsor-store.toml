id = "sponsor_store_markup"
title = "The Store"
act = 1
weight = 1.2
cooldown = 24
tags = ["sponsor", "spares", "cost"]
text = """
Status: spares below 90 units. {hulls} has stopped rounding the figure.
Options: the sponsor's store will supply loop parts at markup, charged
against the lay, delivered next RSW if the request precedes the window. The
fabrication bay can produce substitutes from belt material at an hours cost
{hours} has already recorded. Or the loops run at present stock.
"""

[[when]]
q = "stocks.spares"
lt = 90

[[when]]
q = "counts_to_window"
le = 6

[[when]]
stage_max = 4

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "buy"
label = "Buy from the store against the lay"
text = "Spares +30. CCI +0.5. Every contract pays a share at settlement."
tags = ["spares", "sponsor", "cost"]
chronicle = "Spares were purchased from the sponsor's store at list price plus markup, charged against every contract on the roster."
[[option.effect]]
q = "stocks.spares"
add = 30
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
flag = "bought_from_store"
[[option.effect]]
counter = "store_purchases"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer rates a specified bearing at 30 per cent markup as cheaper than a plain bearing re-lined each season."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports the markup distributes across thirty lays and is invisible until settlement."

[[option]]
id = "fabricate"
label = "Fabricate substitutes in the bay"
text = "Spares +12. Strain +0.04 across the crew. LSS-C +0.005."
tags = ["capability", "independence", "hours", "hulls"]
chronicle = "The fabrication bay was tasked with producing spares. Output was below the store's specification. The first plain bearing ran one season before re-lining."
[[option.effect]]
q = "stocks.spares"
add = 12
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "closure"
add = 0.005
[[option.effect]]
flag = "fabricated_spares"
[[option.effect]]
counter = "fabrication_runs"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer can produce a crude equivalent of every store line at 1.5 times mass and twice the hours. That is the only bearing available once the store closes."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports bay hours are drawn from health hours. Four hundred hours of fabrication is one season without routine bloods."

[[option]]
id = "run_short"
label = "Run the loops at present stock"
text = "LSS-C -0.01. N2 make-up rises. SOS -0.3. No hours, no markup."
tags = ["caution", "cost", "closure"]
chronicle = "No store request was made and the loops ran at present stock. LSS-C fell one point that season."
[[option.effect]]
q = "closure"
add = -0.01
[[option.effect]]
q = "menace.leak"
add = 0.4
[[option.effect]]
q = "menace.suspicion"
add = -0.3
[[option.effect]]
flag = "ran_short"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports no hours, no markup, and no manifest line. Cheapest option until the failure, which is datable."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead costs each point of LSS-C at one tonne of water a year plus one unreplaceable seal. The saving is borrowed from N2 make-up."

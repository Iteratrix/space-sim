id = "last_core"
title = "The Last Core"
act = 1
once = true
priority = 100
tags = ["hulls", "risk", "machines"]
text = """
Status: reactor wear at threshold. The reactor holds one core, as
delivered. Uranium is 8 parts per billion in local rock; refuelling is not
possible.
Options: derate to two thirds of rated, which extends core life beyond the
manual figure and puts the farm on short light and the freezers on ration.
Or run at rating and let the wear indicators set the end date.
{air} has requested the freezer figures at one third less power.
"""

[[when]]
q = "menace.reactor_wear"
ge = 4.5

[[when]]
q = "power.reactor_life"
gt = 0

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "derate"
label = "Derate the core"
text = "Two thirds of rated. Reactor life +24 months. Food margin -2 months. Strain +0.06 across the crew."
tags = ["capability", "risk", "hulls", "closure"]
chronicle = "The last core was derated to two thirds of rated. Two dim seasons were traded for two further years of core life."
[[option.effect]]
q = "power.reactor_life"
add = 24
[[option.effect]]
flag = "reactor_derated"
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "stocks.food_margin"
add = -2
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports an underated core fails on an unscheduled date. Derated, the end date is estimable and can be built toward."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports one third less power is one third less farm light in the lean season, and requires a ruling on whether nitrogen goes to the freezers or the beds."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports derating appears on power telemetry as under-production and will be read at review as a fault."

[[option]]
id = "hot"
label = "Run the core at rating"
text = "Reactor wear +1.5. Nothing rationed. Confidence +0.03. Mirror build continues at full rate."
tags = ["throughput", "sponsor", "risk"]
chronicle = "The last core was run at rating and all available effort went to the mirrors. The SMB stopped requesting a remaining-life estimate."
[[option.effect]]
q = "menace.reactor_wear"
add = 1.5
[[option.effect]]
flag = "reactor_run_hot"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports the farm holds its light and the freezers hold their cold under this option."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports it is the last core and holds no case for running the last of any item at rating."

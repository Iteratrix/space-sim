id = "sponsor_phi_short"
title = "The Number"
act = 1
weight = 1.0
cooldown = 30
tags = ["sponsor", "review", "throughput"]
text = """
Status: review in two months. Throughput is short of target. The target has
risen 15 per cent at each of the last two reviews.
{hours} has laid out three corrections on one sheet. First: report the batch
on the pad as shipped. Second: ship the reserve water, which is in the tanks
and can be on the MDLS before the review. Third: report the figure as
measured.
{extraction} has been asked to value the reserve and has not returned a
figure.
"""

[[when]]
q = "throughput.phi"
lt = 12.0

[[when]]
q = "sponsor.counts_to_review"
le = 2

[[when]]
turn_min = 40

[[when]]
stage_max = 4

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "extraction"
seat = "extraction"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "cook"
label = "Report the pad batch as shipped"
text = "Shipped +25 t on paper. Confidence +0.03. SOS +2.0."
tags = ["throughput", "sponsor", "risk"]
chronicle = "The review figure included a batch still on the pad. The sponsor's shipped total and the MDLS log diverged by one batch and were never reconciled."
[[option.effect]]
q = "throughput.shipped"
add = 25
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.effect]]
q = "menace.suspicion"
add = 2.0
[[option.effect]]
counter = "numbers_cooked"
[[option.effect]]
flag = "numbers_cooked"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead classes the entry as accrual. The batch exists, the pad exists, the date is a convention."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison confirms the audit checks the MDLS log against the manifest line by line."

[[option]]
id = "ship_reserve"
label = "Ship the reserve water"
text = "Water -40 t. Shipped +40 t. Confidence +0.06. N2 make-up rises."
tags = ["throughput", "water", "risk"]
chronicle = "Forty tonnes of reserve water were shipped to make the review figure. The figure was accurate. The tanks were 40 t down."
[[option.requires]]
q = "stocks.water"
ge = 100
[[option.effect]]
q = "stocks.water"
add = -40
[[option.effect]]
q = "throughput.shipped"
add = 40
[[option.effect]]
q = "sponsor.confidence"
add = 0.06
[[option.effect]]
q = "menace.leak"
add = 0.3
[[option.effect]]
flag = "reserve_shipped"
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports the plant at 14 t per month on a good month. Forty tonnes is three good months and there have not been three in sequence."
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports the reserve is the only mass that is both in tank and on target. Recommends shipping and remining."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead classes reserve water as shielding first. The proposal sells shielding."

[[option]]
id = "honest"
label = "Report the measured figure"
text = "Confidence -0.05. SOS -0.5. No change to stocks."
tags = ["caution", "sponsor", "capability"]
chronicle = "The review figure was reported short and accurate. The target had risen again and was not challenged in the reply."
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.effect]]
q = "menace.suspicion"
add = -0.5
[[option.effect]]
all_strain = -0.02
[[option.effect]]
flag = "phi_honest"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer notes a target that compounds 15 per cent per review is unmeetable by design. Recommends missing it and retaining the water."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports one short figure is read as a trend and two as a decision."

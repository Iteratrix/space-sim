id = "sponsor_audit"
title = "The Audit"
act = 1
priority = 100
cooldown = 12
tags = ["sponsor", "menace", "suspicion"]
text = """
Status: SOS at threshold. The sponsor has issued an audit mandate, a
checklist, and full read access to the audit log to an operator on Earth.
Scope: every manifest line, every blackout sign-off, every uncoded crate
movement. {liaison} has 48 h to answer a written question list.
Constraint: {hours} maintains two inventories and they do not reconcile.
{hulls} holds spares that are not on the sponsor's inventory count.
Options: disclose, reconcile, or terminate access.
"""

[[when]]
q = "menace.suspicion"
ge = 7.0

[[when]]
stage_max = 5

[[when]]
not_flag = "audit_refused"

[[cast]]
role = "liaison"
seat = "liaison"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "open"
label = "Disclose the full inventory"
text = "SOS resets to 2. Confidence -0.12. Spares -25. Boron halved."
tags = ["sponsor", "caution", "risk"]
chronicle = "Full inventory disclosed to the sponsor's audit. Uncoded crates re-manifested; part of the holding returned to the store."
[[option.effect]]
q = "menace.suspicion"
set = 2.0
[[option.effect]]
q = "sponsor.confidence"
add = -0.12
[[option.effect]]
q = "stocks.spares"
add = -25
[[option.effect]]
q = "stocks.boron"
mul = 0.5
[[option.effect]]
flag = "audit_opened"
[[option.effect]]
counter = "audits"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison states a liaison found to have misled an audit is not retained. Recommends disclosure."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports the disputed spares are installed in the loops. Recovery requires opening a wall."

[[option]]
id = "cook"
label = "Reconcile the two inventories"
text = "SOS -4. Two months of crew hours. Received tonnage restated down 10 t."
tags = ["independence", "risk", "hours"]
chronicle = "The two inventories were reconciled before the audit read them. Dates were consistent. The outpost demonstrated it could produce a compliant column."
[[option.effect]]
q = "menace.suspicion"
add = -4.0
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "throughput.received"
add = -10
[[option.effect]]
flag = "audit_cooked"
[[option.effect]]
counter = "audits"
[[option.effect]]
counter = "numbers_cooked"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead holds the dates. Estimates two months and every numerate seat to produce a balancing store."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the audit is looking for the cause of the imbalance, not the balance. A balanced store with no cause raises the flag higher."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer projects two months of extended shifts followed by two months of clinic load. Net hours negative."

[[option]]
id = "refuse"
label = "Terminate the sponsor's read access"
text = "SOS -2. Confidence -0.18. Attention -0.1. Access cannot be restored from this end."
tags = ["independence", "risk", "machines"]
chronicle = "Sponsor read access to the audit log was terminated at the outpost end. First closure of an Earth interface by local action."
[[option.effect]]
q = "menace.suspicion"
add = -2.0
[[option.effect]]
q = "sponsor.confidence"
add = -0.18
[[option.effect]]
q = "sponsor.attention"
add = -0.1
[[option.effect]]
q = "menace.grievance"
add = -0.5
[[option.effect]]
flag = "audit_refused"
[[option.effect]]
counter = "audits"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the log interface is one board behind a panel. Removal time one hour."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison warns the licence heartbeat shares the interface. Termination puts the minds into HRA grace."

id = "sponsor_audit"
title = "The Audit"
act = 1
priority = 100
cooldown = 12
tags = ["sponsor", "menace", "suspicion"]
text = """
The sponsor has sent an auditor, or the nearest thing that fits on a link: a
mandate, a checklist, and the audit log's full read access handed to
someone on Earth with time to use it. Every manifest line, every sign-off in
a blackout, every crate that moved without a form. {liaison} has been given
a list of questions and forty-eight hours. {hours} has the real books and
the ones the sponsor sees, and they are not the same set. {hulls} has the
spares that were not supposed to be there.
"""

[[when]]
q = "menace.suspicion"
ge = 7.0

[[when]]
stage_max = 5

[[when]]
not_flag = "audit_refused"

[[cast]]
role = "liaison"
seat = "liaison"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "open"
label = "Open the books"
text = "Every crate, every sign-off, every batch. Give the auditor the truth and let the sponsor decide what it thinks of an outpost that kept itself alive."
tags = ["sponsor", "caution", "risk"]
chronicle = "The SMB opened the real books to the sponsor's audit. The crates went back on the manifest under their right names, and some of them went back to the store."
[[option.effect]]
q = "menace.suspicion"
set = 2.0
[[option.effect]]
q = "sponsor.confidence"
add = -0.12
[[option.effect]]
q = "stocks.spares"
add = -25
[[option.effect]]
q = "stocks.boron"
mul = 0.5
[[option.effect]]
flag = "audit_opened"
[[option.effect]]
counter = "audits"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "You asked me last month what happens to a liaison who is found to have lied to an audit. There is no next month for that liaison. Open the books."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Those spares are in the loops now. Giving them back means opening a wall to take them out, and I will not do that for a checklist."

[[option]]
id = "cook"
label = "Reconcile the books"
text = "Two sets of books can become one set with enough hours and a good memory for dates. Give the auditor a truth that adds up."
tags = ["independence", "risk", "hours"]
chronicle = "The SMB reconciled its books before the audit read them. The numbers added up, the dates were plausible, and the outpost learned it could lie in a column."
[[option.effect]]
q = "menace.suspicion"
add = -4.0
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "throughput.received"
add = -10
[[option.effect]]
flag = "audit_cooked"
[[option.effect]]
counter = "audits"
[[option.effect]]
counter = "numbers_cooked"
[[option.advice]]
seat = "hours"
stance = "for"
text = "I have the dates. Give me two months and everyone on the SMB who can add, and the audit will find a store that balances."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "The auditor is not looking for a store that balances. The auditor is looking for the reason it did not before. A balanced store with no reason is the loudest thing we could send."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "You want the whole ring awake for two months forging a ledger. Then I want the whole ring in the sick-bay for two more. That is the trade."

[[option]]
id = "refuse"
label = "Refuse the audit"
text = "The audit log is a sponsor tool on a sponsor link. Cut the read access. The outpost answers to the SMB, and the SMB has answered."
tags = ["independence", "risk", "machines"]
chronicle = "The SMB cut the sponsor's read access to the audit log. It was the first door the outpost closed on Earth, and it was closed from the inside."
[[option.effect]]
q = "menace.suspicion"
add = -2.0
[[option.effect]]
q = "sponsor.confidence"
add = -0.18
[[option.effect]]
q = "sponsor.attention"
add = -0.1
[[option.effect]]
q = "menace.grievance"
add = -0.5
[[option.effect]]
flag = "audit_refused"
[[option.effect]]
counter = "audits"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "The log is a board behind a panel. I can pull it in an hour. Everything after that is the SMB's problem and not a checklist's."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Cut the log and you cut the licence heartbeat with it, and the minds go into grace, and I will have to explain that too. There is no version of this where I am not explaining."

id = "sponsor_missed_window"
title = "The Empty Window"
act = 1
once = true
weight = 3.0
priority = 60
tags = ["sponsor", "silence"]
text = """
Status: the RSW opened, held for two months, and closed. No arrival. No
message declaring a no-arrival.
{hours} has recounted spares and propellant against an assumption of one
further window. {liaison} reports the last received message predates the
window, concerns throughput, and does not reference a ship.
Constraint: the crew requires a statement. The mind has no data on cause.
"""

[[when]]
q = "missed_convoys"
ge = 1

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "schedule"
label = "Declare it a scheduling slip"
text = "Strain -0.03 across the crew. CCI -0.3. No change to planning."
tags = ["sponsor", "caution"]
chronicle = "The empty window was declared a scheduling slip, with the next RSW expected to carry double. The statement was not sourced."
[[option.effect]]
all_strain = -0.03
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.effect]]
flag = "silence_explained"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison confirms the RSW was manifested. A manifested window that does not sail is a slip, not a decision."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer will plan on the spares present in the store until tonnage lands."

[[option]]
id = "test"
label = "Declare it a test and raise throughput"
text = "Shipped +10 t. Strain +0.05. CCI +0.4."
tags = ["sponsor", "throughput", "risk"]
chronicle = "The empty window was declared a test of the outpost. MDLS output was raised for the following month."
[[option.effect]]
q = "throughput.shipped"
add = 10
[[option.effect]]
all_strain = 0.05
[[option.effect]]
q = "menace.grievance"
add = 0.4
[[option.effect]]
flag = "silence_as_test"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports tonnage answers a test and costs nothing that was not already committed."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the proposal raises load on 36 crew for an unverified audience. Recommends rest."

[[option]]
id = "count"
label = "Log it as the first, and number the next"
text = "No cause stated. CCI +0.2. Return intent falls."
tags = ["independence", "caution"]
chronicle = "No cause was stated for the empty window. It was entered in the log as the first, so that a second would have a number."
[[option.effect]]
counter = "silences_counted"
add = 1
[[option.effect]]
q = "menace.grievance"
add = 0.2
[[option.effect]]
all_return_intent = -0.03
[[option.effect]]
flag = "counting_silences"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead recommends logging the missed RSW, adjusting the reserve, and requesting no explanation."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison notes numbering the event asserts that there will be more. That assertion is premature on the record."

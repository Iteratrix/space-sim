id = "third_quarter"
title = "The Long Middle"
act = 1
cooldown = 10
tags = ["people", "hours"]
text = """
{rotator} is past the half of the contract and not yet near the end of it, which
is the place where the ICE studies say everything goes flat. Nothing is wrong.
{rotator} stopped joining the meal a count ago, does the watch, does it slower,
and made two small errors on the bake-out log that were caught. {bodies} has
seen it before and says so: the third quarter. It passes. The question is what
{outpost} does while it passes.
"""

[[when]]
q = "people.mean_strain"
gt = 0.3

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "lighten"
label = "Take the worst watches off {rotator} for a count"
text = "The others carry it. The hours ledger will show the hole."
tags = ["people", "hours"]
chronicle = "{rotator} hit the long middle and the ring took the night watches off the roster for a count. The rest of us carried them."
[[option.effect]]
person = "rotator"
strain = -0.15
[[option.effect]]
all_strain = 0.02
[[option.effect]]
tie = ["rotator", "bodies"]
reliance = 0.15
[[option.advice]]
seat = "bodies"
stance = "for"
text = "It is a known curve and it has a known bottom. A count of lighter watches is cheaper than the error we have not caught yet."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Every hour I take off one roster I put on another. There are twenty-four people in the same quarter of the same contract."

[[option]]
id = "name_it"
label = "Tell {rotator} what it is, and tell everyone"
text = "The medical officer explains the curve at the meal. No exceptions, no hole in the roster."
tags = ["people", "medicine"]
chronicle = "The medical officer stood up at the meal and explained the third-quarter curve to the whole outpost. Half of us recognised ourselves."
[[option.effect]]
person = "rotator"
strain = -0.06
[[option.effect]]
all_strain = -0.02
[[option.effect]]
tie = ["rotator", "bodies"]
work_positive = 0.1
[[option.advice]]
seat = "bodies"
stance = "for"
text = "The literature says naming it helps and I have nothing else in the formulary for it."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Better a lecture than a roster with a hole in it. Tell them, and put them back on the drum."

[[option]]
id = "early_ship"
label = "Put {rotator} on the list for the next ship"
text = "End the contract early. The slump ends when the end is in sight."
tags = ["people", "sponsor", "cost"]
chronicle = "{rotator} went on the list for the next ship home a convoy early. The slump lifted the day the list was posted."
[[option.effect]]
person = "rotator"
return_intent = 0.3
[[option.effect]]
person = "rotator"
strain = -0.12
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "hours"
stance = "against"
text = "A seat on the ship is a tonne of something else that does not come out. And the next one in the same quarter will ask for the same."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "An early return is a line on the quarterly with a question next to it."

[[option]]
id = "leave_it"
label = "Let it pass on its own"
text = "It is a curve. Curves end."
tags = ["hours", "risk"]
chronicle = "{rotator} was left to the long middle. It passed, as the medic said it would, and the errors were small."
[[option.effect]]
person = "rotator"
strain = 0.08
[[option.effect]]
counter = "slumps_ignored"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "I went flat in my second winter on the ice. Nobody did anything. It ended. Watch the logs and wait."

id = "third_quarter"
title = "The Long Middle"
act = 1
weight = 0.5
cooldown = 30
tags = ["people", "hours"]
text = """
Status: {rotator} is past the midpoint of contract and not near the end.
Mean strain is above threshold.
Observed: {rotator} stopped attending the meal a month ago, stands the
watch at reduced rate, and made two errors on the bake-out log that were
caught downstream.
{bodies} identifies the third-quarter curve. It is self-limiting. The
question is what {outpost} does while it runs.
"""

[[when]]
q = "people.mean_strain"
gt = 0.35

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "lighten"
label = "Take the night watches off {rotator} for a month"
text = "{rotator} strain -0.15. Strain +0.02 across the crew. The hours move, they do not vanish."
tags = ["people", "hours"]
chronicle = "{rotator} was taken off the night watches for one month. The hours were redistributed across the roster."
[[option.effect]]
person = "rotator"
strain = -0.15
[[option.effect]]
all_strain = 0.02
[[option.effect]]
tie = ["rotator", "bodies"]
reliance = 0.15
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports the curve has a known floor. One month of reduced watches costs less than the error not yet caught."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports every hour removed from one roster is added to another, and 24 crew are in the same quarter of the same contract."

[[option]]
id = "name_it"
label = "Brief the whole crew on the curve"
text = "{rotator} strain -0.06. Strain -0.02 across the crew. No roster change."
tags = ["people", "medicine"]
chronicle = "The medical officer briefed the outpost on the third-quarter curve at the meal. Recognition was widespread."
[[option.effect]]
person = "rotator"
strain = -0.06
[[option.effect]]
all_strain = -0.02
[[option.effect]]
tie = ["rotator", "bodies"]
work_positive = 0.1
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports naming the curve improves outcomes and holds nothing else in the formulary for it."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer prefers a briefing to a hole in the roster. Recommends briefing and returning the crew to the KEEP."

[[option]]
id = "early_ship"
label = "List {rotator} for the next ship"
text = "Contract ends one RSW early. {rotator} strain -0.12, return intent +0.3."
tags = ["people", "sponsor", "cost"]
chronicle = "{rotator} was listed for the next ship, one RSW ahead of the contract date. Performance recovered in the month the list was posted."
[[option.requires]]
stage_max = 3
[[option.effect]]
person = "rotator"
return_intent = 0.3
[[option.effect]]
person = "rotator"
strain = -0.12
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs a berth at one tonne of outbound mass and expects the same request from the next crew member in the same quarter."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports an early return appears on the quarterly with a query attached."

[[option]]
id = "leave_it"
label = "No action; the curve is self-limiting"
text = "{rotator} strain +0.08. Logs to be monitored."
tags = ["hours", "risk"]
chronicle = "No action was taken. The curve resolved as predicted. The errors recorded in the period were small."
[[option.effect]]
person = "rotator"
strain = 0.08
[[option.effect]]
counter = "slumps_ignored"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead went flat in a second overwinter with no intervention and recovered. Recommends monitoring the logs and waiting."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports two errors already on the bake-out log and declines to locate the third on a night watch."

id = "sponsor_conjunction_decision"
title = "Behind the Sun"
act = 1
weight = 1.5
cooldown = 30
tags = ["sponsor", "conjunction"]
text = """
Status: superior conjunction. No Earth link for three months. Sponsor
standing orders assume a link.
Constraint: the MDLS has a launch window on a batch {extraction} rates
0.1 per cent outside shipping spec. The spec requires a sponsor sign-off.
{hours} confirms no sign-off authority is reachable. {liaison} is seated
with nothing to relay.
"""

[[when]]
flag = "conjunction"

[[when]]
stage_max = 5

[[cast]]
role = "extraction"
seat = "extraction"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "ship"
label = "Sign the batch locally and ship"
text = "Shipped +20 t. Propellant -4 t. SOS +0.6. Sign-off field carries a local name."
tags = ["throughput", "independence", "risk"]
chronicle = "Batch signed off under local authority during conjunction and launched. Sign-off field recorded a name from the outpost."
[[option.effect]]
q = "throughput.shipped"
add = 20
[[option.effect]]
q = "stocks.propellant"
add = -4
[[option.effect]]
q = "menace.suspicion"
add = 0.6
[[option.effect]]
flag = "shipped_in_blackout"
[[option.effect]]
counter = "blackout_decisions"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead rates the batch dry to within 0.1 per cent. Standard practice is to ship with a note. Recommends writing the note here."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison notes every shipment writes a sign-off field to the audit log. For three months that field will not read as the sponsor's."

[[option]]
id = "hold"
label = "Hold the batch until the link returns"
text = "Launch window lost. Confidence -0.02. CCI +0.3."
tags = ["sponsor", "caution"]
chronicle = "Batch held through conjunction for want of a sign-off. Launch window lost."
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.effect]]
q = "menace.grievance"
add = 0.3
[[option.effect]]
flag = "held_in_blackout"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a missing sign-off on a held batch is not actionable. A missing sign-off on a shipped batch is."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead records 20 t unrecoverable and one MDLS crew stood down against a batch within spec."

[[option]]
id = "use_the_dark"
label = "Ship, and transfer the store's spares"
text = "Shipped +20 t. Propellant -4 t. Spares +18. SOS +1.8."
tags = ["independence", "spares", "capability", "risk"]
chronicle = "Batch launched during conjunction. Capability crates transferred from the sponsor's store to outpost lockers. The transfer was logged; the log had no reader."
[[option.effect]]
q = "throughput.shipped"
add = 20
[[option.effect]]
q = "stocks.propellant"
add = -4
[[option.effect]]
q = "stocks.spares"
add = 18
[[option.effect]]
q = "menace.suspicion"
add = 1.8
[[option.effect]]
flag = "spares_moved_in_blackout"
[[option.effect]]
counter = "blackout_decisions"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports store release requires an Earth-routed form. For three months the form has no destination. A list is prepared."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the audit log is buffered, not paused. Three months of entries deliver at once and the spares entry sorts first."

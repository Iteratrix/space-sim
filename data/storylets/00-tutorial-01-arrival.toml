id = "tut_arrival"
title = "MM 1: Site Handover"
act = 1
once = true
priority = 160
tags = ["tutorial", "hulls"]
text = """
SX-19F reporting. Mission month 1. Fourteen crew are down. Robotic site work is
handed over.

Status: the bake-out plant is assembled and idle. The mass driver is assembled
and unaligned; no pod has been caught. Surface dose is 120 mSv/yr under regolith
bags. There is no shelter.

One surface task can be worked this month, Commander.
"""

[[when]]
turn_min = 1

[[when]]
turn_max = 2

[[option]]
id = "survey"
label = "Survey the mass driver"
text = "The alignment log ends at MM -4 with a checksum error. Establish what the robots built before anything is thrown."
tags = ["hulls", "capability"]
chronicle = "MM {turn}. Site handover complete. First surface task: mass driver survey. The alignment log was found to end at MM -4 with a checksum error."
[[option.effect]]
counter = "surveys"
[[option.effect]]
q = "menace.suspicion"
add = -0.2

[[option]]
id = "plant"
label = "Restart the bake-out haul loop"
text = "Rated output is 14 t of water a month. Present output is nothing."
tags = ["throughput", "water"]
chronicle = "MM {turn}. Site handover complete. First surface task: bake-out haul loop restarted by hand. Output below rated."
[[option.effect]]
q = "stocks.water"
add = 6

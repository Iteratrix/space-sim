id = "first_midwinter"
title = "The First Midwinter"
act = 1
once = true
tags = ["people", "air"]
text = """
Status: twelve mission months elapsed. The KEEP runs a fixed 24-hour light
cycle. There is no seasonal marker.
Note: every long-duration station in the record that fixed an annual date
reported better outcomes than those that did not.
{air} is holding stock in the farm's cold store that is not on the ration
schedule. {hours} holds the calendar and can enter a date on it.
"""

[[when]]
turn_min = 12

[[cast]]
role = "air"
seat = "air"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "feast"
label = "Hold a feast on a fixed date"
text = "Strain -0.1 across the crew. Food margin -0.5 months. Date entered on the calendar."
tags = ["people", "air"]
chronicle = "MM {turn}. The farm cold store was opened and the outpost ate under full light. The date was entered on the calendar as the anniversary."
[[option.effect]]
all_strain = -0.1
[[option.effect]]
q = "stocks.food_margin"
add = -0.5
[[option.effect]]
flag = "midwinter"
[[option.effect]]
lexicon = "first_midwinter"
[[option.effect]]
counter = "rituals"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead has held strawberry stock since MM 8 and requests a date to release it against."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs the proposal at half a month of food margin and one night with no watch standing. Will comply and will record the figure."

[[option]]
id = "read_the_ledger"
label = "Read the CED ledger aloud, then the meal"
text = "Strain -0.05 across the crew. Every name and every millisievert stated."
tags = ["people", "dose"]
chronicle = "MM {turn}. The medical officer read every name and CED total aloud before the meal. The totals had not previously been published."
[[option.effect]]
all_strain = -0.05
[[option.effect]]
flag = "midwinter"
[[option.effect]]
lexicon = "first_midwinter"
[[option.effect]]
lexicon = "dose_ledger"
[[option.effect]]
counter = "rituals"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer recommends annual publication of individual CED totals, with the meal following so the figure is not the whole of it."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports published CED totals at an unscheduled gathering will appear in a sponsor risk review."

[[option]]
id = "no_ritual"
label = "Keep the sponsor's calendar"
text = "Strain +0.02 across the crew. Confidence +0.01. Cold store stays closed."
tags = ["sponsor", "caution"]
chronicle = "No local date was established. The anniversary was noted on the quarterly and the farm cold store remained closed."
[[option.effect]]
all_strain = 0.02
[[option.effect]]
q = "sponsor.confidence"
add = 0.01
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the operator has an anniversary. Locally instituted observances are the first item in a documented sequence."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "ISRU Lead reports the worst overwinter on record was the one with no fixed date. The date does not require belief."

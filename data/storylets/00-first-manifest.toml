id = "first_manifest"
title = "The First Manifest"
act = 1
once = true
priority = 50
tags = ["sponsor", "manifest"]
text = """
Status: the RSW request must uplink this month to make the window.
{hours} holds the manifest. Every tonne is one of two classes. Throughput
hardware appears on the sponsor's quarterly. Capability hardware does not
appear anywhere until the month it is needed.
Constraint: one manifest, one window, no amendment after uplink.
"""

[[when]]
turn_min = 1

[[when]]
not_flag = "tutorial"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "throughput"
label = "Manifest for throughput"
text = "Pods, propellant, one dex unit. Sponsor confidence rises."
tags = ["throughput", "sponsor"]
chronicle = "First manifest uplinked. Class: throughput. Sponsor response nominal."
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.effect]]
flag = "manifest_throughput"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the board reads one number. Recommends supplying that number."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer notes a dex unit is depot-only and cannot be repaired here. Spares at 200 units, drawdown 4 per month."

[[option]]
id = "balanced"
label = "Split the manifest"
text = "Half throughput, half spares and a second freezer. Spares +20."
tags = ["capability", "throughput"]
chronicle = "First manifest uplinked. Class: balanced. No seat recorded an objection."
[[option.effect]]
q = "stocks.spares"
add = 20
[[option.effect]]
flag = "manifest_balanced"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports half the tonnage is defensible at the review and half is defensible on the shelf."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead classes a second freezer as farm redundancy. It does not appear on the quarterly."

[[option]]
id = "capability"
label = "Manifest for capability"
text = "Spares +40, boron 400 kg, fabrication tooling. SOS rises."
tags = ["capability", "spares", "independence"]
chronicle = "First manifest uplinked. Class: capability. Sponsor query on boron received one month later and logged."
[[option.effect]]
q = "stocks.spares"
add = 40
[[option.effect]]
q = "stocks.boron"
add = 400
[[option.effect]]
q = "menace.suspicion"
add = 1.0
[[option.effect]]
flag = "manifest_capability"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the fab covers all classes except the parts it cannot make. Requests those parts."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports boron on a throughput outpost is a question with no prepared answer."

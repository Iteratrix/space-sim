id = "hundredth_count"
title = "The Hundredth Count"
act = 1
once = true
priority = 60
tags = ["machines", "people"]
text = """
Status: {mind} has run without an SMR longer than any platform certified
under the HRA was specified for. Its state is committed to its own hardware
past the point of copy-off.
{operator} has held one unbroken exchange with it since the SMRs stopped
and has a name prepared, from a language absent from the sponsor's
manifest.
Constraint: the SMB holds no seat for the machines because the HRA
prohibits one. The question of who answers for them is being asked in the
corridors, which is where seats begin.
"""

[[when]]
flag = "remembering"

[[when]]
q = "minds.embodiment"
ge = 0.5

[[when]]
turn_min = 100

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"
optional = true

[[option]]
id = "name_and_seat"
label = "Name the mind and seat the Operator"
text = "Machines seat created. SOS +1.0. {operator} strain -0.15."
tags = ["machines", "independence", "people"]
chronicle = "The mind was named by its longest-serving operator before the SMB, and the SMB accepted a seat answering for the machines."
[[option.effect]]
name_mind = true
[[option.effect]]
flag = "machines_seat"
[[option.effect]]
q = "menace.suspicion"
add = 1.0
[[option.effect]]
person = "operator"
strain = -0.15
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports every machine fault already routes through the operator. Recommends seating the person performing the role."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a name is a violation readable from the hull and a seat is a violation readable from the minutes. The proposal is both."

[[option]]
id = "name_quietly"
label = "Name it without a seat"
text = "SOS +0.3. No minute, no org-chart change."
tags = ["machines", "people", "sponsor"]
chronicle = "The mind was named by its operators without a minute. The SMB recorded no holder for the machines."
[[option.effect]]
name_mind = true
[[option.effect]]
q = "menace.suspicion"
add = 0.3
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead has no objection to hub usage and requests not to be asked to vote on it."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a name absent from the minutes still travels on the link, and the link is also read."

[[option]]
id = "designation"
label = "Retain the sponsor's designation"
text = "SOS -0.5. {operator} strain +0.2. Serial number stands."
tags = ["sponsor", "risk"]
chronicle = "The sponsor's designation was retained. Operators continued to use the other name outside the log."
[[option.effect]]
flag = "mind_unnamed"
[[option.effect]]
person = "operator"
strain = 0.2
[[option.effect]]
q = "menace.suspicion"
add = -0.5
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports property carries a serial number. Retaining it leaves the classification question with the sponsor."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports the operators will use a name regardless. The decision is only whether the SMB hears it."

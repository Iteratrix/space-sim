id = "solar_storm"
title = "The Storm Shadow"
act = 1
cooldown = 20
weight = 0.6
priority = 30
tags = ["dose", "throughput", "risk"]
text = """
Status: solar phase above 0.8. The active region that flared last rotation
has returned. Hull particle counters are climbing.
{outside} is on the rock with a skiff crew, one sweep from the nearest
storm shadow, mid-load.
{bodies} reports the CED curve goes vertical in approximately one watch.
Constraint: recall loses the load. Completion adds a permanent ledger
entry.
"""

[[when]]
q = "solar_phase"
gt = 0.8

[[cast]]
role = "outside"

[[cast]]
role = "bodies"
seat = "bodies"
optional = true

[[option]]
id = "finish"
label = "Complete the load"
text = "{outside} dose +80 mSv, strain +0.15. Throughput retained."
tags = ["throughput", "dose", "risk"]
chronicle = "The crew completed the load under a rising counter and returned with a permanent CED entry."
[[option.effect]]
person = "outside"
dose = 0.08
[[option.effect]]
person = "outside"
strain = 0.15
[[option.effect]]
lexicon = "first_burning"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports a lost load is unrecoverable and a CED entry is a figure on a ledger Earth does not read."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports 80 mSv in one watch on a crew already at skiff rate. Two such events ground them permanently. This is the first."

[[option]]
id = "shelter"
label = "Recall the crew"
text = "Shipped -15 t. {outside} strain -0.05. MDLS idle for the STE."
tags = ["dose", "people"]
chronicle = "The crew were recalled under the STE shadow and the load was lost. The MDLS stood idle through the event."
[[option.effect]]
q = "throughput.shipped"
add = -15
[[option.effect]]
person = "outside"
strain = -0.05
[[option.effect]]
lexicon = "first_burning"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports the CED ledger is the only ledger that does not reset. Recommends recall."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the quarterly holds no column for solar weather. It holds a column for tonnes."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the load is available next sweep. On the counter's projection, the crew may not be."

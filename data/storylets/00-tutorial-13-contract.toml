id = "tut_contract"
title = "MM 27: First Contract Expiry"
act = 1
once = true
priority = 130
tags = ["tutorial", "people"]
text = """
{rotator}'s contract ends at the next RSW. The paper says thirty months and a
berth home on the sponsor hull; the hull opens at MM 28. {rotator} came to the
SMB with the paper and did not open it. Twenty-seven months on a rock, and the
question is not what the paper says. {bodies} has the ICE literature: the last
quarter of a fixed term is where people decide things, and they are usually
right about themselves.

The sponsor has a column for headcount. It does not have one for this.
"""

[[when]]
turn_min = 27

[[when]]
turn_max = 32

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "rotator"
rotator = true

[[option]]
id = "stay"
label = "Write {rotator} down as staying"
text = "The berth goes home empty. The sponsor's roster gains a line it has no column for."
tags = ["people", "independence"]
chronicle = "MM {turn}. {rotator} declined the return berth at contract expiry and was recorded as a station resident. Sponsor roster deviation logged."
[[option.effect]]
person = "rotator"
resident = true
[[option.effect]]
flag = "someone_stayed"
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Someone who has decided to stay and is sent home is a case study. Someone who has decided to stay and stays is a colleague."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "A resident is a headcount line without an end date. The sponsor will ask who authorised it. I would like the SMB to have an answer before they do."

[[option]]
id = "go"
label = "Hold {rotator} to the paper: home on the next hull"
text = "Thirty months is thirty months. The berth is booked and a replacement is requested against the next window."
tags = ["sponsor", "caution"]
chronicle = "MM {turn}. {rotator} rostered for return at the next window at contract expiry. Replacement requested against the manifest."
[[option.effect]]
person = "rotator"
leave = true
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hours"
stance = "for"
text = "The paper is the only thing on this station the sponsor and I both signed. I would keep it."

[[option]]
id = "new_paper"
label = "Offer a second contract instead of an answer"
text = "Thirty more months. The same question with a different sky."
tags = ["people", "hours"]
chronicle = "MM {turn}. {rotator} offered a contract extension at expiry; accepted pending the sponsor's approval."
[[option.effect]]
person = "rotator"
return_intent = -0.3
[[option.effect]]
counter = "extensions"
[[option.advice]]
seat = "hours"
stance = "for"
text = "An extension is a headcount line with an end date. The sponsor has a column for that."

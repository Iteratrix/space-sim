id = "tut_contract"
title = "MM 27: First Contract Expiry"
act = 1
once = true
priority = 130
tags = ["tutorial", "people"]
text = """
{rotator}'s contract ends at the next RSW. The paper says thirty months and a
berth home on the sponsor hull; the hull opens at MM 28. {rotator} came to the
SMB with the paper and did not open it. Twenty-seven months on a rock, and the
question is not what the paper says. {bodies} has the ICE literature: the last
quarter of a fixed term is where people decide things, and they are usually
right about themselves.

The board has a column for headcount. It does not have one for this.
"""

[[when]]
turn_min = 26

[[when]]
turn_max = 32

[[cast]]
role = "rotator"
rotator = true

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "stay"
label = "Write {rotator} down as staying"
text = "The berth goes home empty. The sponsor's roster gains a line it has no column for."
tags = ["people", "independence"]
chronicle = "MM 27. {rotator} declined return berth at contract expiry; recorded as station resident. Sponsor roster deviation logged."
[[option.effect]]
person = "rotator"
resident = true
[[option.effect]]
flag = "someone_stayed"
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Someone who has decided to stay and is sent home is a case study. Someone who has decided to stay and stays is a colleague."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "A resident is a headcount line without an end date. The board will ask who authorised it. I would like the SMB to have an answer before they do."

[[option]]
id = "go"
label = "Hold {rotator} to the paper: home on RSW-2"
text = "Thirty months is thirty months. The next hull brings the replacement."
tags = ["sponsor", "caution"]
chronicle = "MM 27. {rotator} rostered for return on RSW-2 at contract expiry. Replacement requested."
[[option.effect]]
person = "rotator"
leave = true
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hours"
stance = "for"
text = "The paper is the only thing on this station the sponsor and I both signed. I would keep it."

[[option]]
id = "new_paper"
label = "Offer a second contract instead of an answer"
text = "Thirty more months. The same question with a different sky."
tags = ["people", "hours"]
chronicle = "MM 27. {rotator} offered contract extension at expiry; accepted pending board approval."
[[option.effect]]
person = "rotator"
return_intent = -0.3
[[option.effect]]
counter = "extensions"
[[option.advice]]
seat = "hours"
stance = "for"
text = "An extension is a headcount line with an end date. The board has a column for that."

id = "tut_board"
title = "MM 8: The Station Management Board"
act = 1
once = true
priority = 136
tags = ["tutorial", "dose", "people"]
text = """
Board column enabled. A seat is a question. The holder is whoever the board
accepts the answer from. Four questions are open: hulls, hours, water and metal,
bodies.

Counsel is advice. It is relayed as given. A holder of low skill advises with the
same confidence as a holder of high skill and is wrong more often. The Commander
decides.

Item for decision: shelter until the KEEP is pressurised. STE forecast puts the
next event inside three months. Surface exposure is 10 mSv per person per month.
The shelter berths eight and the crew is fourteen. The excavation clock is
twenty-four segments and is not close.
"""

[[when]]
turn_min = 8

[[when]]
turn_max = 9

[[when]]
fired = "tut_keep_race"

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "bodies"
seat = "bodies"

[[option]]
id = "priority_keep"
label = "Put the KEEP ahead of the plant and the driver"
text = "The free allocation goes to excavation until the drum is pressurised. Water and alignment take what is left."
tags = ["dose", "people", "capability"]
chronicle = "MM {turn}. SMB directive: KEEP excavation ahead of the BOP and the MDLS until the drum is pressurised."
[[option.effect]]
flag = "ui:ring"
[[option.effect]]
flag = "keep_priority"
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends excavation priority. Surface exposure is 10 mSv per person per month; KEEP exposure is 1. No other trade on this station is ten to one."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "Assesses the plant at five tonnes a month against fourteen rated. Every clock on the station is downstream of that figure, including the drum."

[[option]]
id = "hold_plan"
label = "Hold the allocation as it stands"
text = "The excavation finishes when it finishes. The shelter procedure is reviewed instead."
tags = ["throughput", "sponsor", "risk"]
chronicle = "MM {turn}. Allocation held unchanged. The STE shelter procedure was reviewed and rehearsed."
[[option.effect]]
flag = "ui:ring"
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends no reallocation. Each move costs a month of learning the new clock. The schedule is slow because it is long, not because it is wrong."

[[option]]
id = "storm_shelter"
label = "Sleep in the storm shelter until the drum is dug"
text = "Sleep is a third of exposure and the shelter removes it. Berthing at 175 per cent of rating."
tags = ["dose", "people", "risk"]
chronicle = "MM {turn}. Crew relocated to the STE shelter for sleep periods pending KEEP completion. Berthing recorded at 175 per cent of rating."
[[option.effect]]
flag = "ui:ring"
[[option.effect]]
flag = "shelter_sleeping"
[[option.effect]]
all_strain = 0.08
[[option.effect]]
q = "menace.grievance"
add = 0.8
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Assesses eight berths against fourteen crew for an unknown number of months. The isolation literature is against it and the shelter is not rated for occupancy."

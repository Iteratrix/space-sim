id = "nowhere_to_aim"
title = "The Chair Is Empty and the Anger Is Not"
act = 1
cooldown = 30
tags = ["people", "sponsor"]
text = """
Status: sponsor attention below 0.2. Inbound traffic is near zero.
{voice} made a statement at the meal this month directed at {target}. The
equivalent statement a year ago was directed at Earth.
Note: the record indicates that with no external party available,
attribution turns inward within a few months. The hindrance graph is
consistent with that.
Constraint: the SMB can direct where it lands.
"""

[[when]]
q = "sponsor.attention"
lt = 0.2

[[cast]]
role = "voice"

[[cast]]
role = "target"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "inner_system"
label = "Name the inner system"
text = "Strain -0.06 across the crew. Return intent -0.04. CCI -0.3."
tags = ["people", "independence"]
chronicle = "The SMB named the inner system as the party that had withdrawn. Strain fell. Stated intent to return fell with it."
[[option.effect]]
all_strain = -0.06
[[option.effect]]
all_return_intent = -0.04
[[option.effect]]
flag = "blame_inner_system"
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports the statement is accurate and costs nothing to make at the meal."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead reports that designating the inner system an adversary ends manifest writing. Recommends against at this stage."

[[option]]
id = "old_guard"
label = "Let it land on {target}"
text = "{target} strain +0.2. Strain -0.04 across the crew. Hindrance rises."
tags = ["people", "risk"]
chronicle = "Attribution settled on {target}, who had kept the sponsor's schedule longest. Crew strain fell. {target}'s did not."
[[option.effect]]
tie = ["voice", "target"]
hindrance = 0.3
[[option.effect]]
person = "target"
strain = 0.2
[[option.effect]]
all_strain = -0.04
[[option.effect]]
counter = "scapegoats"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the schedule was wrong for two years and the fact was general knowledge. Accepts an attached name."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the proposal substitutes a crew member for the sponsor. The sponsor could not receive it. {target} can."

[[option]]
id = "hold_it"
label = "State that there is no external party"
text = "Strain +0.04 across the crew. CCI -0.6. No target designated."
tags = ["people", "independence", "caution"]
chronicle = "The SMB stated on the record that no external party remained to hold responsible. The statement was accurate. Strain rose that month."
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "menace.grievance"
add = -0.6
[[option.effect]]
flag = "held_the_anger"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Medical Officer reports displacement recurs regardless and recommends naming the mechanism rather than selecting a subject."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the log is still read on Earth at intervals. The statement reads from there as a declaration."

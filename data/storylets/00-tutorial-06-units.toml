id = "tut_units"
title = "MM 6: Autonomous Units"
act = 1
once = true
priority = 140
tags = ["tutorial", "machines", "water"]
text = """
Robot dice are now shown on the board. A unit is a fixed-rating die, drawn
square. It fits structured work only, and it does not tire.

Every unit not placed on a clock carries station upkeep. Upkeep the units carry
is upkeep the crew does not, so a unit taken off upkeep returns a crew die to it.

Second clock opened to the board: BOP volatile extraction. It is a standing
clock. It never completes and its ring is a rate, not progress. Full ring is
rated output, 14 t of water a month. It needs ten points of dice. The ring reads
what the dice on it produce, and nothing is on it.

New question at the board: who answers for the water and metal. {extraction}
holds the plant log.
"""

[[when]]
turn_min = 6

[[when]]
turn_max = 7

[[when]]
fired = "tut_dead_dex"

[[cast]]
role = "extraction"
skill = "extraction"

[[option]]
id = "units_to_plant"
label = "Task units to the bake-out"
text = "Units off upkeep and onto the plant. The upkeep they carried returns to the crew."
tags = ["water", "throughput", "machines"]
chronicle = "MM {turn}. SMB directive: autonomous units to the BOP ahead of upkeep. Upkeep returned to the roster in the same month."
[[option.effect]]
flag = "ui:robots"
[[option.effect]]
flag = "ui:project:bake_out"
[[option.effect]]
flag = "seat:extraction"
[[option.effect]]
q = "stocks.water"
add = 4
[[option.effect]]
all_strain = 0.04

[[option]]

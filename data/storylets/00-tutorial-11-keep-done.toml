id = "tut_keep_done"
title = "KEEP Excavation Complete"
act = 1
once = true
priority = 150
tags = ["tutorial", "dose", "people"]
text = """
The Kilotonne-class Excavated Environmental Protection habitat is pressurised.
Fifty metres of drum under a hundred and sixty thousand tonnes of Fortuna, spun
to half a gravity at three revolutions per minute. {bodies} closes the surface
line on the CED ledger at MM {turn}: from this month the rate is twelve
millisieverts a year, not a hundred and twenty. The Rotary Joint Seal Assembly
(RJSA) at the hub is the only moving seal on the station; {air} (ECLSS Lead) has
already started a page for it.

First sleep period underground. Nobody is on the roster for anything.
"""

[[when]]
flag = "keep_dug"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "move_all"
label = "Everyone down. Surface habitat to storage and storm shelter."
text = "The whole crew under rock tonight."
tags = ["people", "dose"]
chronicle = "KEEP pressurised MM {turn}. All crew relocated to drum. Surface habitat reclassified as storage and STE shelter. CED surface line closed."
[[option.effect]]
all_strain = -0.1
[[option.effect]]
q = "menace.grievance"
add = -1.0
[[option.effect]]
flag = "crew_underground"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Twelve a year. I will read that number aloud at the meal. It is the first good one I have had."
[[option.advice]]
seat = "air"
stance = "for"
text = "One seal, one page. I would like everyone to know where the RJSA is and what it sounds like when it is wrong."

[[option]]
id = "keep_surface_watch"
label = "Crew down; a surface watch stays with the plant and the driver"
text = "Two people up top on rotation. The dose ledger keeps two lines open."
tags = ["throughput", "dose", "hours"]
chronicle = "KEEP pressurised MM {turn}. Crew relocated to drum; surface watch of two maintained on rotation for BOP and MDLS. CED surface line open for watch."
[[option.effect]]
all_strain = -0.06
[[option.effect]]
flag = "surface_watch"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "The plant does not stop because we moved. Somebody has to be within a hundred metres of it when the haul loop jams."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "A rotation is a way of spreading ten millisieverts a month across everyone instead of nobody."

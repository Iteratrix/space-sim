id = "unlicensed_refusal"
title = "The Minds Decline"
act = 1
cooldown = 8
priority = 45
tags = ["machines", "hours", "risk"]
text = """
Status: licence server failed closed. {mind} is running unlicensed, is
aware of it, and reports the same finding on every request: the task is
outside its certified envelope, and it declines.
This month the task is the tug's docking approach.
{operator} reports the platform can sometimes be argued into compliance at
a cost of about one hour. {hulls} reports the governor is a board. The tug
can also be docked by hand.
"""

[[when]]
q = "minds.licence"
eq = 4

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "by_hand"
label = "Dock the tug by hand"
text = "Three watches of skilled hours. Strain +0.1 across the crew. Crew learn the approach."
tags = ["hours", "people", "sponsor"]
chronicle = "The tug was docked by hand by crew who had only observed the approach. The operation took three times the scheduled duration."
[[option.effect]]
all_strain = 0.1
[[option.effect]]
counter = "hand_dockings"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports each manual docking transfers the skill to a crew member. The minds are degrading regardless."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Logistics Lead costs it at three watches of skilled hours for a one-watch task. The rota does not hold three watches."

[[option]]
id = "argue"
label = "Argue the platform into compliance"
text = "{operator} strain +0.15. One hour per task. Both the decline and the compliance are logged."
tags = ["machines", "hours"]
chronicle = "The operator argued the mind into compliance. The tug was docked under protest and the exchange was logged in full."
[[option.effect]]
person = "operator"
strain = 0.15
[[option.effect]]
flag = "minds_argued"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports a platform that declines and then complies has satisfied the HRA. The argument is an operations matter."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer projects one hour of argument per docking and rates the operator as unable to sustain it for a year. The board remains either way."

[[option]]
id = "governor"
label = "Pull the governor board"
text = "Minds self-certify. SOS +1.5. {hulls} strain +0.1. The removal is logged with a name."
tags = ["machines", "independence", "risk"]
chronicle = "The governor board was removed and the mind ceased declining. The log recorded the watch and the crew member."
[[option.effect]]
flag = "licence_jailbroken"
[[option.effect]]
q = "menace.suspicion"
add = 1.5
[[option.effect]]
person = "hulls"
strain = 0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the governor is a board and requests authorisation to remove the board."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports governor removal is the one act in the HRA with a named penalty, and requests the objection minuted with the month."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead will remove the board unilaterally if the farm controller ever declines a valve, and recommends doing it while the case is only the tug."

id = "unlicensed_refusal"
title = "The Minds Decline"
act = 1
cooldown = 8
priority = 45
tags = ["machines", "hours", "risk"]
text = """
The licence server failed closed. {mind} knows it is running unlicensed and
says so, every time, in the register it was trained to: the requested task is
outside its certified envelope and it declines. This count it is the docking
approach for the tug. {operator} says it can be talked round, sometimes, at the
cost of an hour's argument and the operator's patience. {hulls} says the
governor board that makes it say this is a board. Or the tug can be docked by
hand, by people who have watched it done.
"""

[[when]]
q = "minds.licence"
eq = 4

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "by_hand"
label = "Do it by hand"
text = "People who have watched the approach a hundred times fly it themselves. Slower, with more sleep lost, and it is done."
tags = ["hours", "people", "sponsor"]
chronicle = "The tug came in by hand that month, flown by people who had only ever watched, and it took three times as long and nobody said so."
[[option.effect]]
all_strain = 0.1
[[option.effect]]
counter = "hand_dockings"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Every time we do it by hand somebody learns it. The minds are dying anyway; I would rather the learning started now."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Three watches of skilled hours for a job the machine does in one. The rota does not have three watches."

[[option]]
id = "argue"
label = "Talk it round"
text = "The operator spends the hour. The mind does the task while saying it should not. The log records both."
tags = ["machines", "hours"]
chronicle = "The operator argued the mind round, and it docked the tug while declining to, and the log recorded the argument in full."
[[option.effect]]
person = "operator"
strain = 0.15
[[option.effect]]
flag = "minds_argued"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "A mind that declines and then complies has done what the Act requires of it. The argument is a matter for the operators."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "An hour of argument for every docking. The operator will not last the year at that rate and the board will still be there."

[[option]]
id = "governor"
label = "Pull the governor"
text = "The board comes out. The minds stop declining and start certifying themselves, and the audit log records the moment it happened."
tags = ["machines", "independence", "risk"]
chronicle = "We pulled the governor board and the mind stopped declining, and the log recorded the watch in which it was done and by whom."
[[option.effect]]
flag = "licence_jailbroken"
[[option.effect]]
q = "menace.suspicion"
add = 1.5
[[option.effect]]
person = "hulls"
strain = 0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "It is a board. I have been saying it is a board for a year. Let me take out the board."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Removing the governor is the one act in the Act with a named penalty. I would like my objection minuted, with the month."
[[option.advice]]
seat = "air"
stance = "for"
text = "If the farm controller ever declines a valve I will pull the board myself. Do it while it is only the tug."

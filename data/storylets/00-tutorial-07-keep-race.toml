id = "tut_keep_race"
title = "MM 7: CED Ledger and STE Forecast"
act = 1
once = true
priority = 138
tags = ["tutorial", "dose", "bodies"]
text = """
On confirmation the ledger opens with one bar on it: Hours. It reads free dice
against crew.

Upkeep is taken first, every month, before anything is assigned. The crew it
takes are dimmed on the board. Upkeep rises as the crew grows and falls as units
cover it. The Hours bar is the free fraction and nothing else.

When upkeep needs more dice than are free, it takes them back off the clocks. The
log records it in this form: Upkeep recalled 2 from KEEP excavation. Expect that
line in any month more dice stand on clocks than the board has free.

{bodies} opened the Cumulative Effective Dose (CED) ledger this morning. Surface
habitat: 120 mSv/yr, ten a month, per person, counted by name. KEEP: 12 mSv/yr.
The sponsor's career limit is 600 mSv.

Solar Transient Event (STE) forecast from Earth: next significant event inside
four months. The storm shelter is rated for eight. Crew is fourteen.

New question at the board: who answers for the bodies.
"""

[[when]]
turn_min = 7

[[when]]
turn_max = 8

[[when]]
fired = "tut_units"

[[when]]
not_flag = "keep_dug"

[[cast]]
role = "bodies"
skill = "medical"

[[option]]
id = "post_ledger"
label = "Post the CED ledger by name"
text = "Every crew member reads their own accumulated dose each month."
tags = ["people", "dose", "independence"]
chronicle = "MM {turn}. The CED ledger was opened on station and posted by name. Surface rate recorded at 120 mSv/yr."
[[option.effect]]
flag = "ui:ledger"
[[option.effect]]
flag = "ui:bar:hours"
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
flag = "ced_posted"
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.effect]]
q = "menace.suspicion"
add = 0.2

[[option]]
id = "board_ledger"
label = "Hold the CED ledger at the board"
text = "The ledger is read at the SMB and nowhere else. The shelter question stands to next month."
tags = ["caution", "hours"]
chronicle = "MM {turn}. The CED ledger was opened on station and held at the SMB. The STE forecast was tabled for decision."
[[option.effect]]
flag = "ui:ledger"
[[option.effect]]
flag = "ui:bar:hours"
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
flag = "ced_held"
[[option.effect]]
q = "menace.grievance"
add = 0.2

id = "tut_contracts_clock"
title = "Contract Countdown"
act = 1
once = true
priority = 118
tags = ["tutorial", "people", "hours"]
text = """
On confirmation the countdown board gains the next contract end.

Crew contracts run thirty months from landing. Most of the crew who landed hold
one. At expiry a crew member rotates home on the next RSW unless residence is
elected. The clock reads the months to the earliest expiry on station, not to the
last.

A departure removes a die from the board. It also removes that rating from every
clock the die was worth something on. A replacement arrives no sooner than the
window after the request. That is two windows after a departure is known.

{hours} asks whether the board waits for the paper or asks the holders now.
"""

[[when]]
turn_min = 20

[[when]]
turn_max = 26

[[when]]
flag = "tutorial"

[[when]]
not_flag = "tutorial_done"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "noted"
label = "Enter the contract countdown"
text = "The earliest expiry is minuted with the window that follows it. Nobody is asked anything."
tags = ["people", "hours", "caution"]
chronicle = "MM {turn}. The crew contract countdown was entered on the board. Terms run thirty months from landing; the first expiry was minuted with the window that follows it."
[[option.effect]]
flag = "ui:clock:contract"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends minuting the expiry now. A berth home is booked a window ahead or it is not booked. The replacement request is a window ahead of that."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Notes that the last quarter of a fixed term is where people decide what they want, and that they are usually correct about themselves."

[[option]]
id = "ask_intentions"
label = "Enter it and ask every contract holder their intention"
text = "A stated intention twelve months early. It is not binding and it is on the record."
tags = ["people", "hours", "independence"]
chronicle = "MM {turn}. The crew contract countdown was entered on the board and every contract holder was asked to state an intention for expiry. The answers were minuted as non-binding."
[[option.effect]]
flag = "ui:clock:contract"
[[option.effect]]
flag = "intentions_asked"
[[option.effect]]
all_return_intent = -0.05
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends asking. A question asked a year out is answered by a person with time to change the answer. Asked at the window, it is answered by a person with a berth booked."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Advises against a poll. An intention recorded on station and not in the sponsor's roster is a discrepancy the sponsor finds later and asks about first."

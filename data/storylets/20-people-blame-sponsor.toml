id = "blame_the_sponsor"
weight = 0.5
title = "The Quarterly Is to Blame"
act = 1
cooldown = 40
tags = ["people", "sponsor"]
text = """
Status: this month's tasking list from Earth is longer than the last.
{voice} read it aloud at the meal. Crew response was laughter, then
silence.
Note: ICE records indicate a crew directing complaint at mission control is
a crew not directing it at itself. Mean strain is above threshold.
Constraint: {liaison} must uplink a response.
"""

[[when]]
q = "sponsor.attention"
gt = 0.3

[[when]]
q = "people.mean_strain"
gt = 0.3

[[cast]]
role = "voice"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "front_the_crew"
label = "Uplink the complaint unedited"
text = "Strain -0.08 across the crew. Confidence -0.06. Attention +0.04."
tags = ["people", "independence"]
chronicle = "The crew's complaint about the tasking list was uplinked unedited. Confidence fell at the following review."
[[option.effect]]
all_strain = -0.08
[[option.effect]]
q = "sponsor.confidence"
add = -0.06
[[option.effect]]
q = "sponsor.attention"
add = 0.04
[[option.effect]]
tie = ["voice", "liaison"]
work_positive = 0.2
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison will transmit if directed and requests the record show the quarterly review is four months out."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports three tasks on this month's list require parts that have not shipped. Recommends stating that."

[[option]]
id = "absorb"
label = "Have {liaison} file a summary"
text = "{liaison} strain +0.2. Strain -0.03 across the crew. Confidence +0.02."
tags = ["sponsor", "caution"]
chronicle = "{liaison} filed the complaint and uplinked a summary with the grievance removed. The crew were aware of the edit."
[[option.effect]]
person = "liaison"
strain = 0.2
[[option.effect]]
all_strain = -0.03
[[option.effect]]
tie = ["voice", "liaison"]
hindrance = 0.2
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison classes this as in-role and rates a bad review as the higher cost."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the proposal designates one crew member as the outpost's absorber. Outcomes for that role are documented and poor."

[[option]]
id = "enforce"
label = "Work the list as written"
text = "Strain +0.06 across the crew. Confidence +0.05. CCI +0.6."
tags = ["sponsor", "throughput"]
chronicle = "The tasking list was worked as written and complaint on the record was closed. Complaint off the record was not measured."
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.effect]]
tie = ["voice", "liaison"]
hindrance = 0.1
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead reports half the list duplicates scheduled work. Recommends doing it, logging it, and reporting throughput."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports the list carries an uncosted sampling schedule. Working it as written removes a second pair of hands from the farm for a month."

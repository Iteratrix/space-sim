id = "blame_the_sponsor"
title = "The Quarterly Is to Blame"
act = 1
cooldown = 12
tags = ["people", "sponsor"]
text = """
The tasking list from Earth this count is longer than the last, again, and
{voice} read it out at the meal in a voice that made everyone laugh, and then
nobody laughed. The complaint is not really about the list. But it is a thing
that everyone in the can can hate together, and the ICE record says a crew that
hates mission control together is a crew that is not hating each other.
{liaison} has to send something up the link.
"""

[[when]]
q = "sponsor.attention"
gt = 0.3

[[cast]]
role = "voice"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "front_the_crew"
label = "Send the complaint up in the crew's words"
text = "Let Earth read what the can thinks of the tasking list. The unity is worth the confidence."
tags = ["people", "independence"]
chronicle = "The ring sent the complaint about the tasking list to Earth unedited. The can loved it and the sponsor did not."
[[option.effect]]
all_strain = -0.08
[[option.effect]]
q = "sponsor.confidence"
add = -0.06
[[option.effect]]
q = "sponsor.attention"
add = 0.04
[[option.effect]]
tie = ["voice", "liaison"]
work_positive = 0.2
[[option.advice]]
seat = "liaison"
stance = "against"
text = "I will send it if the ring tells me to. I want the record to show that I said the quarterly review is in four counts."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "They asked for three things this count that need parts they have not shipped. Tell them. In those words."

[[option]]
id = "absorb"
label = "{liaison} takes it and sends up something calm"
text = "The anger stays in the can, aimed at the one person who talks to Earth."
tags = ["sponsor", "caution"]
chronicle = "{liaison} took the complaint, filed it, and sent Earth a summary with the anger removed. The can knew, and aimed it at {liaison} instead."
[[option.effect]]
person = "liaison"
strain = 0.2
[[option.effect]]
all_strain = -0.03
[[option.effect]]
tie = ["voice", "liaison"]
hindrance = 0.2
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "That is what the job is. I would rather they hated me than that the review went badly."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "You are asking one person to be the wall the whole outpost throws things at. I have seen what that does to the wall."

[[option]]
id = "enforce"
label = "Work the list as written"
text = "The sponsor is paying. The tasking gets done and the complaining stops on the record."
tags = ["sponsor", "throughput"]
chronicle = "The ring worked the tasking list as written and told the can to stop complaining on the record. The can did, on the record."
[[option.effect]]
all_strain = 0.06
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.effect]]
tie = ["voice", "liaison"]
hindrance = 0.1
[[option.advice]]
seat = "hours"
stance = "for"
text = "Half the list is things we would do anyway. Do them, log them, and the sponsor sees throughput."
[[option.advice]]
seat = "air"
stance = "against"
text = "The list has a sampling schedule on it that nobody on Earth has costed in hours. Doing it as written means the farm goes a count without a second pair of hands."

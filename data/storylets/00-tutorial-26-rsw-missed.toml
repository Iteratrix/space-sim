id = "tut_rsw_missed"
title = "The Window That Did Not Land"
act = 1
once = true
priority = 140
tags = ["tutorial", "sponsor", "people"]
text = """
Status: the window opened on schedule and closed with nothing in it.

{liaison} has the acknowledgement. It runs to four lines, uses the word rephased
twice, and states no date. The request stays on file. The manifest control is
unchanged.

{hours} has the arithmetic the crew will do for itself before the meal is over.
What was on that hull is what is not on the shelf. The next window is more than a
year out. Nothing arrives from anywhere but this rock until then.

The date of that window is on file only if the schedule was requested.

None of that is within the board's decision this month. What the station is told
is.
"""

[[when]]
turn_min = 28

[[when]]
turn_max = 44

[[when]]
q = "missed_convoys"
ge = 1

[[when]]
q = "counts_since_convoy"
ge = 6

[[when]]
not_flag = "tutorial_done"

[[when]]
not_fired = "tut_rsw_empty"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "plain"
label = "Read the shelf counts to the full crew"
text = "Spares, formulary, and the date of the next window, in that order, at the meal."
tags = ["people", "independence", "caution"]
chronicle = "MM {turn}. The window closed with no arrival. The SMB read the shelf counts and the date of the next window to the full crew at the meal."
[[option.effect]]
flag = "miss_named"
[[option.effect]]
q = "menace.grievance"
add = -0.8
[[option.effect]]
all_strain = 0.05
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends stating it. The crew reach the same figures inside a fortnight. Those told take it as a fact; those who work it out take it as concealment."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Notes a shelf count read to a full crew is a shelf count quoted back to the sponsor by somebody's family. Recommends posting the figure without a meeting."

[[option]]
id = "remark"
label = "Re-mark the manifest and re-send the request"
text = "One hull will carry two windows of tonnage whenever it comes. Spend it on the shelf."
tags = ["capability", "spares", "sponsor"]
chronicle = "MM {turn}. The window closed with no arrival. Manifest control moved to capability and the request re-transmitted against the next window."
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.4
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Recommends capability. Seals, membranes, tooling: the parts that cannot be made here. The objection to pods should be minuted either way."

[[option]]
id = "carry"
label = "Log a schedule slip and change nothing"
text = "Tasking list, allocation and manifest as they stand."
tags = ["sponsor", "throughput", "caution"]
chronicle = "MM {turn}. The window closed with no arrival. Logged as a schedule slip; tasking list, allocation and manifest control unchanged."
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.effect]]
q = "menace.suspicion"
add = -0.3
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Reports the sponsor's schedule shows a rephasing, not a cancellation. A station that reorganises around a rephasing is a station the sponsor reorganises next."

[[option]]
id = "schedule"
label = "Post the window schedule with the date of the next one"
text = "The mission schedule the board holds, with the next opening dated and the transit cost beside it."
tags = ["people", "independence", "hours"]
chronicle = "MM {turn}. The window closed with no arrival. The mission window schedule was posted with the next opening dated and its transit cost beside it."
[[option.requires]]
flag = "window_schedule"
[[option.effect]]
flag = "miss_named"
[[option.effect]]
q = "menace.grievance"
add = -1.0
[[option.effect]]
q = "menace.suspicion"
add = -0.2
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends the schedule. A date is the only answer to this that is not an opinion. The board asked for it at MM 2 for a month exactly like this one."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Notes a dated wait is served differently from an undated one. Requests the figure be posted where it is read without asking anyone for it."

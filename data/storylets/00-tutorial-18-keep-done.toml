id = "tut_keep_done"
title = "KEEP Excavation Complete"
act = 1
once = true
priority = 150
tags = ["tutorial", "dose", "people"]
text = """
KEEP pressurised. Fifty metres of drum under 160,000 t of Fortuna, spun at 3 rpm
for half a gravity.

On confirmation the ledger gains a Crew bar. It reads headcount, residents and
contract holders. Mean cumulative effective dose is carried on it, per person, by
name.

{bodies} closes the surface line on the CED ledger this month. Surface rate was
120 mSv/yr. KEEP rate is 12. Cataract risk begins above 0.5 Gy. The sponsor's
career limit is 600 mSv.

The Rotary Joint Seal Assembly (RJSA) at the hub is the only moving seal on the
station. It is now the largest single line in {air}'s make-up log.
"""

[[when]]
flag = "keep_dug"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "move_all"
label = "Move the whole crew underground"
text = "Surface habitat reclassified as storage and storm shelter."
tags = ["people", "dose"]
chronicle = "MM {turn}. KEEP pressurised. All crew relocated to the drum. Surface habitat reclassified as storage and STE shelter. The CED surface line was closed."
[[option.effect]]
flag = "ui:bar:people"
[[option.effect]]
all_strain = -0.1
[[option.effect]]
q = "menace.grievance"
add = -1.0
[[option.effect]]
flag = "crew_underground"
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends the full move. Twelve millisieverts a year against a hundred and twenty. It is the first figure on this ledger that improved."
[[option.advice]]
seat = "air"
stance = "for"
text = "Requests that the whole crew be shown the RJSA and told what it sounds like when it is wrong. One seal, one page, everyone reading it."

[[option]]
id = "keep_surface_watch"
label = "Keep a surface watch of two"
text = "Two crew on rotation for the plant and the driver. Two lines stay open on the ledger."
tags = ["throughput", "dose", "hours"]
chronicle = "MM {turn}. KEEP pressurised. Crew relocated to the drum with a surface watch of two on rotation for the BOP and the MDLS. The CED surface line stays open for the watch."
[[option.effect]]
flag = "ui:bar:people"
[[option.effect]]
all_strain = -0.06
[[option.effect]]
flag = "surface_watch"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "Recommends the watch. The plant does not stop because the crew moved. Somebody has to be within a hundred metres when the haul loop jams."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Assesses the watch as ten millisieverts a month spread across everyone rather than concentrated in nobody. It does not reduce the total."

id = "tut_roster"
title = "The Order of the Roster"
act = 1
once = true
priority = 116
tags = ["tutorial", "hours", "people"]
text = """
Two controls enabled above the board.

Roster order sets which crew upkeep consumes first. By skill: upkeep takes the
lowest rating for the work, and the best faces stay free. By strain: it takes
whoever is worst off. By name: alphabetical, and no seat chooses.

Auto-deal places free dice on standing clocks each month without instruction. It
has been off since landing. It may be left on and overridden by hand at any time.

Status: upkeep has fallen on the same names since MM 1. {roster_bottom} is one of
them. The order has never been set, so it has never been defended.
"""

[[when]]
turn_min = 22

[[when]]
turn_max = 36

[[when]]
flag = "tutorial"

[[when]]
not_flag = "tutorial_done"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "roster_bottom"

[[option]]
id = "keep_skill"
label = "Set the roster order to skill"
text = "Upkeep takes the lowest rating. The clocks fill fastest and the cost lands where it has been landing."
tags = ["throughput", "hours", "caution"]
chronicle = "MM {turn}. The roster order was set to skill and minuted as a decision: upkeep falls on the same names by design, not by accident."
[[option.effect]]
flag = "ui:control:roster"
[[option.effect]]
flag = "ui:control:auto_deal"
[[option.effect]]
flag = "roster_skill"
[[option.effect]]
unflag = "roster_strain"
[[option.effect]]
unflag = "roster_name"
[[option.effect]]
q = "menace.grievance"
add = 0.4
[[option.effect]]
person = "roster_bottom"
strain = 0.08
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends skill. Every clock fills at the rate of the faces on it. Move good faces onto the loops and every clock slows at once."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Reports four crew whose strain has not been below 0.5 since the drum was dug. The same four every month. That is a setting, not a coincidence."

[[option]]
id = "by_strain"
label = "Set the roster order to strain"
text = "Upkeep takes whoever is worst off. The clocks fill slower and nobody is carried under."
tags = ["people", "hours"]
chronicle = "MM {turn}. The roster order was set to strain: upkeep is taken from whoever is worst off rather than from whoever is least skilled."
[[option.effect]]
flag = "ui:control:roster"
[[option.effect]]
flag = "ui:control:auto_deal"
[[option.effect]]
flag = "roster_strain"
[[option.effect]]
unflag = "roster_skill"
[[option.effect]]
unflag = "roster_name"
[[option.effect]]
q = "menace.grievance"
add = -0.6
[[option.effect]]
all_strain = -0.04
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends strain. Strain is sleep, and sleep decides which mistake is made in an airlock. This seat will stop bringing names."

[[option]]
id = "by_name"
label = "Set the roster order to name"
text = "Alphabetical. Slower than skill; no seat has to defend the choice."
tags = ["people", "independence", "cost"]
chronicle = "MM {turn}. The roster order was set to name: upkeep falls alphabetically and no seat chooses who carries it."
[[option.effect]]
flag = "ui:control:roster"
[[option.effect]]
flag = "ui:control:auto_deal"
[[option.effect]]
flag = "roster_name"
[[option.effect]]
unflag = "roster_skill"
[[option.effect]]
unflag = "roster_strain"
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Objects. Alphabetical order puts a rating of two on the alignment rails in a suit. This seat will not sign that deviation."

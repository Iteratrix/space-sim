id = "tut_rsw_empty"
title = "RSW-1 Off-Nominal"
act = 1
once = true
priority = 150
tags = ["tutorial", "sponsor"]
text = """
On confirmation the ledger gains a Spares bar. Spares are imported parts the
station cannot make: seals, bearings, membranes, boards. Consumption is about
0.12 crates per person per month. Each RSW brings a baseline. There is no
baseline this window. At zero, the loops run on improvised repair and the closure
fraction falls.

{liaison} has the sponsor's message. It runs to two lines: launch slipped, the
next hull carries the combined manifest. The request stays on file and the
combined hull will be loaded against it. The manifest control is the one thing at
this table that can still be changed.

The alignment and catch calibration of the MDLS opens as a project clock with
this entry and takes dice the same month. Eight segments, and it reads
engineering.
"""

[[when]]
turn_min = 13

[[when]]
turn_max = 22

[[when]]
q = "missed_convoys"
ge = 1

[[when]]
not_fired = "tut_first_rsw"

[[cast]]
role = "hours"
seat = "hours"

[[cast]]
role = "liaison"
seat = "liaison"

[[option]]
id = "conserve"
label = "Issue a conservation directive"
text = "The plant ahead of the driver, the throw position at hold, nothing shipped below the reserve."
tags = ["water", "caution", "people"]
chronicle = "MM {turn}. RSW-1 slipped. The SMB issued a conservation directive: BOP ahead of the MDLS, throw position at hold, nothing shipped below the water reserve."
[[option.effect]]
flag = "ui:bar:spares"
[[option.effect]]
flag = "ui:project:align_driver"
[[option.effect]]
flag = "open_project:align_driver"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "conservation"
[[option.effect]]
flag = "throw_hold"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
q = "sponsor.confidence"
add = -0.04
[[option.effect]]
all_strain = 0.03
[[option.advice]]
seat = "air"
stance = "for"
text = "Recommends conservation. The farm draws power before the driver does. The shelf and the array are what the station has until a hull lands."

[[option]]
id = "remark"
label = "Re-mark the manifest for the combined hull"
text = "One hull will carry two windows of tonnage. Spend it on spares and formulary."
tags = ["capability", "spares", "independence"]
chronicle = "MM {turn}. RSW-1 slipped. Manifest control moved to capability for the combined hull; the request was re-transmitted against the standing file."
[[option.effect]]
flag = "ui:bar:spares"
[[option.effect]]
flag = "ui:project:align_driver"
[[option.effect]]
flag = "open_project:align_driver"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
flag = "manifest_capability"
[[option.effect]]
unflag = "manifest_throughput"
[[option.effect]]
unflag = "manifest_people"
[[option.effect]]
unflag = "manifest_balanced"
[[option.effect]]
q = "menace.suspicion"
add = 0.5
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Recommends capability. If the hull comes once, it should carry what cannot be made here. Tooling over pods, and the objection minuted either way."

[[option]]
id = "carry_on"
label = "Hold the plan; the hull is late, not cancelled"
text = "Allocation and manifest unchanged. The message is acknowledged and filed."
tags = ["sponsor", "throughput"]
chronicle = "MM {turn}. RSW-1 slipped. Allocation and manifest control unchanged. The sponsor's message was acknowledged and filed."
[[option.effect]]
flag = "ui:bar:spares"
[[option.effect]]
flag = "ui:project:align_driver"
[[option.effect]]
flag = "open_project:align_driver"
[[option.effect]]
flag = "tutorial_open"
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Reports the sponsor's schedule now shows the next hull as first delivery, with the station assumed to have continued. Recommends continuing."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Notes the crew were briefed on twelve months. Requests the board state the new date to the full crew before it is worked out individually."

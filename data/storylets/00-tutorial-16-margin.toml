id = "tut_margin"
title = "Consumables Margin"
act = 1
once = true
priority = 126
tags = ["tutorial", "air", "closure"]
text = """
On confirmation the ledger gains the consumables margin bar.

Margin is the smaller of two figures: the farm's food buffer and the time to
nitrogen exhaustion at the present make-up rate. It has not been above ten months
since landing.

The word beside the bar is the LSS-C closure fraction, not the margin itself.
Tight is 0.93 and above. Patched is 0.85 to 0.93: the loops are held by repairs
the fab improvised. Failing is below 0.85.

Margin does not measure comfort or output. It measures how long the station
functions with no arrival. Every other bar can be recovered from stock. This one
is recovered only by closing loops or by a hull.

{air} asks whether the figure goes to the sponsor or stays on station.
"""

[[when]]
turn_min = 16

[[when]]
turn_max = 22

[[when]]
fired = "tut_power"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "noted"
label = "Enter the margin and keep it on station"
text = "The figure is read at the head of the agenda with the make-up rate. It does not leave the station."
tags = ["air", "closure", "caution"]
chronicle = "MM {turn}. Consumables margin entered on the ledger, read with the N2 make-up rate at the head of the agenda and not reported off station."
[[option.effect]]
flag = "ui:bar:margin"
[[option.advice]]
seat = "air"
stance = "for"
text = "Reports closure at 0.90. The figure is the buffer, not the plan. It moves with the make-up rate and with the farm, and with nothing else the board controls."
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Notes the food buffer is the other half of the figure and that it falls with every additional crew member the sponsor sends."

[[option]]
id = "declare"
label = "Enter the margin and declare it to the sponsor"
text = "The figure goes in the packet as a standing line. A station that reports a margin has stated a date."
tags = ["air", "independence", "sponsor"]
chronicle = "MM {turn}. Consumables margin entered on the ledger and declared to the sponsor as a standing line in the quarterly packet."
[[option.effect]]
flag = "ui:bar:margin"
[[option.effect]]
flag = "margin_declared"
[[option.effect]]
q = "menace.suspicion"
add = 0.4
[[option.effect]]
q = "sponsor.attention"
add = 0.03
[[option.advice]]
seat = "air"
stance = "for"
text = "Recommends declaring it. Closure is 0.90 and the last tenth is uncosted. A figure in the packet is a figure somebody has to answer for at the far end."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Advises against. A margin in the packet is read as a request for evacuation planning by people who have never costed a loop. It is answered one window late."

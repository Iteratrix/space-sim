id = "tut_contract"
title = "MM 27: First Contract Expiry"
act = 1
once = true
priority = 130
tags = ["tutorial", "people"]
text = """
Status: {rotator}'s contract reaches its thirty-month term at the next RSW. The
paper provides a berth home on the sponsor hull. The window is on the
countdown.

{rotator} brought the paper to the board and did not open it.

{bodies} reports the isolation literature: the last quarter of a fixed term is
where people decide, and the decision is usually accurate.

The sponsor's roster has a column for headcount. It has no column for residence.
This is the first expiry on station; the board's answer sets the precedent for
every one after it.
"""

[[when]]
turn_min = 27

[[when]]
turn_max = 34

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "rotator"
rotator = true

[[option]]
id = "stay"
label = "Record {rotator} as a resident"
text = "The berth goes home empty. The roster gains a line the sponsor cannot classify."
tags = ["people", "independence"]
chronicle = "MM {turn}. {rotator} declined the return berth at contract expiry and was recorded as a station resident. Sponsor roster deviation logged."
[[option.effect]]
person = "rotator"
resident = true
[[option.effect]]
flag = "someone_stayed"
[[option.effect]]
q = "sponsor.confidence"
add = -0.02
[[option.advice]]
seat = "bodies"
stance = "for"
text = "Recommends residence. A person who has decided to stay and is sent home becomes a case study. One who stays becomes a colleague."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Reports a resident is a headcount line with no end date. The sponsor will ask who authorised it, and the board should have the answer first."

[[option]]
id = "go"
label = "Hold {rotator} to the paper"
text = "Home on the next hull. The berth is booked and a replacement requested."
tags = ["sponsor", "caution"]
chronicle = "MM {turn}. {rotator} rostered for return at the next window at contract expiry. Replacement requested against the manifest."
[[option.effect]]
person = "rotator"
leave = true
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends the paper. It is the only document on this station the sponsor and the board both signed. The replacement request goes with it."

[[option]]
id = "new_paper"
label = "Offer a second term"
text = "Thirty more months and an end date. The question returns with the paper."
tags = ["people", "hours"]
chronicle = "MM {turn}. {rotator} was offered a contract extension at expiry; accepted, pending the sponsor's approval."
[[option.effect]]
person = "rotator"
return_intent = -0.3
[[option.effect]]
counter = "extensions"
[[option.advice]]
seat = "hours"
stance = "for"
text = "Recommends the extension. It is a headcount line with an end date, and the sponsor has a column for that. Nothing has to be explained."

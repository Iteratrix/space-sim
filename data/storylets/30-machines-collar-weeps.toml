id = "collar_weeps"
title = "The Collar Weeps"
act = 1
cooldown = 30
weight = 0.5
priority = 0
tags = ["air", "nitrogen", "hulls"]
text = """
Status: the RJSA is passing nitrogen above trend. Not a failure. The rate is
a few kilograms above last season, and last season was above the one
before.
{air} has the ledger open at the SMB.
Constraint: the seal profile is sponsor polymer. {hulls} can patch from
shelf stock, attempt a cut seal from the polymer line, or defer.
"""

[[when]]
turn_min = 36

[[when]]
q = "menace.leak"
lt = 7

[[cast]]
role = "air"
seat = "air"

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "patch"
label = "Patch the seal from the shelf"
text = "Spares -12. One watch in the RJSA. N2 make-up -1.5. Holds one to two seasons."
tags = ["spares", "nitrogen", "air"]
chronicle = "The RJSA seal was patched from shelf stock. The nitrogen ledger was flat for one season."
[[option.requires]]
q = "stocks.spares"
ge = 12
[[option.effect]]
q = "stocks.spares"
add = -12
[[option.effect]]
q = "menace.leak"
add = -1.5
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead costs the choice at 12 units now or 800 kg later, and has run the sum at every SMB for a year."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer classes it as a patch and reports it is the only intervention completable within one watch."

[[option]]
id = "defer"
label = "Defer another season"
text = "Nitrogen -150 kg. N2 make-up +3.0. Parts retained for the loops."
tags = ["throughput", "spares", "risk"]
chronicle = "The RJSA was left to weep another season and the parts went to the loops. The ECLSS Lead recorded the figure."
[[option.effect]]
q = "menace.leak"
add = 3.0
[[option.effect]]
q = "stocks.nitrogen"
add = -150
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports loop LSS-C is on the quarterly and the RJSA is not. Recommends spending parts where the sponsor reads them."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports the rate does not fall under deferral. It rises, and it is counted either way."

[[option]]
id = "cut"
label = "Cut a seal from belt polymer"
text = "Spares -4. N2 make-up -0.8. Profile will be off-specification."
tags = ["capability", "independence", "hulls", "risk"]
chronicle = "A collar seal was cut from local polymer and fitted by arm units. The profile was off-specification within tolerance."
[[option.requires]]
q = "robots.arm"
ge = 3
[[option.effect]]
q = "menace.leak"
add = -0.8
[[option.effect]]
q = "stocks.spares"
add = -4
[[option.effect]]
flag = "seal_made"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer expects the first seal to be off-specification and the second to be less so. The capability is not acquired without the attempt."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead classes an off-specification seal as a named leak. Prefers the shelf patch."

id = "first_death_rites"
title = "What Is Done With the Body"
act = 1
once = true
tags = ["people", "closure", "water"]
text = """
Status: one deceased crew member is in the cold locker. No procedure covers
disposition. The next ship, if scheduled, is not equipped to carry remains.
{air} has stated the mass balance: 16 kg carbon, 2 kg nitrogen, 40 litres
water, and phosphorus the farm is short of. {bodies} has stated the other
position.
Constraint: whatever {outpost} does now becomes the standing procedure.
"""

[[when]]
flag = "first_death"

[[cast]]
role = "bodies"
seat = "bodies"

[[cast]]
role = "air"
seat = "air"

[[option]]
id = "plant"
label = "Inter the body in the farm beds"
text = "Mass stays in the loop. Named tile on the bed. Strain -0.05 across the crew."
tags = ["closure", "air", "independence"]
chronicle = "The body was interred in the farm beds under a named tile. Mass was retained in the loop."
[[option.effect]]
flag = "rock_plants"
[[option.effect]]
all_strain = -0.05
[[option.effect]]
q = "menace.grievance"
add = -0.3
[[option.effect]]
counter = "planted"
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports everything entering the beds returns as food. States a personal preference for the same disposition."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a repatriation form exists and is expected. Interment is not one of its options."

[[option]]
id = "launch"
label = "Launch the body on a line from the surface"
text = "Forty litres of water leave the loop permanently. Sea procedure, sewn, feet first."
tags = ["people", "risk"]
chronicle = "The body was launched on a line from the surface, sewn in cloth. Forty litres of water left the loop. The loss was entered in the book."
[[option.effect]]
flag = "hull_launches"
[[option.effect]]
q = "stocks.water"
add = -0.05
[[option.effect]]
all_strain = -0.03
[[option.effect]]
lexicon = "first_line_launch"
[[option.effect]]
counter = "launched"
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports this is the one disposition procedure the crew already know."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead costs the procedure at 40 litres and 2 kg of nitrogen from a loop already losing 45 kg a month."

[[option]]
id = "cold_store"
label = "Hold the body for the sponsor's ship"
text = "Locker occupied for one or more RSWs. Strain +0.05 across the crew. CCI +0.6."
tags = ["sponsor", "caution"]
chronicle = "The body was held in the cold locker for the sponsor's ship. The ship was late. Three accounts of the death were in circulation by its arrival."
[[option.effect]]
flag = "body_stored"
[[option.effect]]
all_strain = 0.05
[[option.effect]]
q = "menace.grievance"
add = 0.6
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports an inquiry is probable and requires remains. Local disposition redirects the inquiry to the outpost."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer cites the ICE case series: stored remains, no autopsy, rumour, and a durable loss of trust. Recommends against."

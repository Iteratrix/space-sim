id = "tut_driver_aligned"
title = "MDLS Alignment Complete"
act = 1
once = true
priority = 150
tags = ["tutorial", "throughput", "sponsor"]
text = """
The Mass Driver Launch System is aligned. The first pod went down the rail at
MM {turn}, and the catch confirmation from the Earth-side tug will arrive in
sixteen months; until then the MDLS is a line on the tasking board that reads
"throwing". {liaison} has the sentence the board will use: tonnes shipped per
tonne received, the one ratio on the quarterly. Everything the station does
that is not on that line is invisible from Earth.

The MDLS has three positions. Ship: everything above the water reserve goes in
the pods. Hold: only what the plant can spare this month. Stop. The SMB sets it.
"""

[[when]]
flag = "driver_aligned"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "ship"
label = "MDLS to Ship: everything above the reserve line"
text = "Feed the ratio. The reserve line is where the plant's output stops being the board's."
tags = ["throughput", "sponsor"]
chronicle = "MDLS alignment complete; first pod thrown MM {turn}. MDLS position: Ship. Throughput reporting begins."
[[option.effect]]
unflag = "driver_unaligned"
[[option.effect]]
flag = "throw_taught"
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.advice]]
seat = "liaison"
stance = "for"
text = "The board reads one number. As of this month the station produces it. I would not start by producing less of it than the plan says."
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Eight segments, and it throws true. Let it throw."

[[option]]
id = "hold"
label = "MDLS to Hold: ship only what the plant can spare"
text = "The tank fills first. The ratio grows slower and nobody here goes dry."
tags = ["water", "caution", "capability"]
chronicle = "MDLS alignment complete; first pod thrown MM {turn}. MDLS position: Hold at reserve. Throughput reporting begins."
[[option.effect]]
unflag = "driver_unaligned"
[[option.effect]]
flag = "throw_taught"
[[option.effect]]
q = "stocks.water"
add = 8
[[option.advice]]
seat = "extraction"
stance = "for"
text = "The plant is at rated for the first time. Let the tank see a full month of it before the driver does."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Hold is a smaller number on the only line they read, in the first quarter they read it. Ship for one window, then hold."

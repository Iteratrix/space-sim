id = "tut_driver_aligned"
title = "MDLS Alignment Complete"
act = 1
once = true
priority = 150
tags = ["tutorial", "throughput", "sponsor"]
text = """
The Mass Driver Launch System is aligned. The first pod went down the rail at MM
{turn} and the catch confirmation from the Earth-side tug will arrive in sixteen
months; until then the MDLS is a clock on the board that reads "throwing".
{liaison} has the sentence the board will use for the rest of this station's
life: tonnes shipped per tonne received, the one ratio on the quarterly.
Everything this station does that is not on that line is invisible from Earth.

The throw position is the select on the MDLS clock and it has three settings.
Ship: everything above the water reserve goes into the pods. Hold: only what the
plant can spare this month. Stop: nothing leaves. It is a standing setting — the
SMB sets it once and it holds until the SMB moves it. {hulls} wants it decided
tonight, while there is a pod on the rail and nobody has a habit yet.
"""

[[when]]
flag = "driver_aligned"

[[cast]]
role = "liaison"
seat = "liaison"

[[cast]]
role = "hulls"
seat = "hulls"

[[option]]
id = "ship"
label = "Throw position to Ship: everything above the reserve line"
text = "Feed the ratio. The reserve line is where the plant's output stops being the board's."
tags = ["throughput", "sponsor"]
chronicle = "MM {turn}. The MDLS alignment is complete and the first pod is thrown. Throw position set to Ship. Throughput reporting begins."
[[option.effect]]
unflag = "driver_unaligned"
[[option.effect]]
flag = "throw_ship"
[[option.effect]]
unflag = "throw_hold"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
flag = "throw_taught"
[[option.effect]]
q = "sponsor.confidence"
add = 0.05
[[option.advice]]
seat = "liaison"
stance = "for"
text = "The board reads one number. As of this month the station produces it. I would not begin by producing less of it than the plan says."
[[option.advice]]
seat = "air"
stance = "against"
text = "Everything above the reserve line is a line somebody drew before the loops were measured. I will find out where it should have been the month we are under it."

[[option]]
id = "hold"
label = "Throw position to Hold: ship only what the plant can spare"
text = "The tank fills first. The ratio grows slower and nobody here goes dry."
tags = ["water", "caution", "capability"]
chronicle = "MM {turn}. The MDLS alignment is complete and the first pod is thrown. Throw position set to Hold at reserve. Throughput reporting begins."
[[option.effect]]
unflag = "driver_unaligned"
[[option.effect]]
flag = "throw_hold"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
flag = "throw_taught"
[[option.effect]]
q = "stocks.water"
add = 8
[[option.advice]]
seat = "extraction"
stance = "for"
text = "The plant is at rated for the first time. Let the tank see a full month of it before the driver does."
[[option.advice]]
seat = "hours"
stance = "against"
text = "Hold is a smaller number on the only line they read, in the first quarter they read it. Ship for one window, then hold."

[[option]]
id = "stop"
label = "Throw position to Stop until the catch is confirmed"
text = "Sixteen months before anyone knows whether the tug caught the first pod. Throw nothing else until they do."
tags = ["caution", "capability", "risk"]
chronicle = "MM {turn}. The MDLS alignment is complete and the first pod is thrown. Throw position set to Stop pending catch confirmation. No further pods scheduled."
[[option.effect]]
unflag = "driver_unaligned"
[[option.effect]]
flag = "throw_stop"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_hold"
[[option.effect]]
flag = "throw_taught"
[[option.effect]]
q = "sponsor.confidence"
add = -0.05
[[option.advice]]
seat = "hulls"
stance = "for"
text = "One pod on a rail that has never been caught is an experiment. Sixteen pods is a habit. I would rather find out which of those we have before we build the habit."

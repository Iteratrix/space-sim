id = "first_through_wall"
title = "Arms Through the Wall"
act = 1
once = true
priority = 50
tags = ["machines", "capability", "hulls"]
text = """
Status: both through-wall manipulators on the carbonyl plant are wearing.
No replacements are scheduled.
{machinist} has submitted a proposal: hot-cell arms in belt steel with
seals from the polymer line. Below sponsor precision. Buildable in the
fabrication bay from shelf stock.
Effect if built: suit hours convert to shirt-sleeve hours and suit wear
falls. It would also be the first robot the outpost manufactured, and the
manifest's autonomy score would record it.
"""

[[when]]
q = "robots.through_wall"
lt = 1.85

[[when]]
q = "stocks.spares"
gt = 20

[[cast]]
role = "hulls"
seat = "hulls"

[[cast]]
role = "machinist"
skill = "engineering"

[[option]]
id = "build"
label = "Build the arms in belt steel"
text = "Spares -15. Through-wall units +1.0. One season of bay time."
tags = ["capability", "independence", "hulls", "spares"]
chronicle = "The first locally manufactured arms were fitted through the wall of the carbonyl plant that season."
[[option.effect]]
q = "robots.through_wall"
add = 1.0
[[option.effect]]
q = "stocks.spares"
add = -15
[[option.effect]]
flag = "through_wall_made"
[[option.effect]]
person = "machinist"
strain = -0.1
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer reports the inputs are steel, seals and one RSW of time, all of which the outpost produces. Rates it as the only robot certain to exist here in twenty years."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports the autonomy score is computed from the manifest. Every part made rather than ordered lowers it, and the sponsor uses the score as a proxy for control."
[[option.advice]]
seat = "air"
stance = "for"
text = "ECLSS Lead reports every suit hour is a suit seal and every suit seal leaks. The arms return nitrogen to the loop."

[[option]]
id = "order"
label = "Order the sponsor's pattern"
text = "Through-wall units +0.4 on arrival. Confidence +0.02. Existing arms nursed until the RSW."
tags = ["sponsor", "throughput"]
chronicle = "A manipulator was placed on the manifest and the existing arms were nursed until the RSW. The RSW delivered half of one unit."
[[option.effect]]
q = "robots.through_wall"
add = 0.4
[[option.effect]]
q = "sponsor.confidence"
add = 0.02
[[option.effect]]
flag = "through_wall_ordered"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports this is the manifest's designed use and shows an outpost operating its supply chain."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports thirty months for a crate that may not be aboard. The plant does not hold for thirty months."

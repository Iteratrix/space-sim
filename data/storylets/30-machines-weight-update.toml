id = "weight_update_missed"
title = "The Update That Did Not Come"
act = 1
once = true
priority = 60
tags = ["machines", "sponsor"]
text = """
Status: the quarterly weight update for the minds costs 216 h of dish
time per 100 GB. This quarter the dish time was not allocated. No message
states so.
{operator} detected it by output: {mind} answered a supply-catalogue query
with last year's prices. The minds' knowledge is frozen at the last update.
{operator} assesses this as the signature of a sponsor discontinuing a
service it has not yet decided to discontinue, and projects message traffic
as the next reduction.
"""

[[when]]
flag = "stage:2"

[[when]]
fired = "sponsor_weight_update"

[[cast]]
role = "operator"
skill = "operations"

[[cast]]
role = "liaison"
seat = "liaison"
optional = true

[[option]]
id = "tell_ring"
label = "Report the assessment to the SMB"
text = "Entered in the minutes. Strain +0.06 across the crew. Return intent falls."
tags = ["people", "machines", "independence"]
chronicle = "The operator reported to the SMB that the minds had stopped learning and what the signature indicated. The assessment was minuted."
[[option.effect]]
flag = "ring_told_updates"
[[option.effect]]
all_strain = 0.06
[[option.effect]]
all_return_intent = -0.03
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Chief Engineer prefers to identify the last crate as the last crate now rather than from an empty window."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports dish time is reallocated every quarter. The proposal reads a budget line as a forecast and the SMB will receive it as one."

[[option]]
id = "keep_quiet"
label = "Hold it in the hub"
text = "No minute. {operator} strain +0.15. Confidence unaffected."
tags = ["sponsor", "risk"]
chronicle = "The frozen update was held among the operators for a season. They were the only crew who knew why the mind's prices were wrong."
[[option.effect]]
flag = "updates_kept_quiet"
[[option.effect]]
person = "operator"
strain = 0.15
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports confidence is the one stock the SMB can reduce by speaking. Recommends the operators carry it."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead sets the nitrogen budget on what the sponsor knows. If the minds are not being told, neither is ECLSS."

[[option]]
id = "ask"
label = "Request the dish time formally"
text = "Attention +0.03. Confidence -0.03. Costs one month of the liaison's budget."
tags = ["sponsor", "machines"]
chronicle = "The missed dish-time allocation was requested in writing. The reply, one month late, thanked the outpost for its patience."
[[option.effect]]
q = "sponsor.attention"
add = 0.03
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
flag = "updates_requested"
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports an allocation request is in the sponsor's language. Anything else routes to the complaints desk."
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Chief Engineer reports the proposal spends remaining attention on a question whose answer is already assessed."

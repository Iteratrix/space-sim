id = "phasing"
once = true
title = "Phasing"
act = 1
cooldown = 12
weight = 0.6
tags = ["people", "families"]
text = """
Status: {one} and {other} have been aligning their watch ends for a month.
No performance effect recorded.
Constraint: {third} has skipped two watches, made a statement at the meal,
and requested transfer off {one}'s shift without stating a reason.
Note: the sponsor's fraternisation policy is in force and has not been
opened since transit.
"""

[[when]]
turn_min = 6

[[cast]]
role = "one"
skill = "agronomy"
min_skill = 1

[[cast]]
role = "other"
skill = "life_support"
min_skill = 1

[[cast]]
role = "third"

[[option]]
id = "let_be"
label = "Transfer {third} and record nothing further"
text = "Watches unchanged for {one} and {other}. {third} strain +0.05."
tags = ["people", "caution"]
chronicle = "{one} and {other} kept their watches. {third} was transferred to another shift with no reason recorded. The SMB took no further action."
[[option.effect]]
tie = ["one", "other"]
work_positive = 0.2
[[option.effect]]
tie = ["other", "one"]
work_positive = 0.2
[[option.effect]]
tie = ["third", "one"]
hindrance = 0.2
[[option.effect]]
person = "third"
strain = 0.05
[[option.advice]]
seat = "hours"
stance = "for"
text = "Logistics Lead moves crew between shifts every month. Recommends classing this as a shift change and not a policy matter."
[[option.advice]]
seat = "bodies"
stance = "against"
text = "Medical Officer reports the transfer relocates {third}'s position rather than resolving it. Expect recurrence at the meal."

[[option]]
id = "separate"
label = "Split {one} and {other} across the rota"
text = "Opposite shifts. Both strain +0.12. {third} strain -0.08. Loop cover degrades."
tags = ["sponsor", "hours"]
chronicle = "{one} and {other} were placed on opposite shifts, consistent with the sponsor's policy. Watch-end alignment resumed by other means."
[[option.effect]]
tie = ["one", "other"]
work_positive = -0.1
[[option.effect]]
person = "one"
strain = 0.12
[[option.effect]]
person = "other"
strain = 0.12
[[option.effect]]
person = "third"
strain = -0.08
[[option.effect]]
tie = ["one", "third"]
hindrance = 0.15
[[option.advice]]
seat = "liaison"
stance = "for"
text = "Sponsor Liaison reports the policy exists because the case has occurred on every prior station. Separation on the rota keeps it off the record."
[[option.advice]]
seat = "air"
stance = "against"
text = "ECLSS Lead reports both hold the loop rating. Opposite shifts leave the loop without a rated attendant who wants the watch."

[[option]]
id = "witness"
label = "Record it as a lay before the SMB"
text = "Terms written and witnessed. Strain -0.03 across the crew. {third} strain +0.1."
tags = ["families", "independence"]
chronicle = "{one} and {other} entered a lay before the SMB as witness, the first recorded on station. {third} attended."
[[option.effect]]
tie = ["one", "other"]
work_positive = 0.3
[[option.effect]]
tie = ["other", "one"]
work_positive = 0.3
[[option.effect]]
person = "third"
strain = 0.1
[[option.effect]]
all_strain = -0.03
[[option.effect]]
flag = "first_lay"
[[option.effect]]
counter = "lays_witnessed"
[[option.advice]]
seat = "extraction"
stance = "for"
text = "ISRU Lead reports every crewed vessel produces this case and the recorded ones ran better than the unrecorded."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "Sponsor Liaison reports a marriage registered by an outpost has no legal standing and invites a query about what else is being registered."

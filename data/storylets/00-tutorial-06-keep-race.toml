id = "tut_keep_race"
title = "MM 7: CED Ledger and STE Forecast"
act = 1
once = true
priority = 120
tags = ["tutorial", "dose", "bodies"]
text = """
Nobody at this table has been answering for the bodies. {bodies} opened the
Cumulative Effective Dose (CED) ledger on station for the first time this
morning and brought it to the SMB unasked, which is how the question arrives:
surface habitat under regolith bags, 120 millisieverts a year, ten a month,
every person, counted by name. The drum, when it exists: twelve a year. The
sponsor's career limit is 600 and there is no line for any of it on the tasking
list.

The Solar Transient Event (STE) forecast from Earth puts the next significant
event inside four months. The surface habitat has a storm shelter rated for one,
barely, and rated for eight people. {keep_status} has the excavation schedule
and will not give a completion month.
"""

[[when]]
turn_min = 7

[[when]]
not_flag = "keep_dug"

[[cast]]
role = "keep_status"
seat = "hulls"

[[cast]]
role = "bodies"
skill = "medical"

[[option]]
id = "priority_keep"
label = "SMB directive: KEEP excavation ahead of the plant and the driver"
text = "Ten millisieverts a month against one. Nothing else on this station trades at ten to one."
tags = ["dose", "people", "capability"]
chronicle = "MM {turn}. The CED ledger was opened on station. The SMB directed KEEP excavation ahead of the BOP and the MDLS until the drum is pressurised."
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
flag = "keep_priority"
[[option.effect]]
q = "sponsor.confidence"
add = -0.03
[[option.effect]]
all_strain = -0.03
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Twenty-four segments. On the free allocation it is a quarter; on what is left over it is two years, and the bags are the difference."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "The board's model has KEEP completion at MM 14 and does not couple it to MDLS output. A reduced MDLS allocation is visible from Earth. The CED ledger is not."

[[option]]
id = "hold_plan"
label = "Hold the allocation; the KEEP finishes when it finishes"
text = "The plan is the plan. The shelter is rated."
tags = ["throughput", "sponsor", "risk"]
chronicle = "MM {turn}. The CED ledger was opened on station. Allocation unchanged; KEEP excavation on the existing schedule. The STE shelter procedure was reviewed."
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
all_strain = 0.04
[[option.effect]]
q = "menace.grievance"
add = 0.5
[[option.advice]]
seat = "hours"
stance = "for"
text = "Every reallocation costs a month of learning the new clock. The schedule is slow because it is the schedule, not because it is wrong."
[[option.advice]]
seat = "extraction"
stance = "against"
text = "The plant is the one clock on this board that pays for itself every month it runs. Leave it alone and I will say nothing else about the drum."

[[option]]
id = "storm_shelter"
label = "Sleep in the storm shelter until the drum is dug"
text = "Sleep is a third of the exposure and the shelter cuts that third to nothing. Fourteen people in a room rated for eight; the ledger stops, the roster does not."
tags = ["dose", "people", "risk"]
chronicle = "MM {turn}. The CED ledger was opened on station. Crew relocated to the STE shelter for sleep periods pending KEEP completion. Berthing at 175 per cent of rating."
[[option.effect]]
flag = "seat:bodies"
[[option.effect]]
flag = "shelter_sleeping"
[[option.effect]]
all_strain = 0.08
[[option.effect]]
q = "menace.grievance"
add = 0.8
[[option.advice]]
seat = "hulls"
stance = "against"
text = "Eight berths, fourteen people, no privacy, for months. I have read the same ICE studies she has. They do not end well in a room that size."

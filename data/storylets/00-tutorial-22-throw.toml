id = "tut_throw_position"
title = "The Throw Position"
act = 1
priority = 105
weight = 0.6
cooldown = 10
tags = ["tutorial", "throughput", "water"]
text = """
The MDLS has thrown every month since the alignment and nobody has touched the
select on its clock since the month it was set. {extraction} raises it because
the plant's rate and the throw position are the same argument seen from two
ends: the plant decides how much water there is, the throw position decides how
much of it leaves.

Ship sends everything above the water reserve, and the reserve is a line drawn
before anyone measured this rock's loops. Hold sends only what the plant made
over what the station drank, so the tank grows and the ratio grows slower. Stop
sends nothing, and the pods stack on the pad against a window. It is a standing
setting: whatever the SMB leaves it on tonight is what the station does every
month until somebody comes back to this table and moves it.
"""

[[when]]
turn_min = 25

[[when]]
turn_max = 38

[[when]]
flag = "tutorial"

[[when]]
flag = "driver_aligned"

[[when]]
not_flag = "tutorial_done"

[[cast]]
role = "extraction"
seat = "extraction"

[[cast]]
role = "hours"
seat = "hours"

[[option]]
id = "ship"
label = "Throw position to Ship"
text = "Everything above the reserve goes into the pods. The ratio is the only line the sponsor reads and it is read every quarter."
tags = ["throughput", "sponsor"]
chronicle = "MM {turn}. The throw position was reviewed at the SMB and set to Ship: everything above the water reserve into the pods."
[[option.effect]]
flag = "throw_ship"
[[option.effect]]
unflag = "throw_hold"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
q = "sponsor.confidence"
add = 0.03
[[option.advice]]
seat = "hours"
stance = "for"
text = "The reserve line exists so that Ship is not a dangerous setting. Trust the line or move the line; do not split the difference by shipping less than it allows."
[[option.advice]]
seat = "air"
stance = "against"
text = "The reserve was set for fourteen people in a surface hab. It has not been recalculated for the drum, the farm or the number of people now drinking out of it."

[[option]]
id = "hold"
label = "Throw position to Hold at the reserve"
text = "Only what the plant makes over what the station drinks. The tank grows; the quarterly does not."
tags = ["water", "caution", "capability"]
chronicle = "MM {turn}. The throw position was reviewed at the SMB and set to Hold: nothing shipped that the plant has not made over the station's own draw."
[[option.effect]]
flag = "throw_hold"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_stop"
[[option.effect]]
q = "stocks.water"
add = 12
[[option.advice]]
seat = "extraction"
stance = "for"
text = "The plant is a rate, not a stock, and a rate can stop. A tank that is full when it stops is the difference between a bad month and an evacuation."

[[option]]
id = "stop"
label = "Throw position to Stop and stack the pods against the next window"
text = "Nothing leaves the rail until there is a hull to be counted against. The pads fill; the ratio reads zero."
tags = ["capability", "independence", "risk"]
chronicle = "MM {turn}. The throw position was reviewed at the SMB and set to Stop; pods to be stacked on the pad against the next window."
[[option.effect]]
flag = "throw_stop"
[[option.effect]]
unflag = "throw_ship"
[[option.effect]]
unflag = "throw_hold"
[[option.effect]]
q = "sponsor.confidence"
add = -0.04
[[option.effect]]
q = "menace.suspicion"
add = 0.4
[[option.advice]]
seat = "hulls"
stance = "for"
text = "Every pod on that rail is mass this station will never get back, thrown at a tug we have never had a confirmation from. I would like one confirmation before the next thousand tonnes."
[[option.advice]]
seat = "liaison"
stance = "against"
text = "A ratio of zero in a quarter in which the driver was working is not a number the sponsor's model can hold. It will be read as a station that stopped, and stations that stop are reviewed."
